# Generic demo configuration. Entity aliases are fictional.
# Resolve owner, list and calendar identifiers when publishing to a demo instance.
homeward:
  profile: homeward-dashboard-3
  owner: OWNER_ACCOUNT_ID
  url_path: configured
views:
- type: sections
  path: home
  title: Home
  max_columns: 3
  minimum_column_width: 320
  gap: 20
  sections:
  - type: grid
    column_span: 3
    minimum_column_width: 136
    gap: 12
    visibility:
    - condition: screen
      media_query: '(max-width: 599px)'
    cards:
    - type: grid
      columns: 2
      minimum_column_width: 136
      gap: 8
      grid_options:
        columns: full
      cards:
      - type: tile
        entity: alarm_control_panel.demo_alarm
        name: Alarm
        icon: mdi:shield-home
        presentation: summary
        tap_action:
          action: more-info
        grid_options:
          columns: 1
      - type: tile
        entity: cover.demo_garage_door
        name: Garage
        icon: mdi:garage
        presentation: summary
        tap_action:
          action: more-info
        grid_options:
          columns: 1
  - type: grid
    column_span: 3
    minimum_column_width: 136
    gap: 12
    visibility:
    - condition: screen
      media_query: '(min-width: 600px) and (max-width: 1023px)'
    cards:
    - type: grid
      columns: 4
      minimum_column_width: 136
      gap: 8
      grid_options:
        columns: full
      cards:
      - type: tile
        entity: alarm_control_panel.demo_alarm
        name: Alarm
        icon: mdi:shield-home
        presentation: summary
        tap_action:
          action: more-info
        grid_options:
          columns: 1
      - type: tile
        entity: cover.demo_garage_door
        name: Garage
        icon: mdi:garage
        presentation: summary
        tap_action:
          action: more-info
        grid_options:
          columns: 1
      - type: custom:homeward-thermostat
        title: Home Climate
        icon: mdi:thermometer
        entity: climate.demo_home
        current_temperature:
          entity: climate.demo_home
          field: current_temperature_celsius
        target_temperature:
          entity: climate.demo_home
          field: setpoint_celsius
        presentation: summary
        grid_options:
          columns: 1
        action: /configured/home#thermostat-home
        action_label: Adjust
      - type: tile
        entity: fan.demo_living_room_ceiling_fan
        grid_options:
          columns: 1
        name: Ceiling Fan
        features:
        - type: fan-speed
        tap_action:
          action: more-info
        presentation: summary
        icon: mdi:fan
  - type: grid
    column_span: 3
    minimum_column_width: 136
    gap: 12
    visibility:
    - condition: screen
      media_query: '(max-width: 1023px)'
    cards:
    - type: heading
      heading: Rooms
      grid_options:
        columns: full
    - type: grid
      columns: 4
      minimum_column_width: 136
      gap: 8
      grid_options:
        columns: full
      cards:
      - type: custom:homeward-room
        title: Living Room
        icon: mdi:sofa
        room_id: living-room
        activity_entities:
        - light.demo_living_room_lights
        active_states:
        - 'on'
        action: /configured/home#living-room
        grid_options:
          columns: 1
        temperature:
          entity: climate.demo_living_room
          field: current_temperature_celsius
      - type: custom:homeward-room
        title: Kitchen
        icon: mdi:knife
        room_id: kitchen
        activity_entities:
