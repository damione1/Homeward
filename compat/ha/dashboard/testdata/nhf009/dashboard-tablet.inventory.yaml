kiosk_mode:
  user_settings:
  - users:
    - kiosk2
    - kiosk
    kiosk: true
    block_overflow: true
views:
- title: Home
  type: sections
  max_columns: 3
  theme: Graphite
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Quick Controls
      heading_style: subtitle
    - type: custom:clock-weather-card
      entity: weather.maison
      sun_entity: sun.sun
      weather_icon_type: line
      animated_icon: false
      forecast_rows: 3
      locale: en
      time_format: '12'
    - type: tile
      entity: climate.home
      name: Home Climate
      features:
      - type: target-temperature
    - type: tile
      entity: scene.turn_off_main_floor
      name: Turn off lights
      icon: mdi:weather-night
      color: purple
      vertical: false
      features_position: bottom
    - type: tile
      entity: fan.living_room_ceiling_fan
      name: Ceiling Fan
      features:
      - type: fan-speed
    - type: tile
      entity: script.morning_routine_work_day
      name: Morning
      icon: mdi:coffee
      tap_action:
        action: toggle
      color: amber
  - type: grid
    cards:
    - type: heading
      heading: Rooms
      heading_style: subtitle
    - type: custom:bubble-card
      card_type: button
      entity: light.living_room_lights
      name: Living Room
      icon: mdi:sofa
      button_type: name
      show_state: true
      button_action:
        tap_action:
          action: navigate
          navigation_path: '#living-room'
    - type: custom:bubble-card
      card_type: button
      entity: light.kitchen_main_lights
      name: Kitchen
      icon: mdi:knife
