kiosk_mode:
  user_settings:
  - users:
    - kiosk_phone
    kiosk: true
    block_overflow: true
views:
- title: Home
  sections:
  - type: grid
    cards:
    - type: custom:mushroom-alarm-control-panel-card
      entity: alarm_control_panel.konnected_8813bf465e98_konnected_alarm
      states:
      - armed_home
      - armed_away
      fill_container: false
      layout: vertical
      grid_options:
        columns: full
    - features:
      - type: cover-open-close
      type: tile
      entity: cover.konnected_52362c_garage_door
      icon: mdi:garage
      vertical: true
      hide_state: false
      grid_options:
        columns: full
        rows: 6
      show_entity_picture: false
      state_content:
      - last_changed
      - state
      name: Garage Door
  - type: grid
    cards:
    - type: heading
      heading_style: title
      icon: mdi:mushroom
      heading: Rooms
    - type: horizontal-stack
      cards:
      - type: custom:mushroom-template-card
        primary: Living room
        icon: mdi:sofa-outline
        tap_action:
          action: navigate
          navigation_path: /lovelace/living-room
        secondary_info: none
        icon_color: purple
        fill_container: false
        multiline_secondary: false
        layout: vertical
        secondary: ''
      - type: custom:mushroom-template-card
        primary: Dining room
        icon: mdi:table-furniture
        tap_action:
          action: navigate
          navigation_path: /lovelace/dining-room
