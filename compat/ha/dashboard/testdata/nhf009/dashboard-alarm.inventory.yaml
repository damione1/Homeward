        icon_color: purple
        layout: vertical
        secondary: ''
      - type: custom:mushroom-template-card
        primary: Kitchen
        icon: mdi:knife
        tap_action:
          action: navigate
          navigation_path: /lovelace/kitchen
        secondary_info: none
        icon_color: purple
        layout: vertical
        secondary: ''
      grid_options:
        rows: auto
        columns: full
    - type: horizontal-stack
