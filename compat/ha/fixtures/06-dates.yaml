{
  "input_number": {
    "nha_days": {
      "min": 0,
      "max": 100
    }
  },
  "automation": [
    {
      "id": "nha_synthetic",
      "triggers": [
        {
          "trigger": "event",
          "event_type": "nha_test"
        }
      ],
      "actions": [
        {
          "action": "input_number.set_value",
          "target": {
            "entity_id": "input_number.nha_days"
          },
          "data": {
            "value": "{{ (now().date() - as_datetime('2024-03-09').date()).days }}"
          }
        }
      ],
      "mode": "single"
    }
  ]
}
