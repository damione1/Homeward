[workspace]
members = ["client/model", "client/wire", "client/app", "client/transport", "client/session", "client/platform", "client/cache", "client/actions", "qualification/frontend/charts-consumer"]
exclude = [".tools/frontend-kits/slint-kit/crates/kit", ".tools/frontend-kits/slint-kit/crates/kit-core", ".tools/frontend-kits/slint-kit/crates/kit-slint", ".tools/frontend-kits/slint-kit/crates/kit-build", ".tools/frontend-kits/slint-kit/crates/kit-native", "client/platform/vendor/slint-android-activity", "client/transport/vendor/connectrpc", ".tools/frontend-kits/pro/crates/kit-pro", ".tools/frontend-kits/pro/crates/kit-pro-build"]
resolver = "2"

[patch.crates-io]
i-slint-backend-android-activity = { path = "client/platform/vendor/slint-android-activity" }
connectrpc = { path = "client/transport/vendor/connectrpc" }

# Keep native drawing responsive during development. Application code retains
# its normal debug settings; these rendering dependencies run the pixel loops.
[profile.dev.package.i-slint-core]
opt-level = 2

[profile.dev.package.i-slint-renderer-software]
opt-level = 2

[profile.dev.package.i-slint-backend-winit]
opt-level = 2
