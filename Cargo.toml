[workspace]
members = ["client/model", "client/wire", "client/app", "client/transport", "client/session", "client/platform", "client/cache", "client/actions"]
exclude = ["client/platform/vendor/slint-android-activity", "client/transport/vendor/connectrpc", ".tools/frontend-kits/pro/crates/kit-pro", ".tools/frontend-kits/pro/crates/kit-pro-build"]
resolver = "2"

[patch.crates-io]
i-slint-backend-android-activity = { path = "client/platform/vendor/slint-android-activity" }
connectrpc = { path = "client/transport/vendor/connectrpc" }
