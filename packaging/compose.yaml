services:
  prepare:
    image: homeward-server:nha168
    build:
      context: ..
      dockerfile: packaging/Dockerfile
    entrypoint: ["/usr/local/bin/homeward-package", "prepare"]
    environment:
      HOMEWARD_HOSTNAME: ${HOMEWARD_HOSTNAME:-localhost}
    user: "10001:10001"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - homeward:/var/lib/homeward
      - credentials:/run/homeward-credentials
      - postgres:/existing-postgres:ro
    restart: "no"

  postgres:
    image: postgres:17.10-bookworm@sha256:9b18b78397054fce88a9552e9d5a3ad5bb7fd258c5b3cc1c5028e46373d6ea8f
    environment:
      POSTGRES_DB: homeward
      POSTGRES_USER: homeward
      POSTGRES_PASSWORD_FILE: /run/homeward-credentials/password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    depends_on:
      prepare:
        condition: service_completed_successfully
    volumes:
      - postgres:/var/lib/postgresql/data
      - credentials:/run/homeward-credentials:ro
    healthcheck:
      test: [CMD, pg_isready, -U, homeward, -d, homeward]
      interval: 5s
      timeout: 3s
      retries: 12
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  homed:
    image: homeward-server:nha168
    entrypoint: ["/usr/local/bin/homeward-package", "serve"]
    user: "10001:10001"
    depends_on:
      prepare:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    ports:
      - "${HOMEWARD_BIND_ADDRESS:-127.0.0.1}:8787:8787"
    volumes:
      - homeward:/var/lib/homeward
      - credentials:/run/homeward-credentials:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,uid=10001,gid=10001,mode=0700
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, /usr/local/bin/homeward-package, health]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s
    stop_grace_period: 15s
    restart: unless-stopped

volumes:
  homeward:
  credentials:
  postgres:
