name: Foundation checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.2'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.8'
      - run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: '1.52.1'
      - name: Install protoc 29.3
        run: |
          curl -fsSL https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-linux-x86_64.zip -o "$RUNNER_TEMP/protoc.zip"
          unzip -q "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"
      - run: make check
