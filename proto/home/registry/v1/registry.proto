syntax = "proto3";
package home.registry.v1;

import "home/helpers/v1/helpers.proto";
import "home/solar/v1/solar.proto";

option go_package = "github.com/damione1/Homeward/gen/home/registry/v1;registryv1";
message EntityId {
  string value = 1;
}
message EntityRef {
  reserved 3;
  reserved "legacy_name";
  oneof reference {
    string entity_id = 1;
    string ha_alias = 2;
  }
}

// Description is renderable even when the local codec is unknown. No executable code.
message CapabilityDescription {
  string schema_id = 1;
  uint32 major = 2;
  string display_name = 3;
  string endpoint = 4;
  bytes descriptor_set = 5;
  bytes descriptor_sha256 = 6;
  // Exactly one constraints branch is required at domain admission.
  oneof constraints {
    SwitchConstraints switch = 7;
    LightConstraints light = 8;
    FanConstraints fan = 9;
    ClimateConstraints climate = 10;
    MeasurementConstraints measurement = 11;
    BinaryConstraints binary = 12;
    ExtensionConstraints extension = 13;
    home.helpers.v1.HelperConstraints helper = 14;
    home.solar.v1.SolarConstraints solar = 15;
    home.solar.v1.SolarEventConstraints solar_event = 16;
  }
}

message NumberBounds {
  double minimum = 1;
  double maximum = 2;
  optional double step = 3;
}
message SwitchConstraints { bool set_on = 1; }
message LightConstraints {
  bool set_on = 1;
  NumberBounds brightness_percent = 2;
  NumberBounds color_temp_mireds = 3;
  NumberBounds transition_seconds = 4;
}
message FanConstraints {
  bool set_on = 1;
  repeated string speed_options = 2;
}
enum ClimateMode {
  CLIMATE_MODE_UNSPECIFIED = 0;
  CLIMATE_MODE_OFF = 1;
  CLIMATE_MODE_HEAT = 2;
  CLIMATE_MODE_COOL = 3;
  CLIMATE_MODE_AUTO = 4;
  CLIMATE_MODE_DRY = 5;
  CLIMATE_MODE_FAN_ONLY = 6;
}
enum ClimateActivity {
  CLIMATE_ACTIVITY_UNSPECIFIED = 0;
  CLIMATE_ACTIVITY_IDLE = 1;
  CLIMATE_ACTIVITY_HEATING = 2;
  CLIMATE_ACTIVITY_COOLING = 3;
  CLIMATE_ACTIVITY_DRYING = 4;
  CLIMATE_ACTIVITY_FAN_ONLY = 5;
}
message ClimateConstraints {
  // These first two fields authorize commands, independently of observations.
  NumberBounds setpoint_celsius = 1;
  repeated ClimateMode mode_options = 2;
  repeated ClimateActivity activity_options = 3; // Observations only.
  ClimateTemperatureObservation observed_temperature_celsius = 4;
  ClimateTemperatureObservation observed_setpoint_celsius = 5;
  ClimateSetpointRangeConstraints observed_setpoint_range_celsius = 6;
  repeated ClimateMode observed_mode_options = 7;
  bool observes_fan_activity = 8;
}
// Presence advertises an observation. Absent bounds mean unknown device limits.
message ClimateTemperatureObservation {
  NumberBounds bounds = 1;
}
// Presence advertises a pair, independently of simple setpoint commands.
message ClimateSetpointRangeConstraints {
  NumberBounds low_celsius = 1;
  NumberBounds high_celsius = 2;
  optional double minimum_delta_celsius = 3;
  optional double maximum_delta_celsius = 4;
}
enum MeasurementSemantic {
  MEASUREMENT_SEMANTIC_UNSPECIFIED = 0;
  MEASUREMENT_SEMANTIC_MEASUREMENT = 1;
  MEASUREMENT_SEMANTIC_TOTAL = 2;
  MEASUREMENT_SEMANTIC_TOTAL_INCREASING = 3;
}
enum MeasurementAggregation {
  MEASUREMENT_AGGREGATION_UNSPECIFIED = 0;
  MEASUREMENT_AGGREGATION_CURRENT = 1;
  MEASUREMENT_AGGREGATION_SUM = 2;
  MEASUREMENT_AGGREGATION_MEAN = 3;
}
message MeasurementConstraints {
  string unit = 1;
  uint32 precision = 2;
  MeasurementSemantic semantic = 3;
  MeasurementAggregation aggregation = 4;
  NumberBounds value = 5;
}
message BinaryConstraints { optional string device_class = 1; }
// The descriptor_set must contain action_message when commands are offered.
message ExtensionConstraints { optional string action_message = 1; }
