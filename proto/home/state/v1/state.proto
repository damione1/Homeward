syntax = "proto3";
package home.state.v1;

import "google/protobuf/timestamp.proto";
import "home/registry/v1/registry.proto";
import "home/helpers/v1/helpers.proto";
import "home/solar/v1/solar.proto";

option go_package = "github.com/damione1/Homeward/gen/home/state/v1;statev1";
enum Availability {
  AVAILABILITY_UNSPECIFIED = 0;
  AVAILABILITY_AVAILABLE = 1;
  AVAILABILITY_UNKNOWN = 2;
  AVAILABILITY_UNAVAILABLE = 3;
}
enum Freshness {
  FRESHNESS_UNSPECIFIED = 0;
  FRESHNESS_FRESH = 1;
  FRESHNESS_STALE = 2;
}
enum Provenance {
  PROVENANCE_UNSPECIFIED = 0;
  PROVENANCE_OBSERVED = 1;
  PROVENANCE_RESTORED = 2;
  PROVENANCE_ESTIMATED = 3;
}
message Quality {
  Availability availability = 1;
  Freshness freshness = 2;
  Provenance provenance = 3;
}

// A string decimal preserves cost precision; it is never a floating-point currency.
message Measurement {
  double value = 1;
  string unit = 2;
  optional string decimal_value = 3;
}
message LightValue {
  optional bool on = 1;
  optional double brightness_percent = 2;
  optional uint32 color_temp_mireds = 3;
}
enum FanSpeed {
  FAN_SPEED_UNSPECIFIED = 0;
  FAN_SPEED_OFF = 1;
  FAN_SPEED_LOW = 2;
  FAN_SPEED_MEDIUM = 3;
  FAN_SPEED_MEDIUM_HIGH = 4;
  FAN_SPEED_HIGH = 5;
}
// A present Off is distinct from an absent or unavailable fan reading.
message FanValue { FanSpeed speed = 1; }
// A present range requires both endpoints at operational admission.
message ClimateSetpointRange {
  optional double low_celsius = 1;
  optional double high_celsius = 2;
}
message ClimateValue {
  optional double current_temperature_celsius = 1;
  oneof setpoint {
    double setpoint_celsius = 2;
    ClimateSetpointRange setpoint_range_celsius = 3;
  }
  // Requested mode and observed physical activity are independent.
  optional home.registry.v1.ClimateMode mode = 4;
  optional home.registry.v1.ClimateActivity activity = 5;
  // Absent is not an observed false/off reading.
  optional bool fan_active = 6;
  optional double humidity_percent = 7;
  optional home.registry.v1.ClimateFanTarget fan_target = 8;
}
message ObservedState {
  home.registry.v1.EntityRef entity = 1;
  Quality quality = 2;
  uint64 revision = 3;
  google.protobuf.Timestamp observed_at = 4;
  google.protobuf.Timestamp received_at = 5;
  google.protobuf.Timestamp last_changed = 6;
  google.protobuf.Timestamp last_updated = 7;
  google.protobuf.Timestamp last_reported = 8;
  string source_session = 9;
  optional uint64 source_seq = 10;
  oneof value {
    bool switch_on = 11;
    Measurement measurement = 12;
    LightValue light = 13;
    FanValue fan = 14;
    ClimateValue climate = 15;
    home.helpers.v1.HelperValue helper = 16;
    home.solar.v1.SolarValue solar = 17;
    home.solar.v1.SolarEventValue solar_event = 18;
  }
}

// Cursor is bound to the authenticated view. Authorization/filter changes require resync.
message ViewCursor {
  string epoch = 1;
  uint64 global_sequence = 2;
  uint64 config_revision = 3;
  uint64 authorization_revision = 4;
  bytes filter_sha256 = 5;
  bytes config_sha256 = 6;
  // Opaque, process-local proof binding actor, grant, filter and issue time.
  bytes admission_proof = 7;
  bytes grant_sha256 = 8;
}
enum ActionAccess {
  ACTION_ACCESS_UNSPECIFIED = 0;
  ACTION_ACCESS_DENIED = 1;
  ACTION_ACCESS_ALLOWED = 2;
}
// Current permission for an already readable capability slot. This is not a
// command admission: the server revalidates rights and arguments on Submit.
message CapabilityActionAccess {
  string schema_id = 1;
  string endpoint = 2;
  ActionAccess access = 3;
}
// One registry identity and its declarations/state from the same capture.
message ViewEntity {
  string entity_id = 1;
  string device_id = 2;
  string original_alias = 3;
  string current_alias = 4;
  repeated string historical_aliases = 5;
  repeated home.registry.v1.CapabilityDescription capabilities = 6;
  ObservedState state = 7;
  // Absent entries are unknown, never implicitly writable. These facts share
  // the enclosing snapshot's authorization/configuration references.
  repeated CapabilityActionAccess action_access = 8;
}
message ViewFilter {
  repeated string entity_ids = 1;
}
message OpenViewRequest {
  ViewFilter filter = 1;
  uint32 page_size = 2;
}
message OpenViewResponse {
  string snapshot_token = 1;
  ViewCursor cursor = 2;
  repeated ObservedState states = 3;
  repeated home.registry.v1.CapabilityDescription capabilities = 4;
  string next_page_token = 5;
  google.protobuf.Timestamp expires_at = 6;
  repeated ViewEntity entities = 7;
}
message ReadPageRequest {
  string snapshot_token = 1;
  string page_token = 2;
}
message ReadPageResponse {
  OpenViewResponse page = 1;
}
message WatchViewRequest {
  ViewCursor cursor = 1;
  // Complete filter; the digest in cursor is only a comparison value.
  ViewFilter filter = 2;
}
message StateDelta {
  repeated ObservedState states = 1;
}
enum ResyncReason {
  RESYNC_REASON_UNSPECIFIED = 0;
  RESYNC_REASON_EPOCH_CHANGED = 1;
  RESYNC_REASON_REPLAY_EXPIRED = 2;
  RESYNC_REASON_CONFIGURATION_CHANGED = 3;
  RESYNC_REASON_AUTHORIZATION_CHANGED = 4;
  RESYNC_REASON_FILTER_CHANGED = 5;
  RESYNC_REASON_INVALID_CURSOR = 6;
  RESYNC_REASON_CLIENT_SLOW = 7;
  RESYNC_REASON_REGISTRY_CHANGED = 8;
  RESYNC_REASON_CAPABILITIES_CHANGED = 9;
  RESYNC_REASON_REGISTRY_UNAVAILABLE = 10;
  RESYNC_REASON_FRAME_TOO_LARGE = 11;
}
message ResyncRequired {
  ResyncReason reason = 1;
  string message = 2;
}
message WatchViewResponse {
  uint64 stream_sequence = 1;
  ViewCursor cursor = 2;
  oneof frame {
    StateDelta delta = 3;
    ResyncRequired resync_required = 4;
  }
}

// Schema only. HTTP/Connect serving and client transport belong to later tickets.
service StateService {
  rpc OpenView(OpenViewRequest) returns (OpenViewResponse);
  rpc ReadPage(ReadPageRequest) returns (ReadPageResponse);
  rpc WatchView(WatchViewRequest) returns (stream WatchViewResponse);
}
