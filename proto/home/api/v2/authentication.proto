syntax = "proto3";

package home.api.v2;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/damione1/Homeward/gen/home/api/v2;apiv2";
option java_multiple_files = true;
option java_outer_classname = "AuthenticationProto";
option java_package = "com.home.api.v2";

// Account administration uses current native account rights. Syntax/existence
// diagnostics follow authentication and authorization. Mutations have no
// automatic replay guarantee; UNKNOWN requires reconciliation, never a retry.
service AccountService {
  // Reads metadata under the same native admission as the collection. No credential secret is returned.
  rpc GetInvitation(GetInvitationRequest) returns (Invitation) {
    option (google.api.http) = {get: "/v2/{name=homes/*/invitations/*}"};
    option (google.api.method_signature) = "name";
  }
  // Creates a account.
  rpc CreateAccount(CreateAccountRequest) returns (Account) {
    option (google.api.http) = {
      post: "/v2/{parent=homes/*}/accounts"
      body: "account"
    };
    option (google.api.method_signature) = "parent,account,account_id";
  }
  // Gets the authorized account.
  rpc GetAccount(GetAccountRequest) returns (Account) {
    option (google.api.http) = {get: "/v2/{name=homes/*/accounts/*}"};
    option (google.api.method_signature) = "name";
  }
  // Lists the authorized accounts using bounded opaque pagination.
  rpc ListAccounts(ListAccountsRequest) returns (ListAccountsResponse) {
    option (google.api.http) = {get: "/v2/{parent=homes/*}/accounts"};
    option (google.api.method_signature) = "parent";
  }
  // Updates the authorized account.
  rpc UpdateAccount(UpdateAccountRequest) returns (Account) {
    option (google.api.http) = {
      patch: "/v2/{account.name=homes/*/accounts/*}"
      body: "account"
    };
    option (google.api.method_signature) = "account,update_mask";
  }
  // Deletes the authorized account.
  rpc DeleteAccount(DeleteAccountRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v2/{name=homes/*/accounts/*}"};
    option (google.api.method_signature) = "name,etag";
  }
  // One-shot issuance, not a standard Create returning reusable metadata only.
  rpc IssueInvitation(IssueInvitationRequest) returns (IssueInvitationResponse) {
    option (google.api.http) = {
      post: "/v2/{parent=homes/*}/invitations:issue"
      body: "*"
    };
  }
  // The invitation bearer authenticates this one-shot transition. Failure does
  // not disclose account existence; acceptance never creates a login session.
  rpc AcceptInvitation(AcceptInvitationRequest) returns (AcceptInvitationResponse) {
    option (google.api.http) = {
      post: "/v2:acceptInvitation"
      body: "*"
    };
  }
  // Lists the authorized invitations using bounded opaque pagination.
  rpc ListInvitations(ListInvitationsRequest) returns (ListInvitationsResponse) {
    option (google.api.http) = {get: "/v2/{parent=homes/*}/invitations"};
    option (google.api.method_signature) = "parent";
  }
  // Revocation preserves native audit metadata; it does not delete the row.
  rpc RevokeInvitation(RevokeInvitationRequest) returns (RevokeInvitationResponse) {
    option (google.api.http) = {
      post: "/v2/{name=homes/*/invitations/*}:revoke"
      body: "*"
    };
  }
  // Gets the authorized second factor policy.
  rpc GetSecondFactorPolicy(GetSecondFactorPolicyRequest) returns (SecondFactorPolicy) {
    option (google.api.http) = {get: "/v2/{name=homes/*/secondFactorPolicy}"};
    option (google.api.method_signature) = "name";
  }
  // Custom security transition: it may revoke sessions and returns the caller's
  // continuation explicitly. Native CAS and MFA publication remain atomic.
  rpc ChangeSecondFactorPolicy(ChangeSecondFactorPolicyRequest) returns (ChangeSecondFactorPolicyResponse) {
    option (google.api.http) = {
      post: "/v2/{name=homes/*/secondFactorPolicy}:change"
      body: "*"
    };
  }
}

// TLS is mandatory. Anonymous here means the request carries its own login,
// refresh, or enrollment proof; it never bypasses native credential admission.
// Enrollment performs its own native-session or restricted-grant admission.
service AuthService {
  // Reads metadata under the same native admission as the collection. No credential secret is returned.
  rpc GetFactorCredential(GetFactorCredentialRequest) returns (FactorCredential) {
    option (google.api.http) = {get: "/v2/{name=homes/*/accounts/*/factorCredentials/*}"};
    option (google.api.method_signature) = "name";
  }
  // Reads metadata under the same native admission as the collection. No credential secret is returned.
  rpc GetSession(GetSessionRequest) returns (Session) {
    option (google.api.http) = {get: "/v2/{name=homes/*/accounts/*/sessions/*}"};
    option (google.api.method_signature) = "name";
  }
  // Starts password authentication and returns the offered next step without revealing account existence.
  rpc StartLogin(StartLoginRequest) returns (StartLoginResponse) {
    option (google.api.http) = {
      post: "/v2:startLogin"
      body: "*"
    };
  }
  // Consumes the offered factor proof and issues credentials for the resulting native session.
  rpc CompleteLogin(CompleteLoginRequest) returns (CompleteLoginResponse) {
    option (google.api.http) = {
      post: "/v2:completeLogin"
      body: "*"
    };
  }
  // Renews the same native session using the saved renewal key; uncertain replies do not authorize a new operation.
  rpc RefreshSession(RefreshSessionRequest) returns (RefreshSessionResponse) {
    option (google.api.http) = {
      post: "/v2:refreshSession"
      body: "*"
    };
  }
  // Lists the authorized sessions using bounded opaque pagination.
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse) {
    option (google.api.http) = {get: "/v2/{parent=homes/*/accounts/*}/sessions"};
    option (google.api.method_signature) = "parent";
  }
  // Revokes the selected session.
  rpc RevokeSession(RevokeSessionRequest) returns (RevokeSessionResponse) {
    option (google.api.http) = {
      post: "/v2/{name=homes/*/accounts/*/sessions/*}:revoke"
      body: "*"
    };
  }
  // Offers a bounded enrollment challenge to the authorized caller.
  rpc BeginFactorEnrollment(BeginFactorEnrollmentRequest) returns (BeginFactorEnrollmentResponse) {
    option (google.api.http) = {
      post: "/v2/{parent=homes/*/accounts/*}/factorCredentials:beginEnrollment"
      body: "*"
    };
  }
  // Consumes the enrollment proof and returns newly issued recovery material once.
  rpc CompleteFactorEnrollment(CompleteFactorEnrollmentRequest) returns (CompleteFactorEnrollmentResponse) {
    option (google.api.http) = {
      post: "/v2/{parent=homes/*/accounts/*}/factorCredentials:completeEnrollment"
      body: "*"
    };
  }
  // Lists the authorized factor credentials using bounded opaque pagination.
  rpc ListFactorCredentials(ListFactorCredentialsRequest) returns (ListFactorCredentialsResponse) {
    option (google.api.http) = {get: "/v2/{parent=homes/*/accounts/*}/factorCredentials"};
    option (google.api.method_signature) = "parent";
  }
  // Removes the selected factor credential.
  rpc RemoveFactorCredential(RemoveFactorCredentialRequest) returns (RemoveFactorCredentialResponse) {
    option (google.api.http) = {
      post: "/v2/{name=homes/*/accounts/*/factorCredentials/*}:remove"
      body: "*"
    };
  }
  // Replaces recovery codes under the native security preconditions and returns them once.
  rpc ReplaceRecoveryCodes(ReplaceRecoveryCodesRequest) returns (ReplaceRecoveryCodesResponse) {
    option (google.api.http) = {
      post: "/v2/{name=homes/*/accounts/*}:replaceRecoveryCodes"
      body: "*"
    };
  }
}

// Key management itself requires an interactive session. An issued key has MCP
// audience only and is rejected on every public Connect route, including these.
service McpKeyService {
  // Reads metadata under the same native admission as the collection. No credential secret is returned.
  rpc GetMcpKey(GetMcpKeyRequest) returns (McpKey) {
    option (google.api.http) = {get: "/v2/{name=homes/*/accounts/*/mcpKeys/*}"};
    option (google.api.method_signature) = "name";
  }
  // Issues a key under the caller's permitted MCP scopes; returns its secret once.
  rpc IssueMcpKey(IssueMcpKeyRequest) returns (IssueMcpKeyResponse) {
    option (google.api.http) = {
      post: "/v2/{parent=homes/*/accounts/*}/mcpKeys:issue"
      body: "*"
    };
  }
  // Lists the authorized mcp keys using bounded opaque pagination.
  rpc ListMcpKeys(ListMcpKeysRequest) returns (ListMcpKeysResponse) {
    option (google.api.http) = {get: "/v2/{parent=homes/*/accounts/*}/mcpKeys"};
    option (google.api.method_signature) = "parent";
  }
  // Revokes the selected mcp key.
  rpc RevokeMcpKey(RevokeMcpKeyRequest) returns (RevokeMcpKeyResponse) {
    option (google.api.http) = {
      post: "/v2/{name=homes/*/accounts/*/mcpKeys/*}:revoke"
      body: "*"
    };
  }
}

// Reads and replaces the native human authorization policy under current administrative authority.
service AuthorizationPolicyService {
  // Gets the native default or stored authorization policy visible to the caller.
  rpc GetAuthorizationPolicy(GetAuthorizationPolicyRequest) returns (AuthorizationPolicy) {
    option (google.api.http) = {get: "/v2/{name=homes/*/accounts/*/authorizationPolicy}"};
    option (google.api.method_signature) = "name";
  }
  // Exact document replacement with the native absence/CAS union. This is an
  // atomic security transition and reports whether effective rights changed.
  rpc ReplaceAuthorizationPolicy(ReplaceAuthorizationPolicyRequest) returns (ReplaceAuthorizationPolicyResponse) {
    option (google.api.http) = {
      post: "/v2/{name=homes/*/accounts/*/authorizationPolicy}:replace"
      body: "*"
    };
  }
}

// An account's mutable metadata. Passwords are accepted only on creation and
// are never returned. Updating role/access preserves the native last-admin rule
// and invalidates affected credentials under the same native transaction.
message Account {
  option (google.api.resource) = {
    type: "homeward.damiengoehrig.ca/Account"
    pattern: "homes/{home}/accounts/{account}"
    singular: "account"
    plural: "accounts"
  };
  // Canonical resource name. Uses the pattern declared on the resource message.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  // Required on creation; ignored when omitted in UpdateAccount. Immutable native login, never used as resource ID.
  string login_name = 2 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.field_behavior) = IMMUTABLE
  ];
  // Required on creation; optional on update. Human-readable label, not identity or authority.
  string display_name = 3 [(google.api.field_behavior) = OPTIONAL];
  // Required on creation; optional on update. Internal routines do not acquire a human role.
  AccountRole role = 4 [(google.api.field_behavior) = OPTIONAL];
  // Optional. Creation defaults to ENABLED; UpdateAccount changes access only when selected by the update mask.
  AccountAccess access = 5 [(google.api.field_behavior) = OPTIONAL];
  // Verified active enrollment only; does not imply a session satisfied MFA.
  bool second_factor_enabled = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Time when this resource was created; absent when no historical creation time was recorded.
  google.protobuf.Timestamp create_time = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Time of the latest recorded resource update.
  google.protobuf.Timestamp update_time = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Opaque native metadata CAS, required for update/delete. Not a credential.
  string etag = 9;
  // Required on CreateAccount only; ignored as output and forbidden in updates.
  string initial_password = 10 [
    (google.api.field_behavior) = INPUT_ONLY,
    (google.api.field_behavior) = OPTIONAL
  ];
}

// Invitation metadata contains no bearer secret. IssueInvitation emits its
// separate token exactly once; list pages cannot recover it.
message Invitation {
  option (google.api.resource) = {
    type: "homeward.damiengoehrig.ca/Invitation"
    pattern: "homes/{home}/invitations/{invitation}"
    singular: "invitation"
    plural: "invitations"
  };
  // Canonical resource name. Uses the pattern declared on the resource message.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  // Native account login. Distinct from the canonical account resource name.
  string login_name = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Human account role. Internal routines do not acquire a human role.
  AccountRole role = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Time when this resource or credential expires.
  google.protobuf.Timestamp expire_time = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Time when this resource was created; absent when no historical creation time was recorded.
  google.protobuf.Timestamp create_time = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Time when the invitation was accepted, if acceptance was recorded.
  google.protobuf.Timestamp accept_time = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Time when revocation was recorded; absent when no revocation was recorded.
  google.protobuf.Timestamp revoke_time = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Instance MFA policy. Absent configuration is the native false policy, never
// an inferred authenticated/enrolled state.
message SecondFactorPolicy {
  option (google.api.resource) = {
    type: "homeward.damiengoehrig.ca/SecondFactorPolicy"
    pattern: "homes/{home}/secondFactorPolicy"
    singular: "secondFactorPolicy"
    plural: "secondFactorPolicies"
  };
  // Canonical resource name. Uses the pattern declared on the resource message.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  // Whether the native policy requires a second factor for administrators.
  bool require_admin_factor = 2;
  // Time of the latest recorded resource update.
  google.protobuf.Timestamp update_time = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Native policy revision and exact source hash; never the account revision.
  string etag = 4;
}

// Request for create account.
message CreateAccountRequest {
  // Canonical parent resource under which this request is authorized.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "homeward.damiengoehrig.ca/Account"
  ];
  // The account represented by Account.
  Account account = 2 [(google.api.field_behavior) = REQUIRED];
  // Optional public ID, lowercase letter followed by lowercase letters, digits or hyphens, at most 63 characters, without a trailing hyphen. Omission allocates an ID. Native identity remains independent.
  string account_id = 3 [(google.api.field_behavior) = OPTIONAL];
}

// Request for get account.
message GetAccountRequest {
  // Canonical resource name. Uses the pattern declared on the resource message.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "homeward.damiengoehrig.ca/Account"
  ];
}

// Request for list accounts.
message ListAccountsRequest {
  // Canonical parent resource under which this request is authorized.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "homeward.damiengoehrig.ca/Account"
  ];
  // Default 50, maximum 100. Negative is invalid; larger values clamp to 100.
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];
  // Opaque, bounded, bound to the caller/credential/current rights and parent.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];
}

// Successful result of list accounts.
message ListAccountsResponse {
  // Collection of accounts for this message.
  repeated Account accounts = 1;
  // Opaque continuation for the next page. Empty when no continuation is available.
  string next_page_token = 2;
}

// Request for update account.
message UpdateAccountRequest {
  // The account represented by Account.
  Account account = 1 [(google.api.field_behavior) = REQUIRED];
  // Mutable paths: display_name, role, access. Absent means populated fields;
  // present empty means no-op; * selects all three. CAS is checked even on no-op.
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = OPTIONAL];
}

// Request for delete account.
message DeleteAccountRequest {
  // Canonical resource name. Uses the pattern declared on the resource message.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "homeward.damiengoehrig.ca/Account"
  ];
  // Opaque revision token for optimistic concurrency. Compare it without interpretation.
  string etag = 2 [(google.api.field_behavior) = REQUIRED];
  // Explicitly permits deleting existing sessions, factors and MCP keys. Otherwise child resources prevent deletion.
  bool force = 3 [(google.api.field_behavior) = OPTIONAL];
}

// Request for issue invitation.
message IssueInvitationRequest {
  // Canonical parent resource under which this request is authorized.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "homeward.damiengoehrig.ca/Invitation"
  ];
  // Native account login. Distinct from the canonical account resource name.
  string login_name = 2 [(google.api.field_behavior) = REQUIRED];
  // Human account role. Internal routines do not acquire a human role.
  AccountRole role = 3 [(google.api.field_behavior) = REQUIRED];
  // Time when this resource or credential expires.
  google.protobuf.Timestamp expire_time = 4 [(google.api.field_behavior) = REQUIRED];
}

// Successful result of issue invitation.
message IssueInvitationResponse {
  // The invitation represented by Invitation.
  Invitation invitation = 1;
  // Returned once. Never persist in an idempotency result, audit, or log.
  string invitation_token = 2;
}

// Request for accept invitation.
message AcceptInvitationRequest {
  // One-time invitation secret. Cannot be recovered by listing invitation metadata.
  string invitation_token = 1 [(google.api.field_behavior) = REQUIRED];
  // Password supplied for this authentication attempt. Never returned or included in diagnostics.
  string password = 2 [(google.api.field_behavior) = REQUIRED];
  // Human-readable label. Does not identify the resource or grant permission.
  string display_name = 3 [(google.api.field_behavior) = REQUIRED];
}

// Successful result of accept invitation.
message AcceptInvitationResponse {
  // The account represented by Account.
  Account account = 1;
}

// Request for list invitations.
message ListInvitationsRequest {
  // Canonical parent resource under which this request is authorized.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "homeward.damiengoehrig.ca/Invitation"
  ];
  // Default 50; maximum 100; negative is invalid.
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];
  // Opaque continuation from the preceding page. Keep all other query parameters unchanged.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];
}

// Successful result of list invitations.
message ListInvitationsResponse {
  // Collection of invitations for this message.
  repeated Invitation invitations = 1;
  // Opaque continuation for the next page. Empty when no continuation is available.
  string next_page_token = 2;
}

// Request for revoke invitation.
message RevokeInvitationRequest {
  // Canonical resource name. Uses the pattern declared on the resource message.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "homeward.damiengoehrig.ca/Invitation"
  ];
}

// Successful result of revoke invitation.
message RevokeInvitationResponse {}

// Request for get second factor policy.
message GetSecondFactorPolicyRequest {
  // Canonical resource name. Uses the pattern declared on the resource message.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "homeward.damiengoehrig.ca/SecondFactorPolicy"
  ];
}

// Request for change second factor policy.
message ChangeSecondFactorPolicyRequest {
  // Canonical resource name. Uses the pattern declared on the resource message.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "homeward.damiengoehrig.ca/SecondFactorPolicy"
  ];
  // Whether the native policy requires a second factor for administrators.
  bool require_admin_factor = 2 [(google.api.field_behavior) = OPTIONAL];
  // Opaque revision token for optimistic concurrency. Compare it without interpretation.
  string etag = 3 [(google.api.field_behavior) = REQUIRED];
}

// Successful result of change second factor policy.
message ChangeSecondFactorPolicyResponse {
  // The policy represented by SecondFactorPolicy.
  SecondFactorPolicy policy = 1;
  // The continuation represented by SecondFactorSessionContinuation.
  SecondFactorSessionContinuation continuation = 2;
}

// Represents session.
message Session {
  option (google.api.resource) = {
    type: "homeward.damiengoehrig.ca/Session"
    pattern: "homes/{home}/accounts/{account}/sessions/{session}"
    singular: "session"
    plural: "sessions"
  };
  // Canonical resource name. Uses the pattern declared on the resource message.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  // Time when this resource was created; absent when no historical creation time was recorded.
  google.protobuf.Timestamp create_time = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Sliding session/refresh-family expiry, distinct from access-token expiry.
  google.protobuf.Timestamp expire_time = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Time when revocation was recorded; absent when no revocation was recorded.
  google.protobuf.Timestamp revoke_time = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Time of the last recorded use; absence does not mean a use occurred.
  google.protobuf.Timestamp last_use_time = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Recorded authentication proof category, independent of account enrollment.
  AuthenticationSatisfaction authentication_satisfaction = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Time of the recorded authentication proof; absent for unrecorded historical evidence.
  google.protobuf.Timestamp authentication_time = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Represents factor credential.
message FactorCredential {
  option (google.api.resource) = {
    type: "homeward.damiengoehrig.ca/FactorCredential"
    pattern: "homes/{home}/accounts/{account}/factorCredentials/{factor_credential}"
    singular: "factorCredential"
    plural: "factorCredentials"
  };
  // Canonical resource name. Uses the pattern declared on the resource message.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  // The kind represented by FactorKind.
  FactorKind kind = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Time when this resource was created; absent when no historical creation time was recorded.
  google.protobuf.Timestamp create_time = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Time of the last recorded use; absence does not mean a use occurred.
  google.protobuf.Timestamp last_use_time = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Bearer values occur only in successful login/refresh responses, never Session.
message SessionTokens {
  // The session represented by Session.
  Session session = 1;
  // The audience represented by CredentialAudience.
  CredentialAudience audience = 2;
  // Secret bearer access credential. Never log it or use it as a resource identity.
  string access_token = 3;
  // Time when the access token expires, independently of the refresh credential.
  google.protobuf.Timestamp access_expire_time = 4;
  // Secret refresh credential. Recover only the same durably saved renewal operation after an uncertain response.
  string refresh_token = 5;
}

// Represents fido2 assertion challenge.
message Fido2AssertionChallenge {
  // Typed challenge offered for this flow. Its expiry and proof alternatives remain authoritative.
  bytes challenge = 1;
  // WebAuthn relying-party identifier bound to the configured public origin.
  string rp_id = 2;
  // Credential identifiers admitted for this challenge.
  repeated bytes allowed_credential_ids = 3;
  // The instance id associated with this message.
  string instance_id = 4;
  // The origin associated with this message.
  string origin = 5;
}

// Represents fido2 enrollment challenge.
message Fido2EnrollmentChallenge {
  // Typed challenge offered for this flow. Its expiry and proof alternatives remain authoritative.
  bytes challenge = 1;
  // WebAuthn relying-party identifier bound to the configured public origin.
  string rp_id = 2;
  // Exact bytes representing user id. Not interpreted as a display string.
  bytes user_id = 3;
  // The user name associated with this message.
  string user_name = 4;
  // The instance id associated with this message.
  string instance_id = 5;
  // The origin associated with this message.
  string origin = 6;
}

// Represents recovery code challenge.
message RecoveryCodeChallenge {}

// Describes one proof alternative actually offered by the native authentication owner.
message FactorOption {
  oneof method {
    // The fido2 represented by Fido2AssertionChallenge.
    Fido2AssertionChallenge fido2 = 1;
    // One-time recovery proof. Never log it or reuse it after successful consumption.
    RecoveryCodeChallenge recovery_code = 2;
  }
}

// Ephemeral ceremony, not a readable resource. Completion must match one of
// these distinct options; recovery code is never a silent FIDO2 downgrade.
message FactorChallenge {
  // Opaque identifier of the exact offered challenge.
  string challenge_id = 1;
  // Time when this resource or credential expires.
  google.protobuf.Timestamp expire_time = 2;
  // Collection of options for this message.
  repeated FactorOption options = 3;
}

// Represents enrollment challenge.
message EnrollmentChallenge {
  // Opaque identifier of the exact offered challenge.
  string challenge_id = 1;
  // Time when this resource or credential expires.
  google.protobuf.Timestamp expire_time = 2;
  // The fido2 represented by Fido2EnrollmentChallenge.
  Fido2EnrollmentChallenge fido2 = 3;
}

// Carries an exact WebAuthn assertion for native challenge verification.
message Fido2Assertion {
  // Opaque native credential identifier scoped to the account.
  bytes credential_id = 1 [(google.api.field_behavior) = REQUIRED];
  // Exact WebAuthn authenticator-data bytes to verify.
  bytes authenticator_data = 2 [(google.api.field_behavior) = REQUIRED];
  // Exact WebAuthn client-data bytes. Verified against the offered challenge and origin.
  bytes client_data_json = 3 [(google.api.field_behavior) = REQUIRED];
  // Cryptographic assertion signature, not a display value.
  bytes signature = 4 [(google.api.field_behavior) = REQUIRED];
  // Optional opaque WebAuthn user handle returned by the authenticator.
  optional bytes user_handle = 5 [(google.api.field_behavior) = OPTIONAL];
  // Server recomputes it from client_data_json; client bytes are untrusted.
  bytes client_data_hash = 6 [(google.api.field_behavior) = REQUIRED];
}

// Carries an exact WebAuthn enrollment attestation for native verification.
message Fido2Attestation {
  // Opaque native credential identifier scoped to the account.
  bytes credential_id = 1 [(google.api.field_behavior) = REQUIRED];
  // Exact WebAuthn client-data bytes. Verified against the offered challenge and origin.
  bytes client_data_json = 2 [(google.api.field_behavior) = REQUIRED];
  // Exact WebAuthn attestation object for enrollment verification.
  bytes attestation_object = 3 [(google.api.field_behavior) = REQUIRED];
  // SHA-256 hash of the exact client-data bytes.
  bytes client_data_hash = 4 [(google.api.field_behavior) = REQUIRED];
}

// Selects one proof matching the offered authentication challenge.
// Exactly one offered proof must be selected; fields in the selected proof are required as annotated.
message FactorProof {
  oneof proof {
    // The fido2 represented by Fido2Assertion.
    Fido2Assertion fido2 = 1;
    // One-time recovery proof. Never log it or reuse it after successful consumption.
    string recovery_code = 2;
  }
}

// This grant is accepted only for enrollment, never for a business/API session.
message EnrollmentRequired {
  // The account associated with this message.
  string account = 1 [(google.api.resource_reference).type = "homeward.damiengoehrig.ca/Account"];
  // Short-lived secret authorizing the offered enrollment flow.
  string enrollment_token = 2;
  // Time when this resource or credential expires.
  google.protobuf.Timestamp expire_time = 3;
}

// Selects exactly one authenticated, challenge or enrollment outcome.
message LoginDecision {
  oneof outcome {
    // The authenticated represented by SessionTokens.
    SessionTokens authenticated = 1;
    // Typed challenge offered for this flow. Its expiry and proof alternatives remain authoritative.
    FactorChallenge challenge = 2;
    // The enrollment required represented by EnrollmentRequired.
    EnrollmentRequired enrollment_required = 3;
  }
}

// Request for start login.
message StartLoginRequest {
  // Native account login. Distinct from the canonical account resource name.
  string login_name = 1 [(google.api.field_behavior) = REQUIRED];
  // Password supplied for this authentication attempt. Never returned or included in diagnostics.
  string password = 2 [(google.api.field_behavior) = REQUIRED];
}

// Successful result of start login.
message StartLoginResponse {
  // The decision represented by LoginDecision.
  LoginDecision decision = 1;
}

// Request for complete login.
message CompleteLoginRequest {
  // Opaque identifier of the exact offered challenge.
  string challenge_id = 1 [(google.api.field_behavior) = REQUIRED];
  // Exactly one proof matching the offered challenge; unknown alternatives are rejected.
  FactorProof proof = 2 [(google.api.field_behavior) = REQUIRED];
}

// Successful result of complete login.
message CompleteLoginResponse {
  // The decision represented by LoginDecision.
  LoginDecision decision = 1;
}

// Request for refresh session.
message RefreshSessionRequest {
  // Secret refresh credential. Recover only the same durably saved renewal operation after an uncertain response.
  string refresh_token = 1 [(google.api.field_behavior) = REQUIRED];
  // Exactly 32 random bytes, saved durably before dispatch. Retry only this same
  // token/key; native NHA-198 can recover only its still-current successor.
  bytes renewal_key = 2 [(google.api.field_behavior) = REQUIRED];
}

// Successful result of refresh session.
message RefreshSessionResponse {
  // The tokens represented by SessionTokens.
  SessionTokens tokens = 1;
}

