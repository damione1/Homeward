syntax = "proto3";
package home.api.v2;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/field_info.proto";
import "google/api/resource.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/damione1/Homeward/gen/home/api/v2;apiv2";
option java_multiple_files = true;
option java_outer_classname = "ConfigurationPlansProto";
option java_package = "com.home.api.v2";

// Optional, non-mutating previews on the common TLS listener. Native human
// admin + current GLOBAL_CONFIGURATION/ADMINISTER, with current 050 policy.
// Neither watcher autoactivation nor internal routines require these endpoints.
service ConfigurationPlanService {
  option (google.api.default_host) = "homeward.damiengoehrig.ca";
  // Compiles explicit source once into a bounded redacted diagnostic capture.
  rpc CreateConfigurationPlan(CreateConfigurationPlanRequest) returns (ConfigurationPlan) {
    option (google.api.http) = {
      post: "/v2/{parent=homes/*}/configurationPlans"
      body: "configuration_plan"
    };
    option (google.api.method_signature) = "parent,configuration_plan";
  }
  // Reads this caller credential's unexpired capture without recompilation.
  rpc GetConfigurationPlan(GetConfigurationPlanRequest) returns (ConfigurationPlan) {
    option (google.api.http) = {get: "/v2/{name=homes/*/configurationPlans/*}"};
    option (google.api.method_signature) = "name";
  }
  // Lists a stable capture of this caller credential's current plan metadata.
  rpc ListConfigurationPlans(ListConfigurationPlansRequest) returns (ListConfigurationPlansResponse) {
    option (google.api.http) = {get: "/v2/{parent=homes/*}/configurationPlans"};
    option (google.api.method_signature) = "parent";
  }
  // Recompiles explicit bytes against the same native receipt without extending
  // this capture's lifetime. It never grants application permission.
  rpc RevalidateConfigurationPlan(RevalidateConfigurationPlanRequest) returns (ConfigurationPlan) {
    option (google.api.http) = {
      post: "/v2/{name=homes/*/configurationPlans/*}:revalidate"
      body: "*"
    };
    option (google.api.method_signature) = "name";
  }
}

// Represents configuration plan source file.
message ConfigurationPlanSourceFile {
  // Logical path within the candidate source bundle, never an arbitrary host filesystem path.
  string logical_path = 1 [(google.api.field_behavior) = REQUIRED];
  // Exact source-file bytes; comments and formatting are preserved.
  bytes exact_source = 2 [(google.api.field_behavior) = REQUIRED];
}

// Carries exact source files for validation without activating configuration.
message ConfigurationPlanCandidate {
  // The family represented by ConfigurationPlanSourceFamily.
  ConfigurationPlanSourceFamily family = 1 [(google.api.field_behavior) = REQUIRED];
  // Logical document/account/dashboard/selected-logic identity, never a path.
  string identity = 2 [(google.api.field_behavior) = REQUIRED];
  // Logical entry file within the supplied candidate bundle.
  string entry = 3 [(google.api.field_behavior) = REQUIRED];
  // Collection of files for this message.
  repeated ConfigurationPlanSourceFile files = 4 [(google.api.field_behavior) = REQUIRED];
}

// Represents configuration plan base.
message ConfigurationPlanBase {
  // The kind represented by ConfigurationPlanBaseKind.
  ConfigurationPlanBaseKind kind = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Present only for SQL; absence is never revision zero claimed as active.
  optional int64 revision = 2;
  // SHA-256 digest of the exact source bytes, without reserialization.
  optional bytes source_sha256 = 3;
}

// Represents configuration plan change.
message ConfigurationPlanChange {
  // The effect represented by ConfigurationPlanEffect.
  ConfigurationPlanEffect effect = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The operation represented by ConfigurationPlanChangeOperation.
  ConfigurationPlanChangeOperation operation = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Closed compiler-owned field name; no source values, comments or parser text.
  string field = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The references added represented by uint32.
  int32 references_added = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The references removed represented by uint32.
  int32 references_removed = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Represents configuration plan.
message ConfigurationPlan {
  option (google.api.resource) = {
    type: "homeward.damiengoehrig.ca/ConfigurationPlan"
    pattern: "homes/{home}/configurationPlans/{configuration_plan}"
    singular: "configurationPlan"
    plural: "configurationPlans"
  };
  // Immutable process-epoch capture identity; never permission to activate.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  // The state represented by ConfigurationPlanState.
  ConfigurationPlanState state = 22 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Account resource of the native author captured when this plan was built.
  string author = 2 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference).type = "homeward.damiengoehrig.ca/Account"
  ];
  // The family represented by ConfigurationPlanSourceFamily.
  ConfigurationPlanSourceFamily family = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The identity associated with this message.
  string identity = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Version of the selected source schema; distinct from SQL schema and active generation.
  string schema_version = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  // SHA-256 digest of the exact source bytes, without reserialization.
  bytes source_sha256 = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Absent for a rejected candidate; exact-source and manifest hashes differ.
  optional bytes semantic_sha256 = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Native configuration base against which the candidate is interpreted.
  ConfigurationPlanBase base = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Native configuration generation revision, independent of document version.
  int64 generation_revision = 9 [(google.api.field_behavior) = OUTPUT_ONLY];
  // SHA-256 digest identifying the complete configuration manifest.
  bytes manifest_sha256 = 10 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Exact bytes representing observed workspace sha256. Not interpreted as a display string.
  bytes observed_workspace_sha256 = 11 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The effect represented by ConfigurationPlanEffect.
  ConfigurationPlanEffect effect = 12 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Collection of changes for this message.
  repeated ConfigurationPlanChange changes = 13 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Collection of diagnostics for this message.
  repeated ConfigurationPlanDiagnosticCode diagnostics = 14 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Process-epoch authenticated metadata only. Not authorization or approval.
  string receipt = 15 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Always false in this diagnostic service. Apply remains a separate owner.
  bool application_available = 16 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Capture lifetime is bounded by native receipt validity and ten minutes.
  google.protobuf.Timestamp create_time = 17 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Time when this resource or credential expires.
  google.protobuf.Timestamp expire_time = 18 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Opaque diagnostic metadata revision; no publication authority.
  string etag = 19;
  // Last diagnostic revalidation, without extending create/expiry times.
  google.protobuf.Timestamp update_time = 21 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Exact explicit source input. Never returned by Get/List or any error.
  ConfigurationPlanCandidate candidate = 20 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = INPUT_ONLY
  ];
}

// Request for create configuration plan.
message CreateConfigurationPlanRequest {
  // Optional public identifier: 1..63 lowercase letters, digits or hyphens,
  // beginning with a letter and ending with a letter or digit. When absent the
  // server allocates an identifier. A requested collision is ALREADY_EXISTS.
  string configuration_plan_id = 4 [(google.api.field_behavior) = OPTIONAL];
  // Canonical parent resource under which this request is authorized.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "homeward.damiengoehrig.ca/ConfigurationPlan"
  ];
  // Admitted configuration plan. Creating or reading it does not activate configuration.
  ConfigurationPlan configuration_plan = 2 [(google.api.field_behavior) = REQUIRED];
  // UUID identifying this intent for 24-hour replay of its original capture.
  string request_id = 3 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.field_info).format = UUID4
  ];
}

// Request for revalidate configuration plan.
message RevalidateConfigurationPlanRequest {
  // Canonical resource name. Uses the pattern declared on the resource message.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "homeward.damiengoehrig.ca/ConfigurationPlan"
  ];
  // Source candidate to validate or simulate; validation does not activate it.
  ConfigurationPlanCandidate candidate = 2 [(google.api.field_behavior) = REQUIRED];
  // Opaque token from the exact plan capture; compared without normalization.
  string etag = 3 [(google.api.field_behavior) = REQUIRED];
  // UUID identifying this intent for 24-hour replay of its original capture.
  string request_id = 4 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.field_info).format = UUID4
  ];
}

// Request for get configuration plan.
message GetConfigurationPlanRequest {
  // Canonical resource name. Uses the pattern declared on the resource message.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "homeward.damiengoehrig.ca/ConfigurationPlan"
  ];
}

// Request for list configuration plans.
message ListConfigurationPlansRequest {
  // Canonical parent resource under which this request is authorized.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "homeward.damiengoehrig.ca/ConfigurationPlan"
  ];
  // Zero selects 100; negative fails; larger values are clamped to 100.
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];
  // Opaque continuation from the preceding page. Keep all other query parameters unchanged.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];
}

// Successful result of list configuration plans.
message ListConfigurationPlansResponse {
  // Collection of configuration plans for this message.
  repeated ConfigurationPlan configuration_plans = 1;
  // Opaque continuation for the next page. Empty when no continuation is available.
  string next_page_token = 2;
}

// Closed variants select existing Homeward compilers. No caller-defined schema.
enum ConfigurationPlanSourceFamily {
  // No explicit configuration plan source family. Does not select an action.
  CONFIGURATION_PLAN_SOURCE_FAMILY_UNSPECIFIED = 0;
  // Selects operational for configuration plan source family.
  CONFIGURATION_PLAN_SOURCE_FAMILY_OPERATIONAL = 1;
  // Selects declarative v1 for configuration plan source family.
  CONFIGURATION_PLAN_SOURCE_FAMILY_DECLARATIVE_V1 = 2;
  // Selects declarative v2 for configuration plan source family.
  CONFIGURATION_PLAN_SOURCE_FAMILY_DECLARATIVE_V2 = 3;
  // Selects authorization for configuration plan source family.
  CONFIGURATION_PLAN_SOURCE_FAMILY_AUTHORIZATION = 4;
  // Selects ownership for configuration plan source family.
  CONFIGURATION_PLAN_SOURCE_FAMILY_OWNERSHIP = 5;
  // Selects dashboard for configuration plan source family.
  CONFIGURATION_PLAN_SOURCE_FAMILY_DASHBOARD = 6;
  // Selects automation for configuration plan source family.
  CONFIGURATION_PLAN_SOURCE_FAMILY_AUTOMATION = 7;
  // Selects script for configuration plan source family.
  CONFIGURATION_PLAN_SOURCE_FAMILY_SCRIPT = 8;
  // Selects scene for configuration plan source family.
  CONFIGURATION_PLAN_SOURCE_FAMILY_SCENE = 9;
}

// Defines the closed vocabulary for configuration plan state.
enum ConfigurationPlanState {
  // No explicit configuration plan state. Does not select an action.
  CONFIGURATION_PLAN_STATE_UNSPECIFIED = 0;
  // Selects admitted for configuration plan state.
  CONFIGURATION_PLAN_STATE_ADMITTED = 1;
  // Selects rejected for configuration plan state.
  CONFIGURATION_PLAN_STATE_REJECTED = 2;
  // Selects stale for configuration plan state.
  CONFIGURATION_PLAN_STATE_STALE = 3;
}

// Defines the closed vocabulary for configuration plan base kind.
enum ConfigurationPlanBaseKind {
  // No explicit configuration plan base kind. Does not select an action.
  CONFIGURATION_PLAN_BASE_KIND_UNSPECIFIED = 0;
  // Selects active sql for configuration plan base kind.
  CONFIGURATION_PLAN_BASE_KIND_ACTIVE_SQL = 1;
  // Selects immutable reference for configuration plan base kind.
  CONFIGURATION_PLAN_BASE_KIND_IMMUTABLE_REFERENCE = 2;
  // Selects no active document for configuration plan base kind.
  CONFIGURATION_PLAN_BASE_KIND_NO_ACTIVE_DOCUMENT = 3;
}

// Defines the closed vocabulary for configuration plan effect.
enum ConfigurationPlanEffect {
  // No explicit configuration plan effect. Does not select an action.
  CONFIGURATION_PLAN_EFFECT_UNSPECIFIED = 0;
  // Selects none for configuration plan effect.
  CONFIGURATION_PLAN_EFFECT_NONE = 1;
  // Selects dashboard for configuration plan effect.
  CONFIGURATION_PLAN_EFFECT_DASHBOARD = 2;
  // Selects configuration for configuration plan effect.
  CONFIGURATION_PLAN_EFFECT_CONFIGURATION = 3;
  // Selects human rights for configuration plan effect.
  CONFIGURATION_PLAN_EFFECT_HUMAN_RIGHTS = 4;
  // Selects technical ownership for configuration plan effect.
  CONFIGURATION_PLAN_EFFECT_TECHNICAL_OWNERSHIP = 5;
  // Selects run targets for configuration plan effect.
  CONFIGURATION_PLAN_EFFECT_RUN_TARGETS = 6;
}

// Defines the closed vocabulary for configuration plan change operation.
enum ConfigurationPlanChangeOperation {
  // No explicit configuration plan change operation. Does not select an action.
  CONFIGURATION_PLAN_CHANGE_OPERATION_UNSPECIFIED = 0;
  // Selects added for configuration plan change operation.
  CONFIGURATION_PLAN_CHANGE_OPERATION_ADDED = 1;
  // Selects removed for configuration plan change operation.
  CONFIGURATION_PLAN_CHANGE_OPERATION_REMOVED = 2;
  // Selects replaced for configuration plan change operation.
  CONFIGURATION_PLAN_CHANGE_OPERATION_REPLACED = 3;
}

// Defines the closed vocabulary for configuration plan diagnostic code.
enum ConfigurationPlanDiagnosticCode {
  // No explicit configuration plan diagnostic code. Does not select an action.
  CONFIGURATION_PLAN_DIAGNOSTIC_CODE_UNSPECIFIED = 0;
  // Selects invalid schema for configuration plan diagnostic code.
  CONFIGURATION_PLAN_DIAGNOSTIC_CODE_INVALID_SCHEMA = 1;
  // Selects excluded reference for configuration plan diagnostic code.
  CONFIGURATION_PLAN_DIAGNOSTIC_CODE_EXCLUDED_REFERENCE = 2;
  // Selects unsupported source for configuration plan diagnostic code.
  CONFIGURATION_PLAN_DIAGNOSTIC_CODE_UNSUPPORTED_SOURCE = 3;
  // Selects capacity for configuration plan diagnostic code.
  CONFIGURATION_PLAN_DIAGNOSTIC_CODE_CAPACITY = 4;
  // Selects base unavailable for configuration plan diagnostic code.
  CONFIGURATION_PLAN_DIAGNOSTIC_CODE_BASE_UNAVAILABLE = 5;
}
