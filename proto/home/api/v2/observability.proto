syntax = "proto3";
package home.api.v2;
import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "home/api/v2/recorder_evidence.proto";
option go_package = "github.com/damione1/Homeward/gen/home/api/v2;apiv2";
option java_multiple_files = true;
option java_outer_classname = "ObservabilityProto";
option java_package = "com.home.api.v2";

// Read-only projections of native owners. No provider payload, labels, arbitrary
// attributes, secrets, or command authority are represented by these messages.
// A controller name is resolved by its membership in the current Metrics cut;
// a run name identifies the native run selected by QueryRunTrace. Neither
// relation creates a second registry or permits access without current rights.
option (google.api.resource_definition) = {
 type: "homeward.damiengoehrig.ca/RuntimeController"
 pattern: "homes/{home}/runtimeControllers/{runtime_controller}"
};
option (google.api.resource_definition) = {
 type: "homeward.damiengoehrig.ca/RuntimeRun"
 pattern: "homes/{home}/runtimeControllers/{runtime_controller}/runs/{run}"
};

message ObservationProcessObservationEpoch {
  bytes value = 1;
}

enum ObservationReadUnavailableReason {
  OBSERVATION_READ_UNAVAILABLE_REASON_UNSPECIFIED = 0;
  OBSERVATION_READ_UNAVAILABLE_REASON_NOT_OBSERVED = 1;
  OBSERVATION_READ_UNAVAILABLE_REASON_PRODUCER_STOPPED = 2;
  OBSERVATION_READ_UNAVAILABLE_REASON_INTEGRITY = 3;
  OBSERVATION_READ_UNAVAILABLE_REASON_CORE_UNAVAILABLE = 4;
  OBSERVATION_READ_UNAVAILABLE_REASON_STORAGE_UNAVAILABLE = 5;
  OBSERVATION_READ_UNAVAILABLE_REASON_AUTHORITY_UNAVAILABLE = 6;
  OBSERVATION_READ_UNAVAILABLE_REASON_TIME_BUDGET = 7;
  OBSERVATION_READ_UNAVAILABLE_REASON_COMPLETION_UNKNOWN = 8;
}

message ObservationReadUnavailable {
  ObservationReadUnavailableReason reason = 1;
}

enum ObservationLiveness {
  OBSERVATION_LIVENESS_UNSPECIFIED = 0;
  // Processing this read proves only the process is live at this cut.
  OBSERVATION_LIVENESS_LIVE = 1;
}

enum ObservationServerReadiness {
  OBSERVATION_SERVER_READINESS_UNSPECIFIED = 0;
  OBSERVATION_SERVER_READINESS_STARTING = 1;
  OBSERVATION_SERVER_READINESS_READY = 2;
  OBSERVATION_SERVER_READINESS_DRAINING = 3;
  OBSERVATION_SERVER_READINESS_CORE_UNAVAILABLE = 4;
}

enum ObservationCoreCause {
  OBSERVATION_CORE_CAUSE_UNSPECIFIED = 0;
  OBSERVATION_CORE_CAUSE_GENERATION_NOT_LOADED = 1;
  OBSERVATION_CORE_CAUSE_REGISTRY_UNAVAILABLE = 2;
  OBSERVATION_CORE_CAUSE_CONTROL_ADMISSIONS_CLOSED = 3;
  OBSERVATION_CORE_CAUSE_OWNERS_NOT_STARTED = 4;
  OBSERVATION_CORE_CAUSE_LISTENER_NOT_READY = 5;
  OBSERVATION_CORE_CAUSE_SHUTTING_DOWN = 6;
}

message ObservationActiveRevision {
  // An actually admitted active revision, in 1..INT64_MAX. Never invented.
  uint64 value = 1;
}

message ObservationGenerationPresence {
  oneof result {
    ObservationActiveRevision present = 1;
    google.protobuf.Empty not_loaded = 2;
  }
}

enum ObservationDurableAvailability {
  OBSERVATION_DURABLE_AVAILABILITY_UNSPECIFIED = 0;
  OBSERVATION_DURABLE_AVAILABILITY_AVAILABLE = 1;
  OBSERVATION_DURABLE_AVAILABILITY_DEGRADED = 2;
  OBSERVATION_DURABLE_AVAILABILITY_UNAVAILABLE = 3;
  OBSERVATION_DURABLE_AVAILABILITY_NOT_CONFIGURED = 4;
  OBSERVATION_DURABLE_AVAILABILITY_UNKNOWN = 5;
}

message ObservationDurableHealth {
  ObservationDurableAvailability availability = 1;
  // UNKNOWN requires not_observed. All other values require the UTC instant of
  // a real admitted local fact. This is not a permanent database probe.
  oneof evidence {
    google.protobuf.Timestamp observed_at = 2;
    google.protobuf.Empty not_observed = 3;
  }
}

enum ObservationPilotPhase {
  OBSERVATION_PILOT_PHASE_UNSPECIFIED = 0;
  OBSERVATION_PILOT_PHASE_STARTING = 1;
  OBSERVATION_PILOT_PHASE_RUNNING = 2;
  OBSERVATION_PILOT_PHASE_RETRYING = 3;
  OBSERVATION_PILOT_PHASE_DEGRADED = 4;
  OBSERVATION_PILOT_PHASE_STOPPED = 5;
}

message ObservationPilotPhaseCount {
  ObservationPilotPhase phase = 1;
  uint64 instances = 2;
}

enum ObservationRecorderPhase {
  OBSERVATION_RECORDER_PHASE_UNSPECIFIED = 0;
  OBSERVATION_RECORDER_PHASE_RUNNING = 1;
  OBSERVATION_RECORDER_PHASE_WRITING = 2;
  OBSERVATION_RECORDER_PHASE_BACKOFF = 3;
  OBSERVATION_RECORDER_PHASE_STOPPING = 4;
  OBSERVATION_RECORDER_PHASE_FAILED = 5;
  OBSERVATION_RECORDER_PHASE_STOPPED = 6;
}

enum ObservationRecorderHealthState {
  OBSERVATION_RECORDER_HEALTH_STATE_UNSPECIFIED = 0;
  OBSERVATION_RECORDER_HEALTH_STATE_OPERATING = 1;
  OBSERVATION_RECORDER_HEALTH_STATE_DEGRADED = 2;
  OBSERVATION_RECORDER_HEALTH_STATE_FAILED = 3;
}

message ObservationRecorderHealthFact {
  ObservationRecorderPhase phase = 1;
  ObservationRecorderHealthState state = 2;
  google.protobuf.Timestamp observed_at = 3;
}

message ObservationRecorderHealth {
  oneof result {
    ObservationRecorderHealthFact observed = 1;
    google.protobuf.Empty not_installed = 2;
    ObservationReadUnavailable unavailable = 3;
  }
}

message ObservationServerHealth {
  ObservationServerReadiness readiness = 1;
  ObservationGenerationPresence generation = 2;
  // At most six distinct known causes; READY requires no causes and a present
  // generation, open core admissions/owners/projection, and the ready listener.
  repeated ObservationCoreCause causes = 3;
}

message Health {
  option (google.api.resource) = {type: "homeward.damiengoehrig.ca/Health" pattern: "homes/{home}/health" singular: "health" plural: "health"};
  string name = 20 [(google.api.field_behavior) = IDENTIFIER];
  ObservationProcessObservationEpoch process_epoch = 1;
  ObservationLiveness liveness = 2;
  ObservationServerHealth server = 3;
  ObservationDurableHealth durable = 4;
  ObservationRecorderHealth recorder = 5;
  // Exactly one entry per known nonzero phase, not a metric per integration.
  repeated ObservationPilotPhaseCount pilots = 6;
}

message ObservationIntegrationReport {
  ObservationIntegrationHealthStatus status = 1;
  // The source's private detail is deliberately absent from the schema.
  oneof admission_time {
    google.protobuf.Timestamp admitted_at = 2;
    google.protobuf.Empty not_recorded = 3;
  }
}

message ObservationIntegrationReportPresence {
  oneof result {
    ObservationIntegrationReport present = 1;
    google.protobuf.Empty no_report = 2;
  }
}

message ObservationSupervisedIntegration {
  ObservationPilotPhase phase = 1;
  uint64 attempts = 2;
  uint64 tasks = 3;
}

message ObservationIntegrationSupervision {
  oneof result {
    ObservationSupervisedIntegration supervised = 1;
    google.protobuf.Empty not_supervised = 2;
  }
}

message ObservationSaturatedCounter {
  // Must equal UINT64_MAX. Reaching that value exactly is still an exact
  // counter; only a subsequent attempted overflow produces this variant.
  uint64 value = 1;
}

message ObservationCounterMeasurement {
  oneof result {
    uint64 exact = 1;
    ObservationSaturatedCounter saturated = 2;
    google.protobuf.Empty not_measured = 3;
    ObservationReadUnavailable unavailable = 4;
  }
}

message ObservationGaugeMeasurement {
  oneof result {
    uint64 value = 1;
    google.protobuf.Empty not_measured = 2;
    ObservationReadUnavailable unavailable = 3;
  }
}

message ObservationPositionMeasurement {
  oneof result {
    AdmissionPosition value = 1;
    ObservationReadUnavailable unavailable = 2;
  }
}

message ObservationLagMeasurement {
  oneof result {
    // Source admission positions, never milliseconds or lost-event counts.
    uint64 same_epoch_positions = 1;
    google.protobuf.Empty invalidated = 2;
    google.protobuf.Empty epoch_mismatch = 3;
    ObservationReadUnavailable unavailable = 4;
  }
}

enum ObservationQueueClass {
  OBSERVATION_QUEUE_CLASS_UNSPECIFIED = 0;
  OBSERVATION_QUEUE_CLASS_UI = 1;
  OBSERVATION_QUEUE_CLASS_EDGE = 2;
  OBSERVATION_QUEUE_CLASS_RECORDER = 3;
  OBSERVATION_QUEUE_CLASS_VIEW = 4;
  OBSERVATION_QUEUE_CLASS_AUTOMATION_PENDING = 5;
  OBSERVATION_QUEUE_CLASS_SCRIPT_PENDING = 6;
  OBSERVATION_QUEUE_CLASS_MQTT_INBOUND = 7;
  OBSERVATION_QUEUE_CLASS_WORKER_COMMANDS = 8;
  OBSERVATION_QUEUE_CLASS_CLOUD_REQUESTS = 9;
}

message ObservationInstalledQueueMetrics {
  // Nine common numeric slots per class, plus worker in-flight/pending and
  // cloud in-flight only. Every field is
  // present; an inapplicable slot uses not_measured. Bytes are only reported
  // when actually accounted by the owner. No IDs, URIs, or error labels.
  ObservationGaugeMeasurement active_queues = 1;
  ObservationGaugeMeasurement queued_entries = 2;
  ObservationGaugeMeasurement capacity_entries = 3;
  ObservationCounterMeasurement rejected_total = 4;
  ObservationCounterMeasurement lost_deliveries_total = 5;
  ObservationCounterMeasurement coalesced_total = 6;
  ObservationGaugeMeasurement degraded_queues = 7;
  ObservationGaugeMeasurement queued_accounted_bytes = 8;
  ObservationGaugeMeasurement capacity_accounted_bytes = 9;
  // Applicable only to WorkerCommands and CloudRequests; otherwise NotMeasured.
  ObservationGaugeMeasurement in_flight_entries = 10;
  // Applicable only to WorkerCommands; includes queued and handed-off commands
  // still admitted as pending, independently of stale cancelled channel items.
  ObservationGaugeMeasurement pending_entries = 11;
}

message ObservationQueueAggregate {
  ObservationQueueClass queue_class = 1;
  oneof result {
    ObservationInstalledQueueMetrics installed = 2;
    google.protobuf.Empty not_installed = 3;
    ObservationReadUnavailable unavailable = 4;
  }
}

message ObservationQueueLag {
  // Only UI, Edge, Recorder, and View, once each. If any member is invalidated,
  // the class is invalidated instead of reporting another member's healthy max.
  ObservationQueueClass queue_class = 1;
  oneof result {
    ObservationLagMeasurement installed = 2;
    google.protobuf.Empty not_installed = 3;
    ObservationReadUnavailable unavailable = 4;
  }
}

message ObservationCommittedGapMetrics {
  GapReason reason = 1;
  ObservationCounterMeasurement rows_total = 2;
  ObservationCounterMeasurement known_lost_lower_bound_total = 3;
  ObservationCounterMeasurement rows_without_known_count_total = 4;
}

message ObservationActiveCoverageInterval {
  // A volatile at-risk interval, not a committed historical gap.
  AdmissionPosition from = 1;
  AdmissionPosition through = 2;
  KnownLost known_lost = 3;
}

message ObservationActiveCoverage {
  oneof result {
    ObservationActiveCoverageInterval at_risk = 1;
    google.protobuf.Empty no_active_risk = 2;
    ObservationReadUnavailable unavailable = 3;
  }
}

message ObservationInstalledRecorderMetrics {
  // Eleven numeric slots. Positions carry source epoch context, not labels.
  ObservationGaugeMeasurement queued_bytes = 1;
  ObservationGaugeMeasurement pending_bytes = 2;
  ObservationGaugeMeasurement total_capacity_bytes = 3;
  ObservationGaugeMeasurement queue_capacity_bytes = 4;
  ObservationGaugeMeasurement queued_entries = 5;
  ObservationCounterMeasurement retries_total = 6;
  ObservationCounterMeasurement lost_entries_total = 7;
  ObservationCounterMeasurement policy_excluded_total = 8;
  ObservationPositionMeasurement checkpoint = 9;
  ObservationPositionMeasurement tail = 10;
  ObservationLagMeasurement recorder_lag_positions = 11;
  // Three reasons, three cumulative counters each. Count only confirmed
  // runtime commits, never retries, historical scans, or ObservationActiveCoverage.
  repeated ObservationCommittedGapMetrics committed_gaps = 12;
  ObservationActiveCoverage active_coverage = 13;
}

message ObservationRecorderMetrics {
  oneof result {
    ObservationInstalledRecorderMetrics installed = 1;
    google.protobuf.Empty not_installed = 2;
    ObservationReadUnavailable unavailable = 3;
  }
}

enum ObservationAttemptLedger {
  OBSERVATION_ATTEMPT_LEDGER_UNSPECIFIED = 0;
  OBSERVATION_ATTEMPT_LEDGER_VOLATILE = 1;
  OBSERVATION_ATTEMPT_LEDGER_DURABLE = 2;
}

message ObservationFirstAttemptMetrics {
  ObservationAttemptLedger ledger = 1;
  ObservationCounterMeasurement indeterminate_total = 2;
}

message ObservationActionMetrics {
  // These are three distinct, nonadditive populations: live progression,
  // responses to first attempts, and old dispatching rows recovered durably.
  ObservationCounterMeasurement progress_indeterminate_total = 1;
  // Exactly Volatile and Durable once each. Replays do not increment.
  repeated ObservationFirstAttemptMetrics first_attempts = 2;
  ObservationCounterMeasurement durable_recovered_indeterminate_total = 3;
}

enum ObservationRunKind {
  OBSERVATION_RUN_KIND_UNSPECIFIED = 0;
  OBSERVATION_RUN_KIND_AUTOMATION = 1;
  OBSERVATION_RUN_KIND_SCRIPT = 2;
}

message ObservationRunKindMetrics {
  ObservationRunKind kind = 1;
  ObservationGaugeMeasurement active = 2;
  // FIFO plus replacement, distinct from active and preparing.
  ObservationGaugeMeasurement pending = 3;
  ObservationCounterMeasurement cancelled_total = 4;
  ObservationCounterMeasurement superseded_total = 5;
}

message ObservationInstalledRunMetrics {
  // Exactly Automation and Script. Totals survive native trace eviction,
  // owner replacement, and reads; NodeCancelled is not another cancelled run.
  repeated ObservationRunKindMetrics kinds = 1;
  ObservationGaugeMeasurement preparing = 2;
  // Stable identity of this actual Controller, independent of causal revision.
  // Context for targeted trace reads; no metric series or authority is added.
  string controller = 3;
}

message ObservationRunMetrics {
  oneof result {
    ObservationInstalledRunMetrics installed = 1;
    google.protobuf.Empty not_installed = 2;
    ObservationReadUnavailable unavailable = 3;
  }
}

message ObservationJournalMetrics {
  ObservationGaugeMeasurement retained_rows = 1;
  ObservationGaugeMeasurement charged_bytes = 2;
  ObservationCounterMeasurement evicted_total = 3;
}

enum ObservationMetricOwner {
  OBSERVATION_METRIC_OWNER_UNSPECIFIED = 0;
  OBSERVATION_METRIC_OWNER_SEQUENCER = 1;
  OBSERVATION_METRIC_OWNER_RECORDER = 2;
  OBSERVATION_METRIC_OWNER_ACTIONS = 3;
  OBSERVATION_METRIC_OWNER_AUTOMATION_RUNS = 4;
  OBSERVATION_METRIC_OWNER_MQTT = 5;
  OBSERVATION_METRIC_OWNER_WORKER = 6;
  OBSERVATION_METRIC_OWNER_CLOUD_POLICY = 7;
  OBSERVATION_METRIC_OWNER_JOURNAL = 8;
}

message ObservationObservationCut {
  ObservationMetricOwner owner = 1;
  google.protobuf.Timestamp captured_at = 2;
}

message Metrics {
  option (google.api.resource) = {type: "homeward.damiengoehrig.ca/Metrics" pattern: "homes/{home}/metrics" singular: "metrics" plural: "metrics"};
  string name = 20 [(google.api.field_behavior) = IDENTIFIER];
  ObservationProcessObservationEpoch process_epoch = 1;
  // Exactly nine classes, once each; four sequencer lag classes, once each.
  repeated ObservationQueueAggregate queues = 2;
  repeated ObservationQueueLag queue_lags = 3;
  ObservationRecorderMetrics recorder = 4;
  ObservationActionMetrics actions = 5;
  ObservationRunMetrics runs = 6;
  ObservationJournalMetrics journal = 7;
  // At most eight known owners, no duplicates. These qualify independent cuts,
  // not a global transaction or wall-clock ordering proof between owners.
  repeated ObservationObservationCut cuts = 8;
}

enum ObservationLogLevel {
  OBSERVATION_LOG_LEVEL_UNSPECIFIED = 0;
  OBSERVATION_LOG_LEVEL_INFO = 1;
  OBSERVATION_LOG_LEVEL_WARNING = 2;
  OBSERVATION_LOG_LEVEL_ERROR = 3;
}

enum ObservationLogComponent {
  OBSERVATION_LOG_COMPONENT_UNSPECIFIED = 0;
  OBSERVATION_LOG_COMPONENT_PROCESS = 1;
  OBSERVATION_LOG_COMPONENT_PUBLIC_TRANSPORT = 2;
  OBSERVATION_LOG_COMPONENT_OPERATOR_TRANSPORT = 3;
  OBSERVATION_LOG_COMPONENT_WORKER_TRANSPORT = 4;
  OBSERVATION_LOG_COMPONENT_MQTT = 5;
  OBSERVATION_LOG_COMPONENT_SUPERVISOR = 6;
}

enum ObservationLogCode {
  OBSERVATION_LOG_CODE_UNSPECIFIED = 0;
  OBSERVATION_LOG_CODE_PROCESS_CONFIG_READ_FAILED = 1;
  OBSERVATION_LOG_CODE_PROCESS_CONFIG_ADMISSION_FAILED = 2;
  OBSERVATION_LOG_CODE_PROCESS_RUNTIME_START_FAILED = 3;
  OBSERVATION_LOG_CODE_PROCESS_RUNTIME_FAILED = 4;
  OBSERVATION_LOG_CODE_PROCESS_READY = 5;
  OBSERVATION_LOG_CODE_PROCESS_STOPPED = 6;
  OBSERVATION_LOG_CODE_TRANSPORT_INTERNAL_DIAGNOSTIC = 7;
  OBSERVATION_LOG_CODE_MQTT_UNKNOWN_DISCOVERY = 8;
  OBSERVATION_LOG_CODE_MQTT_INVALID_DISCOVERY = 9;
  OBSERVATION_LOG_CODE_MQTT_UNCONFIGURED_SOURCE = 10;
  OBSERVATION_LOG_CODE_MQTT_UNSUPPORTED_EFFECT = 11;
  OBSERVATION_LOG_CODE_MQTT_UNSUPPORTED_COLOR_MODE = 12;
  OBSERVATION_LOG_CODE_MQTT_INVALID_STATE = 13;
  OBSERVATION_LOG_CODE_MQTT_INVALID_AVAILABILITY = 14;
  OBSERVATION_LOG_CODE_MQTT_RETIREMENT_FAILED = 15;
  OBSERVATION_LOG_CODE_MQTT_SNAPSHOT_OVERFLOW = 16;
  OBSERVATION_LOG_CODE_MQTT_UNCONFIGURED_ACTION_ANCHOR = 17;
  OBSERVATION_LOG_CODE_MQTT_AMBIGUOUS_ACTION_DEVICE = 18;
  OBSERVATION_LOG_CODE_MQTT_ACTION_OVERFLOW = 19;
  OBSERVATION_LOG_CODE_MQTT_INVALID_ACTION = 20;
  OBSERVATION_LOG_CODE_PILOT_STARTING = 21;
  OBSERVATION_LOG_CODE_PILOT_RUNNING = 22;
  OBSERVATION_LOG_CODE_PILOT_RETRYING = 23;
  OBSERVATION_LOG_CODE_PILOT_DEGRADED = 24;
  OBSERVATION_LOG_CODE_PILOT_STOPPED = 25;
  OBSERVATION_LOG_CODE_PILOT_JOIN_TIMEOUT = 26;
  OBSERVATION_LOG_CODE_PILOT_TASK_CAPACITY = 27;
  OBSERVATION_LOG_CODE_PILOT_FACTORY_FAILED = 28;
}

message ObservationRuntimeAuthor {
  oneof result {
    google.protobuf.Empty process = 1;
    google.protobuf.Empty internal_automation = 2;
    // Canonical account resource allocated by the native account owner.
    string human_account = 3;
    google.protobuf.Empty unauthenticated = 4;
  }
}

message ObservationRuntimeEvent {
  // At most 1 KiB serialized and charged before retention. Message text is
  // rendered from ObservationLogCode by a client, never copied from a provider.
  ObservationLogCode code = 1;
  ObservationLogLevel level = 2;
  ObservationLogComponent component = 3;
  google.protobuf.Timestamp occurred_at = 4;
  ObservationRuntimeAuthor author = 5;
}

message ObservationRuntimeLogRow {
  uint64 sequence = 1;
  ObservationRuntimeEvent event = 2;
}

enum ObservationAuditSource {
  OBSERVATION_AUDIT_SOURCE_UNSPECIFIED = 0;
  OBSERVATION_AUDIT_SOURCE_AUTHENTICATION = 1;
  OBSERVATION_AUDIT_SOURCE_SECRET_ACCESS = 2;
}

enum ObservationAuthAuditAction {
  OBSERVATION_AUTH_AUDIT_ACTION_UNSPECIFIED = 0;
  OBSERVATION_AUTH_AUDIT_ACTION_BOOTSTRAP = 1;
  OBSERVATION_AUTH_AUDIT_ACTION_RECOVER = 2;
  OBSERVATION_AUTH_AUDIT_ACTION_CREATE_ACCOUNT = 3;
  OBSERVATION_AUTH_AUDIT_ACTION_GET_ACCOUNT = 4;
  OBSERVATION_AUTH_AUDIT_ACTION_LIST_ACCOUNTS = 5;
  OBSERVATION_AUTH_AUDIT_ACTION_UPDATE_ACCOUNT = 6;
  OBSERVATION_AUTH_AUDIT_ACTION_DELETE_ACCOUNT = 7;
  OBSERVATION_AUTH_AUDIT_ACTION_CREATE_INVITATION = 8;
  OBSERVATION_AUTH_AUDIT_ACTION_ACCEPT_INVITATION = 9;
  OBSERVATION_AUTH_AUDIT_ACTION_LIST_INVITATIONS = 10;
  OBSERVATION_AUTH_AUDIT_ACTION_REVOKE_INVITATION = 11;
  OBSERVATION_AUTH_AUDIT_ACTION_TRANSPORT = 12;
  OBSERVATION_AUTH_AUDIT_ACTION_LOGIN_DENIED = 13;
  OBSERVATION_AUTH_AUDIT_ACTION_LOGIN_LIMITED = 14;
  OBSERVATION_AUTH_AUDIT_ACTION_CHALLENGE_ISSUED = 15;
  OBSERVATION_AUTH_AUDIT_ACTION_CHALLENGE_DENIED = 16;
  OBSERVATION_AUTH_AUDIT_ACTION_SESSION_CREATE = 17;
  OBSERVATION_AUTH_AUDIT_ACTION_SESSION_REFRESH = 18;
  OBSERVATION_AUTH_AUDIT_ACTION_SESSION_REPLAY = 19;
  OBSERVATION_AUTH_AUDIT_ACTION_SESSION_REVOKE = 20;
  OBSERVATION_AUTH_AUDIT_ACTION_POLICY_READ = 21;
  OBSERVATION_AUTH_AUDIT_ACTION_POLICY_REPLACE = 22;
  OBSERVATION_AUTH_AUDIT_ACTION_POLICY_SEED = 23;
  OBSERVATION_AUTH_AUDIT_ACTION_MFA_ENROLL = 24;
  OBSERVATION_AUTH_AUDIT_ACTION_MFA_REMOVE = 25;
  OBSERVATION_AUTH_AUDIT_ACTION_MFA_RECOVERY_REPLACE = 26;
  OBSERVATION_AUTH_AUDIT_ACTION_MFA_RESET = 27;
  OBSERVATION_AUTH_AUDIT_ACTION_MFA_POLICY_REPLACE = 28;
  OBSERVATION_AUTH_AUDIT_ACTION_MFA_POLICY_READ = 29;
}

enum ObservationAuditOutcome {
  OBSERVATION_AUDIT_OUTCOME_UNSPECIFIED = 0;
  OBSERVATION_AUDIT_OUTCOME_ADMITTED = 1;
  OBSERVATION_AUDIT_OUTCOME_DENIED = 2;
}

enum ObservationSecretDenialReason {
  OBSERVATION_SECRET_DENIAL_REASON_UNSPECIFIED = 0;
  OBSERVATION_SECRET_DENIAL_REASON_FOREIGN_HANDLE = 1;
  OBSERVATION_SECRET_DENIAL_REASON_INACTIVE_SESSION = 2;
}

message ObservationIntegrationReference {
  bytes value = 1;
}

message ObservationAuditAuthor {
  oneof result {
    string human_account = 1;
    ObservationIntegrationReference internal_integration = 2;
    google.protobuf.Empty not_recorded = 3;
  }
}

message ObservationAuditRoute {
  oneof result {
    // A canonical path from the existing frozen PublicPlan procedure catalogue,
    // <=256 UTF-8 bytes. Never an unchecked historical route_path column.
    string registered_procedure = 1;
    google.protobuf.Empty other_registered_route = 2;
    google.protobuf.Empty not_recorded = 3;
  }
}

enum ObservationStoredMetadataField {
  OBSERVATION_STORED_METADATA_FIELD_UNSPECIFIED = 0;
  OBSERVATION_STORED_METADATA_FIELD_ACTOR = 1;
  OBSERVATION_STORED_METADATA_FIELD_ROUTE = 2;
  OBSERVATION_STORED_METADATA_FIELD_OCCURRED_AT = 3;
  OBSERVATION_STORED_METADATA_FIELD_ACTION = 4;
  OBSERVATION_STORED_METADATA_FIELD_OUTCOME = 5;
  OBSERVATION_STORED_METADATA_FIELD_REQUESTING_INSTANCE = 6;
}

message ObservationStoredMetadataInvalid {
  // At most six distinct known fields, never their rejected stored values.
  repeated ObservationStoredMetadataField fields = 1;
}

message ObservationAuthenticationAudit {
  google.protobuf.Timestamp occurred_at = 1;
  ObservationAuthAuditAction action = 2;
  ObservationAuditOutcome outcome = 3;
  ObservationAuditAuthor author = 4;
  ObservationAuditRoute route = 5;
}

message ObservationSecretAccessAudit {
  google.protobuf.Timestamp occurred_at = 1;
  ObservationSecretDenialReason reason = 2;
  ObservationAuditAuthor author = 3;
}

message ObservationAuditRow {
  // Positive PK from the selected source; not a global wall-clock/commit order.
  int64 id = 1;
  oneof result {
    ObservationAuthenticationAudit authentication = 2;
    ObservationSecretAccessAudit secret_access = 3;
    ObservationStoredMetadataInvalid stored_metadata_invalid = 4;
  }
}

enum ObservationTraceDecision {
  OBSERVATION_TRACE_DECISION_UNSPECIFIED = 0;
  OBSERVATION_TRACE_DECISION_PREPARING = 1;
  OBSERVATION_TRACE_DECISION_ADMITTED = 2;
  OBSERVATION_TRACE_DECISION_QUEUED = 3;
  OBSERVATION_TRACE_DECISION_RESTART_PENDING = 4;
  OBSERVATION_TRACE_DECISION_SINGLE_BUSY = 5;
  OBSERVATION_TRACE_DECISION_MAX_EXCEEDED = 6;
  OBSERVATION_TRACE_DECISION_PREPARATION_SATURATED = 7;
  OBSERVATION_TRACE_DECISION_MEMORY_SATURATED = 8;
  OBSERVATION_TRACE_DECISION_CONDITION_FALSE = 9;
  OBSERVATION_TRACE_DECISION_PREPARATION_ERROR = 10;
  OBSERVATION_TRACE_DECISION_EXECUTION_ERROR = 11;
  OBSERVATION_TRACE_DECISION_FINISHED = 12;
  OBSERVATION_TRACE_DECISION_CANCELLED = 13;
  OBSERVATION_TRACE_DECISION_SUPERSEDED = 14;
  OBSERVATION_TRACE_DECISION_CLOSED = 15;
  OBSERVATION_TRACE_DECISION_UNKNOWN_AUTOMATION = 16;
  OBSERVATION_TRACE_DECISION_TRIGGER_MISSED = 17;
  OBSERVATION_TRACE_DECISION_TRIGGER_DEGRADED = 18;
}

enum ObservationTraceMaxExceededMode {
  OBSERVATION_TRACE_MAX_EXCEEDED_MODE_UNSPECIFIED = 0;
  OBSERVATION_TRACE_MAX_EXCEEDED_MODE_SILENT = 1;
  OBSERVATION_TRACE_MAX_EXCEEDED_MODE_WARNING = 2;
  OBSERVATION_TRACE_MAX_EXCEEDED_MODE_ERROR = 3;
}

enum ObservationTraceActionKind {
  OBSERVATION_TRACE_ACTION_KIND_UNSPECIFIED = 0;
  OBSERVATION_TRACE_ACTION_KIND_VARIABLES = 1;
  OBSERVATION_TRACE_ACTION_KIND_SEQUENCE = 2;
  OBSERVATION_TRACE_ACTION_KIND_CHOOSE = 3;
  OBSERVATION_TRACE_ACTION_KIND_IF = 4;
  OBSERVATION_TRACE_ACTION_KIND_REPEAT = 5;
  OBSERVATION_TRACE_ACTION_KIND_PARALLEL = 6;
  OBSERVATION_TRACE_ACTION_KIND_WAIT = 7;
  OBSERVATION_TRACE_ACTION_KIND_STOP = 8;
  OBSERVATION_TRACE_ACTION_KIND_CALL = 9;
  OBSERVATION_TRACE_ACTION_KIND_DELAY = 10;
  OBSERVATION_TRACE_ACTION_KIND_WAIT_TEMPLATE = 11;
}

enum ObservationTraceNodeStage {
  OBSERVATION_TRACE_NODE_STAGE_UNSPECIFIED = 0;
  OBSERVATION_TRACE_NODE_STAGE_ENTERED = 1;
  OBSERVATION_TRACE_NODE_STAGE_COMPLETED = 2;
  OBSERVATION_TRACE_NODE_STAGE_STOPPED = 3;
  OBSERVATION_TRACE_NODE_STAGE_CANCELLED = 4;
  OBSERVATION_TRACE_NODE_STAGE_FAILED = 5;
  OBSERVATION_TRACE_NODE_STAGE_WAITING = 6;
}

enum ObservationTraceExecutionErrorKind {
  OBSERVATION_TRACE_EXECUTION_ERROR_KIND_UNSPECIFIED = 0;
  OBSERVATION_TRACE_EXECUTION_ERROR_KIND_INVALID_PROGRAM = 1;
  OBSERVATION_TRACE_EXECUTION_ERROR_KIND_WORK_BUDGET = 2;
  OBSERVATION_TRACE_EXECUTION_ERROR_KIND_RECURSION = 3;
  OBSERVATION_TRACE_EXECUTION_ERROR_KIND_WAIT_TIMEOUT = 4;
  OBSERVATION_TRACE_EXECUTION_ERROR_KIND_SOURCE_UNAVAILABLE = 5;
  OBSERVATION_TRACE_EXECUTION_ERROR_KIND_CONDITION_ERROR = 6;
  OBSERVATION_TRACE_EXECUTION_ERROR_KIND_COMMAND_ERROR = 7;
}

enum ObservationTraceOrderState {
  OBSERVATION_TRACE_ORDER_STATE_UNSPECIFIED = 0;
  OBSERVATION_TRACE_ORDER_STATE_HEALTHY = 1;
  OBSERVATION_TRACE_ORDER_STATE_EXHAUSTED = 2;
}

message ObservationTraceOrdinal {
  oneof result {
    // Native 188 ordinal in 1..UINT64_MAX-1. Same Controller only; no sorting
    // across Controllers, no renumbering, and no continuity claim on eviction.
    uint64 native = 1;
    google.protobuf.Empty exhausted = 2;
  }
}

message ObservationControllerTraceRecord {
  ObservationTraceDecision decision = 1;
  oneof max_exceeded {
    ObservationTraceMaxExceededMode mode = 2;
    google.protobuf.Empty not_applicable = 3;
  }
  // Exact existing sequencer position that triggered this run. Present only
  // on its initial admitted/queued/restart-pending decision, joined by run_id.
  // Absence means no source position was recorded (e.g. a script invocation).
  // This runtime projection grants no replay/command authority and exposes no
  // trigger payload, entity name, environment, or configuration provenance.
  optional AdmissionPosition trigger_position = 4;
}

message ObservationTraceFailure {
  oneof result {
    ObservationTraceExecutionErrorKind known = 1;
    google.protobuf.Empty no_failure = 2;
    // An unclassified source error is not turned into an invented known code.
    google.protobuf.Empty not_recorded = 3;
  }
}

message ObservationNodeTraceRecord {
  ObservationTraceActionKind action_kind = 1;
  ObservationTraceNodeStage stage = 2;
  google.protobuf.Timestamp occurred_at = 3;
  ObservationTraceFailure failure = 4;
}

message ObservationTraceRow {
  string run = 1 [(google.api.resource_reference).type = "homeward.damiengoehrig.ca/RuntimeRun"];
  // Zero-based stable index in this bounded capture, not a source ordinal.
  uint32 local_index = 2;
  ObservationTraceOrdinal ordinal = 3;
  oneof record {
    ObservationControllerTraceRecord controller = 4;
    ObservationNodeTraceRecord node = 5;
  }
}

enum ObservationTraceCutCoherence {
  OBSERVATION_TRACE_CUT_COHERENCE_UNSPECIFIED = 0;
  // Even with 188, copying two independently locked rings is not atomic.
  OBSERVATION_TRACE_CUT_COHERENCE_SEPARATE_OWNER_CUTS = 1;
}

message ObservationTraceCutMetadata {
  ObservationTraceCutCoherence coherence = 1;
  ObservationTraceOrderState order = 2;
  // Source-reported native eviction counts, distinct from truncation by 056.
  uint64 controller_evicted = 3;
  uint64 node_evicted = 4;
  google.protobuf.Timestamp controller_captured_at = 5;
  google.protobuf.Timestamp node_captured_at = 6;
}

enum ObservationTraceTruncationReason {
  OBSERVATION_TRACE_TRUNCATION_REASON_UNSPECIFIED = 0;
  OBSERVATION_TRACE_TRUNCATION_REASON_ROW_LIMIT = 1;
  OBSERVATION_TRACE_TRUNCATION_REASON_BYTE_LIMIT = 2;
}

enum ObservationIntegrationHealthStatus {
  OBSERVATION_INTEGRATION_HEALTH_STATUS_UNSPECIFIED = 0;
  OBSERVATION_INTEGRATION_HEALTH_STATUS_READY = 1;
  OBSERVATION_INTEGRATION_HEALTH_STATUS_DEGRADED = 2;
  OBSERVATION_INTEGRATION_HEALTH_STATUS_UNAVAILABLE = 3;
}
message IntegrationHealth {
  option (google.api.resource) = {type: "homeward.damiengoehrig.ca/IntegrationHealth" pattern: "homes/{home}/integrationInstances/{integration_instance}/health" singular: "integrationHealth" plural: "integrationHealths"};
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  ObservationIntegrationReportPresence report = 2;
  ObservationIntegrationSupervision supervision = 3;
}
message GetHealthRequest {
  string name = 1 [(google.api.field_behavior) = REQUIRED, (google.api.resource_reference).type = "homeward.damiengoehrig.ca/Health"];
}
message GetMetricsRequest {
  string name = 1 [(google.api.field_behavior) = REQUIRED, (google.api.resource_reference).type = "homeward.damiengoehrig.ca/Metrics"];
}
message GetIntegrationHealthRequest {
  string name = 1 [(google.api.field_behavior) = REQUIRED, (google.api.resource_reference).type = "homeward.damiengoehrig.ca/IntegrationHealth"];
}
message QueryRuntimeLogsRequest {
  string parent = 1 [(google.api.field_behavior) = REQUIRED, (google.api.resource_reference).type = "homeward.damiengoehrig.ca/Home"];
  int32 page_size = 2;
  string page_token = 3;
}
message QueryRuntimeLogsResponse {
  repeated ObservationRuntimeLogRow rows = 1;
  string next_page_token = 2;
  ObservationProcessObservationEpoch process_epoch = 3;
  uint64 upper_sequence = 4;
}
message QueryAuditsRequest {
  string parent = 1 [(google.api.field_behavior) = REQUIRED, (google.api.resource_reference).type = "homeward.damiengoehrig.ca/Home"];
  ObservationAuditSource source = 2 [(google.api.field_behavior) = REQUIRED];
  int32 page_size = 3;
  string page_token = 4;
}
message QueryAuditsResponse {
  repeated ObservationAuditRow rows = 1;
  string next_page_token = 2;
  ObservationAuditSource source = 3;
}
message QueryRunTraceRequest {
  string parent = 1 [(google.api.field_behavior) = REQUIRED, (google.api.resource_reference).type = "homeward.damiengoehrig.ca/RuntimeRun"];
  int32 page_size = 2;
  string page_token = 3;
}
message QueryRunTraceResponse {
  // Exact native run selected by the request, including its process controller.
  string run = 5 [(google.api.resource_reference).type = "homeward.damiengoehrig.ca/RuntimeRun"];
  repeated ObservationTraceRow rows = 1;
  string next_page_token = 2;
  ObservationTraceCutMetadata cuts = 3;
  // Optional means the retained native capture was truncated by this bound.
  optional ObservationTraceTruncationReason truncation_reason = 4;
}
message QueryRecorderCoverageRequest {
  string parent = 1 [(google.api.field_behavior) = REQUIRED, (google.api.resource_reference).type = "homeward.damiengoehrig.ca/Home"];
  AdmissionPosition from = 2 [(google.api.field_behavior) = REQUIRED];
  oneof through {
    AdmissionPosition position = 3;
    RecorderEpochIdentity latest_in_epoch = 4;
  }
}
message QueryRecorderCoverageResponse {
  RecorderCoverageSnapshot coverage = 1;
}
service ObservabilityService {
  option (google.api.default_host) = "homeward.damiengoehrig.ca";
  rpc GetHealth(GetHealthRequest) returns (Health) {
    option (google.api.http) = {get: "/v2/{name=homes/*/health}"};
    option (google.api.method_signature) = "name";
  }
  rpc GetMetrics(GetMetricsRequest) returns (Metrics) {
    option (google.api.http) = {get: "/v2/{name=homes/*/metrics}"};
    option (google.api.method_signature) = "name";
  }
  rpc GetIntegrationHealth(GetIntegrationHealthRequest) returns (IntegrationHealth) {
    option (google.api.http) = {get: "/v2/{name=homes/*/integrationInstances/*/health}"};
    option (google.api.method_signature) = "name";
  }
  rpc QueryRuntimeLogs(QueryRuntimeLogsRequest) returns (QueryRuntimeLogsResponse) {
    option (google.api.http) = {get: "/v2/{parent=homes/*}:queryRuntimeLogs"};
    option (google.api.method_signature) = "parent";
  }
  rpc QueryAudits(QueryAuditsRequest) returns (QueryAuditsResponse) {
    option (google.api.http) = {get: "/v2/{parent=homes/*}:queryAudits"};
    option (google.api.method_signature) = "parent,source";
  }
  rpc QueryRunTrace(QueryRunTraceRequest) returns (QueryRunTraceResponse) {
    option (google.api.http) = {get: "/v2/{parent=homes/*/runtimeControllers/*/runs/*}:queryRunTrace"};
    option (google.api.method_signature) = "parent";
  }
  rpc QueryRecorderCoverage(QueryRecorderCoverageRequest) returns (QueryRecorderCoverageResponse) {
    option (google.api.http) = {get: "/v2/{parent=homes/*}:queryRecorderCoverage"};
    option (google.api.method_signature) = "parent,from";
  }
}
