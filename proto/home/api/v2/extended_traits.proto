// Helper value. Civil dates require year/month/day; civil clocks use whole
// seconds and preserve midnight. SET forbids trigger_time and helper_revision.
message HelperValue {
  oneof value {
    // Boolean. Presence preserves unknown, zero and false independently.
    bool boolean_value = 1;
    // Number. Presence preserves unknown, zero and false independently.
    double number = 2;
    // Counter. Presence preserves unknown, zero and false independently.
    int64 counter = 3;
    // Trigger time. Presence preserves unknown, zero and false independently.
    google.protobuf.Timestamp trigger_time = 4;
    // Date. Presence preserves unknown, zero and false independently.
    google.type.Date date = 5;
    // Time. Presence preserves unknown, zero and false independently.
    google.type.TimeOfDay time = 6;
    // Datetime. Presence preserves unknown, zero and false independently.
    LocalDateTime local_value = 7;
    // Selected option. Presence preserves unknown, zero and false independently.
    string selected_option = 8;
    // Text. Presence preserves unknown, zero and false independently.
    string text = 9;
  }

  // Helper revision. Presence preserves unknown, zero and false independently.
  int64 helper_revision = 10 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Writable helper payload. Server observation timestamps and revisions have
// no representation in this request value. Civil dates and clocks stay typed.
message HelperInputValue {
