// A selector key from the source catalogue. Keys are open data, not labels.
message SelectorDefinition {
  // Exact admitted keys; an empty list means no selection command.
  repeated string options = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Atomic fan controls. Power and speed stay one physical intention.
message FanControlCapability {
  // Whether power commands are supported.
  bool supports_power = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Exact source speed keys; never guessed from display names.
  SelectorDefinition speed = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Last qualified speed observation, absent until obtained.
  FanControlObservation observation = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// A fan speed reading, with an explicitly typed OFF.
message FanControlObservation {
  // Observed speed; independent of command selector catalogue.
  optional FanSpeed speed = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Source observation time.
  google.protobuf.Timestamp observed_time = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Independent observation quality.
  ObservationQuality quality = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Cohesive light control; optional atomic updates never split into dispatches.
message LightControlCapability {
  // Whether explicit power is supported.
  bool supports_power = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Source brightness command bounds, absent when unsupported.
  NumberBounds brightness_percent = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Source color-temperature command bounds in reciprocal megakelvin.
  NumberBounds color_temperature_mireds = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Source transition command bounds in seconds; zero is an instant transition.
  NumberBounds transition_duration_bounds = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Source observations remain independent of writable fields.
  LightControlObservation observation = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Atomic source light frame. A missing field is not a default value.
message LightControlObservation {
  // Explicit power; absent means unknown.
  optional bool on = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Observed brightness; zero remains present.
  optional double brightness_percent = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Observed color temperature, independent of command support.
  optional int32 color_temperature_mireds = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Source observation time.
  google.protobuf.Timestamp observed_time = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Independent observation quality.
  ObservationQuality quality = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Registered source metadata without an executable public codec. No raw action
// payload or descriptor executable mechanism is exposed through this trait.
message OpaqueCapability {
  // Exact registered schema identity; not a command target.
  string schema_id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Registered schema major version.
  int64 major_version = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Source display label, never a semantic discriminator.
  string display_name = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Registered descriptor fingerprint; payload remains private.
  bytes descriptor_sha256 = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// One atomic light intention. At least one target is required; a transition
// alone and an OFF transition combined with brightness/color are invalid.
message SetLightCommand {
  // Shared explicit ON/OFF intent; absent leaves power unchanged.
  SetPowerCommand power = 1 [(google.api.field_behavior) = OPTIONAL];
  // Shared finite percentage intent, preserving a legitimate zero.
  SetLevelCommand level = 2 [(google.api.field_behavior) = OPTIONAL];
  // Integer reciprocal megakelvin target in [1,1000].
  optional int32 color_temperature_mireds = 3 [(google.api.field_behavior) = OPTIONAL];
  // Nonnegative transition; absent uses source policy.
  google.protobuf.Duration transition_duration = 4 [(google.api.field_behavior) = OPTIONAL];
}

// One atomic fan power/selection intention, with at least one explicit field.
message SetFanCommand {
  // Shared explicit power intent, independent of source reachability.
  SetPowerCommand power = 1 [(google.api.field_behavior) = OPTIONAL];
  // Exact key from the currently advertised source catalogue.
  optional string speed = 2 [(google.api.field_behavior) = OPTIONAL];
}

// One atomic thermal intention. A simple setpoint and pair are mutually
// exclusive. Mode and fan target may accompany either target in one dispatch.
message SetTemperatureControlCommand {
  // Optional atomic temperature target.
  oneof setpoint {
    // Finite temperature >= absolute zero Celsius.
    double setpoint_celsius = 1;
    // Both endpoints required, low <= high.
    TemperatureRange setpoint_range_celsius = 2;
  }
  // Explicit operating mode, unrelated to observed activity.
  optional TemperatureMode mode = 3 [(google.api.field_behavior) = OPTIONAL];
  // Explicit fan policy, unrelated to observed fan activity.
  optional TemperatureFanTarget fan_target = 4 [(google.api.field_behavior) = OPTIONAL];
}

// Cover operation or absolute position, never both.
message SetCoverCommand {
  // Required explicit physical intention.
  oneof target {
    // Open, close or stop, checked against source support.
    CoverOperation operation = 1;
    // Finite percentage, including a closed position of zero.
    double position_percent = 2;
  }
}

// Explicit lock intention; no per-request device code.
message SetLockCommand {
  // Lock or unlock; unknown and unspecified values are rejected.
  LockOperation operation = 1 [(google.api.field_behavior) = REQUIRED];
}

// Explicit alarm intention; no per-request device code.
message SetAlarmCommand {
  // Arm home, arm away or disarm; no inferred mode.
  AlarmOperation operation = 1 [(google.api.field_behavior) = REQUIRED];
}

// Typed helper operation. SET requires one matching value branch; other
// operations forbid a value. The helper CAS token is separate from observation.
message SetHelperCommand {
  // Operation admitted by this helper's kind and current declaration.
  HelperOperation operation = 1 [(google.api.field_behavior) = REQUIRED];
  // Required for SET only. helper_revision must be zero in command input.
  HelperInputValue value = 2 [(google.api.field_behavior) = OPTIONAL];
  // Required independent helper storage CAS precondition; zero is valid.
  optional int64 expected_helper_revision = 3 [(google.api.field_behavior) = REQUIRED];
}

// Cover State: closed typed source vocabulary; no label inference.
enum CoverState {
  // Cover state unspecified.
  COVER_STATE_UNSPECIFIED = 0;

  // Open includes a stationary, partly open cover; it does not imply 100 percent.
  COVER_STATE_OPEN = 1;
  // Cover state closed.
  COVER_STATE_CLOSED = 2;
  // Cover state opening.
  COVER_STATE_OPENING = 3;
  // Cover state closing.
  COVER_STATE_CLOSING = 4;
}

// Cover Operation: closed typed source vocabulary; no label inference.
enum CoverOperation {
  // Cover operation unspecified.
  COVER_OPERATION_UNSPECIFIED = 0;
  // Cover operation open.
  COVER_OPERATION_OPEN = 1;
  // Cover operation close.
  COVER_OPERATION_CLOSE = 2;
  // Cover operation stop.
  COVER_OPERATION_STOP = 3;
}

// Lock State: closed typed source vocabulary; no label inference.
