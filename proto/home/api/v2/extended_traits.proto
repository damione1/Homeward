  // Counter maximum. Presence preserves unknown, zero and false independently.
  optional int64 counter_maximum = 7;
  // Counter step. Presence preserves unknown, zero and false independently.
  optional int64 counter_step = 8;
  // Select options. Presence preserves unknown, zero and false independently.
  repeated string select_options = 9;
  // Text minimum length. Presence preserves unknown, zero and false independently.
  optional int32 text_minimum_length = 10;
  // Text maximum length. Presence preserves unknown, zero and false independently.
  optional int32 text_maximum_length = 11;
  // Unavailable reason. Presence preserves unknown, zero and false independently.
  HelperReason unavailable_reason = 12;
}

// Cover source declaration and independently qualified observation.
message CoverCapability {
  // Supported operations and observations. No operation is inferred from a value.
  CoverDefinition definition = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Last qualified observation, absent until established.
  CoverObservation observation = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Cover observation; absence of value remains distinct from its defaults.
message CoverObservation {
  // Source value, absent when not established.
  CoverValue value = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Time obtained from the source, independent of response generation.
  google.protobuf.Timestamp observed_time = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Independent source availability, freshness and provenance.
  ObservationQuality quality = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
}

