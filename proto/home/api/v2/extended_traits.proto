  HelperKind kind = 1;
  // Operations. Presence preserves unknown, zero and false independently.
  repeated HelperOperation operations = 2;
  // Number minimum. Presence preserves unknown, zero and false independently.
  optional double number_minimum = 3;
  // Number maximum. Presence preserves unknown, zero and false independently.
  optional double number_maximum = 4;
  // Number step. Presence preserves unknown, zero and false independently.
  optional double number_step = 5;
  // Counter minimum. Presence preserves unknown, zero and false independently.
