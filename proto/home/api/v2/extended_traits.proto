// Cover Definition: closed typed source vocabulary; no label inference.
message CoverDefinition {
  // Operations. Presence preserves unknown, zero and false independently.
  repeated CoverOperation operations = 1;
  // Set position percent. Presence preserves unknown, zero and false independently.
  PercentageBounds set_position_percent = 2;
  // Observed states. Presence preserves unknown, zero and false independently.
  repeated CoverState observed_states = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Observes position percent. Presence preserves unknown, zero and false independently.
  bool observes_position_percent = 4;
  // Observes obstruction. Presence preserves unknown, zero and false independently.
  bool observes_obstruction = 5;
}

// Cover Value: closed typed source vocabulary; no label inference.
message CoverValue {
  // State. Presence preserves unknown, zero and false independently.
  optional CoverState state = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Position percent. Presence preserves unknown, zero and false independently.
  optional double position_percent = 2;
  // Obstructed. Presence preserves unknown, zero and false independently.
  optional bool obstructed = 3;
}

