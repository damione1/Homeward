syntax = "proto3";

package home.api.v2;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/field_info.proto";
import "google/api/resource.proto";
import "google/longrunning/operations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/damione1/Homeward/gen/home/api/v2;apiv2";
option java_multiple_files = true;
option java_outer_classname = "ConfigurationDocumentsProto";
option java_package = "com.home.api.v2";

// One common TLS-required PublicPlan. Human admin GLOBAL_CONFIGURATION reads
// and writes, with current authorization and session lease at every emission.
// No listener, MCP route, internal routine principal or second activation owner.
service ConfigurationService {
  option (google.api.default_host) = "homeward.damiengoehrig.ca";
  // Reads one authorized ConfigurationRevision, including its retained or purged state.
  rpc GetConfigurationRevision(GetConfigurationRevisionRequest) returns (ConfigurationRevision) {
    option (google.api.http) = {get: "/v2/{name=homes/*/configurationDocuments/*/configurationRevisions/*}"};
    option (google.api.method_signature) = "name";
  }
  // Reads one authorized ConfigurationGeneration, including its retained or purged state.
  rpc GetConfigurationGeneration(GetConfigurationGenerationRequest) returns (ConfigurationGeneration) {
    option (google.api.http) = {get: "/v2/{name=homes/*/configurationGenerations/*}"};
    option (google.api.method_signature) = "name";
  }
  // Reads one authorized immutable configuration schema.
  rpc GetConfigurationSchema(GetConfigurationSchemaRequest) returns (ConfigurationSchema) {
    option (google.api.http) = {get: "/v2/{name=homes/*/configurationSchemas/*}"};
    option (google.api.method_signature) = "name";
  }
  // Gets the authorized configuration document.
  rpc GetConfigurationDocument(GetConfigurationDocumentRequest) returns (ConfigurationDocument) {
    option (google.api.http) = {get: "/v2/{name=homes/*/configurationDocuments/*}"};
    option (google.api.method_signature) = "name";
  }
  // Lists the authorized configuration documents using bounded opaque pagination.
  rpc ListConfigurationDocuments(ListConfigurationDocumentsRequest) returns (ListConfigurationDocumentsResponse) {
    option (google.api.http) = {get: "/v2/{parent=homes/*}/configurationDocuments"};
    option (google.api.method_signature) = "parent";
  }
  // Lists the authorized configuration revisions using bounded opaque pagination.
  rpc ListConfigurationRevisions(ListConfigurationRevisionsRequest) returns (ListConfigurationRevisionsResponse) {
    option (google.api.http) = {get: "/v2/{parent=homes/*/configurationDocuments/*}/configurationRevisions"};
    option (google.api.method_signature) = "parent";
  }
  // Lists the authorized configuration generations using bounded opaque pagination.
  rpc ListConfigurationGenerations(ListConfigurationGenerationsRequest) returns (ListConfigurationGenerationsResponse) {
    option (google.api.http) = {get: "/v2/{parent=homes/*}/configurationGenerations"};
    option (google.api.method_signature) = "parent";
  }
  // Lists the authorized configuration schemas using bounded opaque pagination.
  rpc ListConfigurationSchemas(ListConfigurationSchemasRequest) returns (ListConfigurationSchemasResponse) {
    option (google.api.http) = {get: "/v2/{parent=homes/*}/configurationSchemas"};
    option (google.api.method_signature) = "parent";
  }
  // Publishes exact document source under the expected native preconditions.
  rpc PublishConfigurationDocument(PublishConfigurationDocumentRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {
      post: "/v2/{name=homes/*/configurationDocuments/*}:publish"
      body: "*"
    };
    option (google.api.method_signature) = "name,expected,expected_workspace_sha256,exact_yaml_source";
    option (google.longrunning.operation_info) = {
      response_type: "PublishConfigurationDocumentResponse"
      metadata_type: "ConfigurationOperationMetadata"
    };
  }
  // Publishes a retained document version as a new revision under current preconditions.
  rpc RollbackConfigurationDocument(RollbackConfigurationDocumentRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {
      post: "/v2/{name=homes/*/configurationDocuments/*}:rollback"
      body: "*"
    };
    option (google.api.method_signature) = "name,expected,expected_workspace_sha256,historical";
    option (google.longrunning.operation_info) = {
      response_type: "RollbackConfigurationDocumentResponse"
      metadata_type: "ConfigurationOperationMetadata"
    };
  }
  // Streams metadata invalidations after a coherent cut. It never emits source
  // bytes; every frame rechecks the current credential and authority binding.
  rpc WatchConfiguration(WatchConfigurationRequest) returns (stream WatchConfigurationResponse) {
    option (google.api.http) = {
      post: "/v2/{parent=homes/*}:watchConfiguration"
      body: "*"
    };
    option (google.api.method_signature) = "parent,resume_token";
  }
}

// Represents document id.
message DocumentId {
  // The value associated with this message.
  string value = 1 [(google.api.field_behavior) = REQUIRED];
}

// Represents document version.
message DocumentVersion {
  // The revision represented by int64.
  int64 revision = 1 [(google.api.field_behavior) = REQUIRED];
  // Exact source bytes, never a manifest or semantic digest.
  bytes source_sha256 = 2 [(google.api.field_behavior) = REQUIRED];
}

// Represents active generation.
message ActiveGeneration {
  // The revision represented by int64.
  int64 revision = 1 [(google.api.field_behavior) = REQUIRED];
  // SHA-256 digest identifying the complete configuration manifest.
  bytes manifest_sha256 = 2 [(google.api.field_behavior) = REQUIRED];
}

// Represents workspace observation.
message WorkspaceObservation {
  // SHA-256 digest of the exact source bytes, without reserialization.
  bytes source_sha256 = 1;
  // Recorded time for updated at. Absence means no timestamp was supplied or recorded.
  google.protobuf.Timestamp updated_at = 2;
  // Relationship between workspace source and durable configuration; not a SQL version.
  DirtyState dirty = 3;
  // Diagnostic binds the exact observed source, independently of the SQL active
  // version. It is absent on clean or replaced candidates; never parser text.
  WorkspaceDiagnostic diagnostic = 4;
}

// Represents workspace diagnostic.
message WorkspaceDiagnostic {
  // The document represented by DocumentId.
  DocumentId document = 1;
  // Exact bytes representing observed source sha256. Not interpreted as a display string.
  bytes observed_source_sha256 = 2;
  // Time recorded for this observation; does not prove a physical command was confirmed.
  google.protobuf.Timestamp observed_at = 3;
  // Closed diagnostic code; contains no raw parser, provider, or SQL message.
  ConfigurationDiagnosticCode code = 4;
}

// Represents workspace unobserved.
message WorkspaceUnobserved {
  // Machine-readable reason from the closed vocabulary. Do not inspect human-readable text.
  WorkspaceUnobservedReason reason = 1;
}

// Represents configuration document.
message ConfigurationDocument {
  option (google.api.resource) = {
    type: "homeward.damiengoehrig.ca/ConfigurationDocument"
    pattern: "homes/{home}/configurationDocuments/{configuration_document}"
    singular: "configurationDocument"
    plural: "configurationDocuments"
  };
  // The id represented by DocumentId.
  DocumentId id = 13;
  // The kind represented by DocumentKind.
  DocumentKind kind = 2;
  // Version of the selected source schema; distinct from SQL schema and active generation.
  string schema_version = 3;
  // Closed source syntax profile understood by the native compiler.
  string syntax_profile = 4;
  // The version represented by DocumentVersion.
  DocumentVersion version = 5;
  // Recorded time for updated at. Absence means no timestamp was supplied or recorded.
  google.protobuf.Timestamp updated_at = 6;
  // Indicates whether active.
  bool active = 7;
  oneof workspace_state {
    // Invalid YAML can have an exact-byte observation without being admitted.
    WorkspaceObservation workspace = 8;
    // The workspace unobserved represented by WorkspaceUnobserved.
    WorkspaceUnobserved workspace_unobserved = 10;
  }
  // A keyed opaque reference to the protected source. It is not source bytes,
  // a secret name, a path, or an editable redacted YAML replacement.
  bytes protected_source_reference = 9;
  // Independently admitted active generation; unrelated to source SQL revision.
  ActiveGeneration active_generation = 11;
  // Opaque journal position bound to this SQL/workspace cut.
  string resume_token = 12;
  // Canonical immutable API resource identity.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  // Opaque source revision; mutations still require independent workspace CAS.
  string etag = 14;
}

// Represents activation result.
message ActivationResult {
  // Closed outcome recorded by the native owner; distinguish acknowledgment from confirmed effect.
  ActivationOutcome outcome = 1;
  // The transaction represented by TransactionOutcome.
  TransactionOutcome transaction = 2;
  // Absent when no target generation exists yet.
  optional int64 generation_revision = 3;
  // Collection of diagnostics for this message.
  repeated ConfigurationDiagnosticCode diagnostics = 4;
}

// Request for get configuration document.
message GetConfigurationDocumentRequest {
  // Canonical resource name. Uses the pattern declared on the resource message.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "homeward.damiengoehrig.ca/ConfigurationDocument"
  ];
}

// Request for list configuration documents.
message ListConfigurationDocumentsRequest {
  // Canonical parent resource under which this request is authorized.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "homeward.damiengoehrig.ca/ConfigurationDocument"
  ];
  // Requested page size. Zero selects the documented default; negative values are invalid.
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];
  // Opaque continuation from the preceding page. Keep all other query parameters unchanged.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];
}

// Successful result of list configuration documents.
message ListConfigurationDocumentsResponse {
  // Collection of documents for this message.
  repeated ConfigurationDocument configuration_documents = 1;
  // Opaque continuation for the next page. Empty when no continuation is available.
  string next_page_token = 2;
}

// Represents configuration revision.
message ConfigurationRevision {
  option (google.api.resource) = {
    type: "homeward.damiengoehrig.ca/ConfigurationRevision"
    pattern: "homes/{home}/configurationDocuments/{configuration_document}/configurationRevisions/{configuration_revision}"
    singular: "configurationRevision"
    plural: "configurationRevisions"
  };
  // Immutable SQL source revision under its canonical document.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  // The id represented by DocumentId.
  DocumentId id = 6;
  // The version represented by DocumentVersion.
  DocumentVersion version = 2;
  // The availability represented by VersionAvailability.
  VersionAvailability availability = 3;
  // Absent when the source row was purged. No invented timestamp/schema.
  google.protobuf.Timestamp update_time = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Version of the selected source schema; distinct from SQL schema and active generation.
  string schema_version = 5;
}

// Represents configuration generation.
message ConfigurationGeneration {
  option (google.api.resource) = {
    type: "homeward.damiengoehrig.ca/ConfigurationGeneration"
    pattern: "homes/{home}/configurationGenerations/{configuration_generation}"
    singular: "configurationGeneration"
    plural: "configurationGenerations"
  };
  // Immutable activation generation; independent from each source revision.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  // The generation represented by ActiveGeneration.
  ActiveGeneration generation = 4;
  // The availability represented by GenerationAvailability.
  GenerationAvailability availability = 2;
  // Recorded time for created at. Absence means no timestamp was supplied or recorded.
  google.protobuf.Timestamp create_time = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Request for list configuration revisions.
message ListConfigurationRevisionsRequest {
  // Canonical parent resource under which this request is authorized.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "homeward.damiengoehrig.ca/ConfigurationDocument"
  ];
  // Requested page size. Zero selects the documented default; negative values are invalid.
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];
  // Opaque continuation from the preceding page. Keep all other query parameters unchanged.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];
}

// Successful result of list configuration revisions.
message ListConfigurationRevisionsResponse {
  // Collection of versions for this message.
  repeated ConfigurationRevision configuration_revisions = 1;
  // Opaque continuation for the next page. Empty when no continuation is available.
  string next_page_token = 2;
}

// Request for list configuration generations.
message ListConfigurationGenerationsRequest {
  // Canonical parent resource under which this request is authorized.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "homeward.damiengoehrig.ca/ConfigurationGeneration"
  ];
  // Requested page size. Zero selects the documented default; negative values are invalid.
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];
  // Opaque continuation from the preceding page. Keep all other query parameters unchanged.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];
}

// Successful result of list configuration generations.
message ListConfigurationGenerationsResponse {
  // Collection of generations for this message.
  repeated ConfigurationGeneration configuration_generations = 1;
  // Opaque continuation for the next page. Empty when no continuation is available.
  string next_page_token = 2;
}

// Represents configuration schema.
message ConfigurationSchema {
  option (google.api.resource) = {
    type: "homeward.damiengoehrig.ca/ConfigurationSchema"
    pattern: "homes/{home}/configurationSchemas/{configuration_schema}"
    singular: "configurationSchema"
    plural: "configurationSchemas"
  };
  // Stable lossless identity of the immutable SQL schema key and document kind.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  // The kind represented by DocumentKind.
  DocumentKind kind = 5;
  // Version of the selected source schema; distinct from SQL schema and active generation.
  string schema_version = 2;
  // Closed source syntax profile understood by the native compiler.
  string syntax_profile = 3;
  // Global Config API writes only the selected operational workspace. Launch,
  // human policies and domain-specific logic retain their existing authorities.
  bool editable_operational_workspace = 4;
}

// Request for list configuration schemas.
message ListConfigurationSchemasRequest {
  // Canonical parent resource under which this request is authorized.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "homeward.damiengoehrig.ca/ConfigurationSchema"
  ];
  // Requested page size. Zero selects the documented default; negative values are invalid.
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];
  // Opaque continuation from the preceding page. Keep all other query parameters unchanged.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];
}

// Successful result of list configuration schemas.
message ListConfigurationSchemasResponse {
  // Collection of schemas for this message.
  repeated ConfigurationSchema configuration_schemas = 1;
  // Opaque continuation for the next page. Empty when no continuation is available.
  string next_page_token = 2;
}

// Request for publish configuration document.
message PublishConfigurationDocumentRequest {
  // Canonical resource name. Uses the pattern declared on the resource message.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "homeward.damiengoehrig.ca/ConfigurationDocument"
  ];
  // Typed precondition checked against the native owner before mutation.
  DocumentVersion expected = 2 [(google.api.field_behavior) = REQUIRED];
  // Required independently of admitted source: permits correcting dirty YAML
  // without silently replacing an external edit since the last observation.
  bytes expected_workspace_sha256 = 3 [(google.api.field_behavior) = REQUIRED];
  // Full exact bytes explicitly supplied by the administrator. A public
  // protected_source_reference/projection is never accepted as replacement.
  bytes exact_yaml_source = 4 [(google.api.field_behavior) = REQUIRED];
  // UUID identifying this intent for 24-hour durable result lookup.
  string request_id = 5 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.field_info).format = UUID4
  ];
}

// Request for rollback configuration document.
message RollbackConfigurationDocumentRequest {
  // Canonical resource name. Uses the pattern declared on the resource message.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "homeward.damiengoehrig.ca/ConfigurationDocument"
  ];
  // Typed precondition checked against the native owner before mutation.
  DocumentVersion expected = 2 [(google.api.field_behavior) = REQUIRED];
  // Expected digest of the workspace source; distinct from the SQL revision.
  bytes expected_workspace_sha256 = 3 [(google.api.field_behavior) = REQUIRED];
  // The historical represented by ActiveGeneration.
  ActiveGeneration historical = 4 [(google.api.field_behavior) = REQUIRED];
  // UUID identifying this intent for 24-hour durable result lookup.
  string request_id = 5 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.field_info).format = UUID4
  ];
}

// Represents document change.
message DocumentChange {
  // Canonical changed resource; never an executable source binding key.
  string name = 1 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference).type = "homeward.damiengoehrig.ca/ConfigurationDocument"
  ];
  // The version represented by DocumentVersion.
  DocumentVersion version = 2;
  // Relationship between workspace source and durable configuration; not a SQL version.
  DirtyState dirty = 3;
  // Separate from the admitted source hash. Absent while reconciliation cannot
  // establish which filesystem bytes are current.
  optional bytes observed_workspace_sha256 = 4;
}

// Represents change batch.
message ChangeBatch {
  // Collection of changes for this message.
  repeated DocumentChange changes = 1;
  // Opaque cursor for this stream and its admitted capture. Does not grant access.
  string resume_token = 2;
}

// Represents resync required.
message ResyncRequired {
  // Machine-readable reason from the closed vocabulary. Do not inspect human-readable text.
  ResyncReason reason = 1;
}

// Represents watch ready.
message WatchReady {
  // Opaque cursor for this stream and its admitted capture. Does not grant access.
  string resume_token = 1;
}

// Request for watch configuration.
message WatchConfigurationRequest {
  // Canonical parent resource under which this request is authorized.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "homeward.damiengoehrig.ca/Home"
  ];
  // Opaque cursor for this stream and its admitted capture. Does not grant access.
  string resume_token = 2 [(google.api.field_behavior) = REQUIRED];
}

// Successful result of watch configuration.
message WatchConfigurationResponse {
  oneof result {
    // The changes represented by ChangeBatch.
    ChangeBatch changes = 1;
    // The resync required represented by ResyncRequired.
    ResyncRequired resync_required = 2;
    // Confirms both subscriptions were installed and authority rechecked. This
    // acknowledges the supplied cursor; it does not advance over replay data.
    WatchReady ready = 3;
  }
}

// Reads one authorized ConfigurationRevision by its canonical name.
message GetConfigurationRevisionRequest {
  // Canonical resource name; no source identity or revision alias is accepted.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "homeward.damiengoehrig.ca/ConfigurationRevision"
  ];
}

// Reads one authorized ConfigurationGeneration by its canonical name.
message GetConfigurationGenerationRequest {
  // Canonical resource name; no source identity or revision alias is accepted.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "homeward.damiengoehrig.ca/ConfigurationGeneration"
  ];
}

// Reads one authorized ConfigurationSchema by its canonical name.
message GetConfigurationSchemaRequest {
  // Canonical resource name; no source identity or revision alias is accepted.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "homeward.damiengoehrig.ca/ConfigurationSchema"
  ];
}

// Allowed metadata type for google.longrunning configuration operations. No
// source, candidate, credential or parser/provider diagnostic may be included.
message ConfigurationOperationMetadata {
  // Immutable first durable creation time. A request_id reservation precedes
  // effects; an operation without request_id is created by its native commit.
  google.protobuf.Timestamp create_time = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The generation associated with this message.
  string generation = 2 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference).type = "homeward.damiengoehrig.ca/ConfigurationGeneration"
  ];
  // SQL activation generation, independent from every document revision.
  int64 generation_revision = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // SHA-256 digest identifying the complete configuration manifest.
  bytes manifest_sha256 = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The phase represented by ConfigurationOperationPhase.
  ConfigurationOperationPhase phase = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Present only after the native configuration transaction is proven committed.
  google.protobuf.Timestamp commit_time = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Optional UUID v4 identifying the normalized request for bounded deduplication.
  string request_id = 7 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.field_info).format = UUID4
  ];
}

// Shared immutable successful activation value. This exact target
// was published; a later current document belongs to a separate fresh Get.
message ConfigurationActivationResult {
  // The generation associated with this message.
  string generation = 1 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference).type = "homeward.damiengoehrig.ca/ConfigurationGeneration"
  ];
  // Native configuration generation revision, independent of document version.
  int64 generation_revision = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // SHA-256 digest identifying the complete configuration manifest.
  bytes manifest_sha256 = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Successful native publication result for PublishConfigurationDocument.
message PublishConfigurationDocumentResponse {
  // Exact original published activation; no current-generation substitution.
  ConfigurationActivationResult result = 1;
}

// Successful native publication result for RollbackConfigurationDocument.
message RollbackConfigurationDocumentResponse {
  // Exact original published activation; no current-generation substitution.
  ConfigurationActivationResult result = 1;
}

// Defines the closed vocabulary for document kind.
enum DocumentKind {
  // No explicit document kind. Does not select an action.
  DOCUMENT_KIND_UNSPECIFIED = 0;
  // Selects yaml source for document kind.
  DOCUMENT_KIND_YAML_SOURCE = 1;
  // Selects authorization policy for document kind.
  DOCUMENT_KIND_AUTHORIZATION_POLICY = 2;
  // Selects mfa policy for document kind.
  DOCUMENT_KIND_MFA_POLICY = 3;
  // Selects operational yaml for document kind.
  DOCUMENT_KIND_OPERATIONAL_YAML = 4;
  // Selects bootstrap launch for document kind.
  DOCUMENT_KIND_BOOTSTRAP_LAUNCH = 5;
  // Selects dashboard source for document kind.
  DOCUMENT_KIND_DASHBOARD_SOURCE = 6;
  // Selects automation source for document kind.
  DOCUMENT_KIND_AUTOMATION_SOURCE = 7;
  // Selects script source for document kind.
  DOCUMENT_KIND_SCRIPT_SOURCE = 8;
  // Selects scene source for document kind.
  DOCUMENT_KIND_SCENE_SOURCE = 9;
  // Selects ownership source for document kind.
  DOCUMENT_KIND_OWNERSHIP_SOURCE = 10;
}

// Defines the closed vocabulary for dirty state.
enum DirtyState {
  // No explicit dirty state. Does not select an action.
  DIRTY_STATE_UNSPECIFIED = 0;
  // Selects clean for dirty state.
  DIRTY_STATE_CLEAN = 1;
  // Selects unvalidated for dirty state.
  DIRTY_STATE_UNVALIDATED = 2;
  // Selects rejected for dirty state.
  DIRTY_STATE_REJECTED = 3;
  // Selects reconciling for dirty state.
  DIRTY_STATE_RECONCILING = 4;
  // Selects unavailable for dirty state.
  DIRTY_STATE_UNAVAILABLE = 5;
}

// Defines the closed vocabulary for workspace unobserved reason.
enum WorkspaceUnobservedReason {
  // No explicit workspace unobserved reason. Does not select an action.
  WORKSPACE_UNOBSERVED_REASON_UNSPECIFIED = 0;
  // SQL metadata is readable, but this owner has no physical locator for this
  // document. Absence of an observation is never a claim that YAML is clean.
  WORKSPACE_UNOBSERVED_REASON_NO_PHYSICAL_LOCATOR = 1;
  // Selects source unavailable for workspace unobserved reason.
  WORKSPACE_UNOBSERVED_REASON_SOURCE_UNAVAILABLE = 2;
}

// Defines the closed vocabulary for activation outcome.
enum ActivationOutcome {
  // No explicit activation outcome. Does not select an action.
  ACTIVATION_OUTCOME_UNSPECIFIED = 0;
  // Selects rejected before commit for activation outcome.
  ACTIVATION_OUTCOME_REJECTED_BEFORE_COMMIT = 1;
  // Selects not committed for activation outcome.
  ACTIVATION_OUTCOME_NOT_COMMITTED = 2;
  // Selects commit unknown for activation outcome.
  ACTIVATION_OUTCOME_COMMIT_UNKNOWN = 3;
  // Selects committed reconciling for activation outcome.
  ACTIVATION_OUTCOME_COMMITTED_RECONCILING = 4;
  // Selects published for activation outcome.
  ACTIVATION_OUTCOME_PUBLISHED = 5;
  // Selects restart required for activation outcome.
  ACTIVATION_OUTCOME_RESTART_REQUIRED = 6;
}

// Defines the closed vocabulary for transaction outcome.
enum TransactionOutcome {
  // No explicit transaction outcome. Does not select an action.
  TRANSACTION_OUTCOME_UNSPECIFIED = 0;
  // Selects not committed for transaction outcome.
  TRANSACTION_OUTCOME_NOT_COMMITTED = 1;
  // Selects commit unknown for transaction outcome.
  TRANSACTION_OUTCOME_COMMIT_UNKNOWN = 2;
  // Selects committed for transaction outcome.
  TRANSACTION_OUTCOME_COMMITTED = 3;
  // Selects no transaction for transaction outcome.
  TRANSACTION_OUTCOME_NO_TRANSACTION = 4;
}

// Defines the closed vocabulary for configuration diagnostic code.
enum ConfigurationDiagnosticCode {
  // No explicit configuration diagnostic code. Does not select an action.
  CONFIGURATION_DIAGNOSTIC_CODE_UNSPECIFIED = 0;
  // Selects candidate rejected for configuration diagnostic code.
  CONFIGURATION_DIAGNOSTIC_CODE_CANDIDATE_REJECTED = 1;
  // Selects workspace changed for configuration diagnostic code.
  CONFIGURATION_DIAGNOSTIC_CODE_WORKSPACE_CHANGED = 2;
  // Selects reconciliation required for configuration diagnostic code.
  CONFIGURATION_DIAGNOSTIC_CODE_RECONCILIATION_REQUIRED = 3;
  // Selects activation unavailable for configuration diagnostic code.
  CONFIGURATION_DIAGNOSTIC_CODE_ACTIVATION_UNAVAILABLE = 4;
}

// Defines the closed vocabulary for version availability.
enum VersionAvailability {
  // No explicit version availability. Does not select an action.
  VERSION_AVAILABILITY_UNSPECIFIED = 0;
  // Selects retained for version availability.
  VERSION_AVAILABILITY_RETAINED = 1;
  // Selects purged for version availability.
  VERSION_AVAILABILITY_PURGED = 2;
}

// Defines the closed vocabulary for generation availability.
enum GenerationAvailability {
  // No explicit generation availability. Does not select an action.
  GENERATION_AVAILABILITY_UNSPECIFIED = 0;
  // Selects complete for generation availability.
  GENERATION_AVAILABILITY_COMPLETE = 1;
  // Selects partially purged for generation availability.
  GENERATION_AVAILABILITY_PARTIALLY_PURGED = 2;
}

// Defines the closed vocabulary for resync reason.
enum ResyncReason {
  // No explicit resync reason. Does not select an action.
  RESYNC_REASON_UNSPECIFIED = 0;
  // Selects epoch changed for resync reason.
  RESYNC_REASON_EPOCH_CHANGED = 1;
  // Selects token invalid for resync reason.
  RESYNC_REASON_TOKEN_INVALID = 2;
  // Selects history lost for resync reason.
  RESYNC_REASON_HISTORY_LOST = 3;
  // Selects authority changed for resync reason.
  RESYNC_REASON_AUTHORITY_CHANGED = 4;
  // Selects activation signal for resync reason.
  RESYNC_REASON_ACTIVATION_SIGNAL = 5;
  // Selects closed for resync reason.
  RESYNC_REASON_CLOSED = 6;
}

// A durable SQL attempt is distinct from a proven runtime publication.
enum ConfigurationOperationPhase {
  // No explicit configuration operation phase. Does not select an action.
  CONFIGURATION_OPERATION_PHASE_UNSPECIFIED = 0;
  // SQL committed. Runtime publication is not established by this read.
  CONFIGURATION_OPERATION_PHASE_COMMITTED = 1;
  // The native owner proved exact publication and terminal bytes are durable.
  CONFIGURATION_OPERATION_PHASE_PUBLISHED = 2;
  // The native owner durably reserved this intention before any stage. No
  // configuration commit or target generation is established yet.
  CONFIGURATION_OPERATION_PHASE_ACCEPTED = 3;
  // The native owner proved rejection before commit; Status is canonical.
  CONFIGURATION_OPERATION_PHASE_FAILED = 4;
}
