syntax = "proto3";

package home.api.v2;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/field_info.proto";
import "google/api/resource.proto";
import "google/longrunning/operations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/damione1/Homeward/gen/home/api/v2;apiv2";
option java_multiple_files = true;
option java_outer_classname = "ConfigurationDocumentsProto";
option java_package = "com.home.api.v2";

enum DocumentKind {
  DOCUMENT_KIND_UNSPECIFIED = 0;
  DOCUMENT_KIND_YAML_SOURCE = 1;
  DOCUMENT_KIND_AUTHORIZATION_POLICY = 2;
  DOCUMENT_KIND_MFA_POLICY = 3;
  DOCUMENT_KIND_OPERATIONAL_YAML = 4;
  DOCUMENT_KIND_BOOTSTRAP_LAUNCH = 5;
  DOCUMENT_KIND_DASHBOARD_SOURCE = 6;
  DOCUMENT_KIND_AUTOMATION_SOURCE = 7;
  DOCUMENT_KIND_SCRIPT_SOURCE = 8;
  DOCUMENT_KIND_SCENE_SOURCE = 9;
  DOCUMENT_KIND_OWNERSHIP_SOURCE = 10;
}

enum DirtyState {
  DIRTY_STATE_UNSPECIFIED = 0;
  DIRTY_STATE_CLEAN = 1;
  DIRTY_STATE_UNVALIDATED = 2;
  DIRTY_STATE_REJECTED = 3;
  DIRTY_STATE_RECONCILING = 4;
  DIRTY_STATE_UNAVAILABLE = 5;
}

message DocumentId {
  string value = 1;
}
message DocumentVersion {
  int64 revision = 1;
  // Exact source bytes, never a manifest or semantic digest.
  bytes source_sha256 = 2;
}
message ActiveGeneration {
  int64 revision = 1;
  bytes manifest_sha256 = 2;
}
message WorkspaceObservation {
  bytes source_sha256 = 1;
  google.protobuf.Timestamp updated_at = 2;
  DirtyState dirty = 3;
  // Diagnostic binds the exact observed source, independently of the SQL active
  // version. It is absent on clean or replaced candidates; never parser text.
  WorkspaceDiagnostic diagnostic = 4;
}
message WorkspaceDiagnostic {
  DocumentId document = 1;
  bytes observed_source_sha256 = 2;
  google.protobuf.Timestamp observed_at = 3;
  ConfigurationDiagnosticCode code = 4;
}
enum WorkspaceUnobservedReason {
  WORKSPACE_UNOBSERVED_REASON_UNSPECIFIED = 0;
  // SQL metadata is readable, but this owner has no physical locator for this
  // document. Absence of an observation is never a claim that YAML is clean.
  WORKSPACE_UNOBSERVED_REASON_NO_PHYSICAL_LOCATOR = 1;
  WORKSPACE_UNOBSERVED_REASON_SOURCE_UNAVAILABLE = 2;
}
message WorkspaceUnobserved {
  WorkspaceUnobservedReason reason = 1;
}
message ConfigurationDocument {
  option (google.api.resource) = {
    type: "homeward.damiengoehrig.ca/ConfigurationDocument"
    pattern: "homes/{home}/configurationDocuments/{configuration_document}"
    singular: "configurationDocument"
    plural: "configurationDocuments"
  };
  DocumentId id = 13;
  DocumentKind kind = 2;
  string schema_version = 3;
  string syntax_profile = 4;
  DocumentVersion version = 5;
  google.protobuf.Timestamp updated_at = 6;
  bool active = 7;
  oneof workspace_state {
    // Invalid YAML can have an exact-byte observation without being admitted.
    WorkspaceObservation workspace = 8;
    WorkspaceUnobserved workspace_unobserved = 10;
  }
  // A keyed opaque reference to the protected source. It is not source bytes,
  // a secret name, a path, or an editable redacted YAML replacement.
  bytes protected_source_reference = 9;
  // Independently admitted active generation; unrelated to source SQL revision.
  ActiveGeneration active_generation = 11;
  // Opaque journal position bound to this SQL/workspace cut.
  string resume_token = 12;
  // Canonical immutable API resource identity.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  // Opaque source revision; mutations still require independent workspace CAS.
  string etag = 14;
}

enum ActivationOutcome {
  ACTIVATION_OUTCOME_UNSPECIFIED = 0;
  ACTIVATION_OUTCOME_REJECTED_BEFORE_COMMIT = 1;
  ACTIVATION_OUTCOME_NOT_COMMITTED = 2;
  ACTIVATION_OUTCOME_COMMIT_UNKNOWN = 3;
  ACTIVATION_OUTCOME_COMMITTED_RECONCILING = 4;
  ACTIVATION_OUTCOME_PUBLISHED = 5;
  ACTIVATION_OUTCOME_RESTART_REQUIRED = 6;
}
enum TransactionOutcome {
  TRANSACTION_OUTCOME_UNSPECIFIED = 0;
  TRANSACTION_OUTCOME_NOT_COMMITTED = 1;
  TRANSACTION_OUTCOME_COMMIT_UNKNOWN = 2;
  TRANSACTION_OUTCOME_COMMITTED = 3;
  TRANSACTION_OUTCOME_NO_TRANSACTION = 4;
}
enum ConfigurationDiagnosticCode {
  CONFIGURATION_DIAGNOSTIC_CODE_UNSPECIFIED = 0;
  CONFIGURATION_DIAGNOSTIC_CODE_CANDIDATE_REJECTED = 1;
  CONFIGURATION_DIAGNOSTIC_CODE_WORKSPACE_CHANGED = 2;
  CONFIGURATION_DIAGNOSTIC_CODE_RECONCILIATION_REQUIRED = 3;
  CONFIGURATION_DIAGNOSTIC_CODE_ACTIVATION_UNAVAILABLE = 4;
}
message ActivationResult {
  ActivationOutcome outcome = 1;
  TransactionOutcome transaction = 2;
  // Absent when no target generation exists yet.
  optional int64 generation_revision = 3;
  repeated ConfigurationDiagnosticCode diagnostics = 4;
}
message GetConfigurationDocumentRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "homeward.damiengoehrig.ca/ConfigurationDocument"
  ];
}

message ListConfigurationDocumentsRequest {
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "homeward.damiengoehrig.ca/ConfigurationDocument"
  ];
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];
}
message ListConfigurationDocumentsResponse {
  repeated ConfigurationDocument documents = 1;
  string next_page_token = 2;
}
enum VersionAvailability {
  VERSION_AVAILABILITY_UNSPECIFIED = 0;
  VERSION_AVAILABILITY_RETAINED = 1;
  VERSION_AVAILABILITY_PURGED = 2;
}
message ConfigurationRevision {
  option (google.api.resource) = {
    type: "homeward.damiengoehrig.ca/ConfigurationRevision"
    pattern: "homes/{home}/configurationDocuments/{configuration_document}/revisions/{revision}"
    singular: "revision"
    plural: "revisions"
  };
  // Immutable SQL source revision under its canonical document.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  DocumentId id = 6;
  DocumentVersion version = 2;
  VersionAvailability availability = 3;
  // Absent when the source row was purged. No invented timestamp/schema.
  google.protobuf.Timestamp updated_at = 4;
  string schema_version = 5;
}
enum GenerationAvailability {
  GENERATION_AVAILABILITY_UNSPECIFIED = 0;
  GENERATION_AVAILABILITY_COMPLETE = 1;
  GENERATION_AVAILABILITY_PARTIALLY_PURGED = 2;
}
message ConfigurationGeneration {
  option (google.api.resource) = {
    type: "homeward.damiengoehrig.ca/ConfigurationGeneration"
    pattern: "homes/{home}/configurationGenerations/{configuration_generation}"
    singular: "configurationGeneration"
    plural: "configurationGenerations"
  };
  // Immutable activation generation; independent from each source revision.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  ActiveGeneration generation = 4;
  GenerationAvailability availability = 2;
  google.protobuf.Timestamp created_at = 3;
}
message ListConfigurationRevisionsRequest {
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "homeward.damiengoehrig.ca/ConfigurationDocument"
  ];
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];
}
message ListConfigurationRevisionsResponse {
  repeated ConfigurationRevision versions = 1;
  string next_page_token = 2;
}
message ListConfigurationGenerationsRequest {
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "homeward.damiengoehrig.ca/ConfigurationGeneration"
  ];
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];
}
message ListConfigurationGenerationsResponse {
  repeated ConfigurationGeneration generations = 1;
  string next_page_token = 2;
}
message ConfigurationSchema {
  option (google.api.resource) = {
    type: "homeward.damiengoehrig.ca/ConfigurationSchema"
    pattern: "homes/{home}/configurationSchemas/{configuration_schema}"
    singular: "configurationSchema"
    plural: "configurationSchemas"
  };
  // Stable lossless identity of the immutable SQL schema key and document kind.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  DocumentKind kind = 5;
  string schema_version = 2;
  string syntax_profile = 3;
  // Global Config API writes only the selected operational workspace. Launch,
  // human policies and domain-specific logic retain their existing authorities.
  bool editable_operational_workspace = 4;
}
message ListConfigurationSchemasRequest {
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "homeward.damiengoehrig.ca/ConfigurationSchema"
  ];
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];
}
message ListConfigurationSchemasResponse {
  repeated ConfigurationSchema schemas = 1;
  string next_page_token = 2;
}
message PublishConfigurationDocumentRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "homeward.damiengoehrig.ca/ConfigurationDocument"
  ];
  DocumentVersion expected = 2;
  // Required independently of admitted source: permits correcting dirty YAML
  // without silently replacing an external edit since the last observation.
  bytes expected_workspace_sha256 = 3;
  // Full exact bytes explicitly supplied by the administrator. A public
  // protected_source_reference/projection is never accepted as replacement.
  bytes exact_yaml_source = 4;
  // UUID identifying this intent for 24-hour durable result lookup.
  string request_id = 5 [(google.api.field_behavior) = OPTIONAL, (google.api.field_info).format = UUID4];
}
message RollbackConfigurationDocumentRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "homeward.damiengoehrig.ca/ConfigurationDocument"
  ];
  DocumentVersion expected = 2;
  bytes expected_workspace_sha256 = 3;
  ActiveGeneration historical = 4;
  // UUID identifying this intent for 24-hour durable result lookup.
  string request_id = 5 [(google.api.field_behavior) = OPTIONAL, (google.api.field_info).format = UUID4];
}
enum ResyncReason {
  RESYNC_REASON_UNSPECIFIED = 0;
  RESYNC_REASON_EPOCH_CHANGED = 1;
  RESYNC_REASON_TOKEN_INVALID = 2;
  RESYNC_REASON_HISTORY_LOST = 3;
  RESYNC_REASON_AUTHORITY_CHANGED = 4;
  RESYNC_REASON_ACTIVATION_SIGNAL = 5;
  RESYNC_REASON_CLOSED = 6;
}
message DocumentChange {
  // Canonical changed resource; never an executable source binding key.
  string name = 1 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference).type = "homeward.damiengoehrig.ca/ConfigurationDocument"
  ];
  DocumentVersion version = 2;
  DirtyState dirty = 3;
  // Separate from the admitted source hash. Absent while reconciliation cannot
  // establish which filesystem bytes are current.
  optional bytes observed_workspace_sha256 = 4;
}
message ChangeBatch {
  repeated DocumentChange changes = 1;
  string resume_token = 2;
}
message ResyncRequired {
  ResyncReason reason = 1;
}
message WatchReady {
  string resume_token = 1;
}
message WatchConfigurationRequest {
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "homeward.damiengoehrig.ca/Home"
  ];
  string resume_token = 2 [(google.api.field_behavior) = REQUIRED];
}
message WatchConfigurationResponse {
  oneof result {
    ChangeBatch changes = 1;
    ResyncRequired resync_required = 2;
    // Confirms both subscriptions were installed and authority rechecked. This
    // acknowledges the supplied cursor; it does not advance over replay data.
    WatchReady ready = 3;
  }
}

// One common TLS-required PublicPlan. Human admin GLOBAL_CONFIGURATION reads
// and writes, with current authorization and session lease at every emission.
// No listener, MCP route, internal routine principal or second activation owner.
service ConfigurationService {
  option (google.api.default_host) = "homeward.damiengoehrig.ca";
  rpc GetConfigurationDocument(GetConfigurationDocumentRequest) returns (ConfigurationDocument) {
    option (google.api.http) = {get: "/v2/{name=homes/*/configurationDocuments/*}"};
    option (google.api.method_signature) = "name";
  }
  rpc ListConfigurationDocuments(ListConfigurationDocumentsRequest) returns (ListConfigurationDocumentsResponse) {
    option (google.api.http) = {get: "/v2/{parent=homes/*}/configurationDocuments"};
    option (google.api.method_signature) = "parent";
  }
  rpc ListConfigurationRevisions(ListConfigurationRevisionsRequest) returns (ListConfigurationRevisionsResponse) {
    option (google.api.http) = {get: "/v2/{parent=homes/*/configurationDocuments/*}/revisions"};
    option (google.api.method_signature) = "parent";
  }
  rpc ListConfigurationGenerations(ListConfigurationGenerationsRequest) returns (ListConfigurationGenerationsResponse) {
    option (google.api.http) = {get: "/v2/{parent=homes/*}/configurationGenerations"};
    option (google.api.method_signature) = "parent";
  }
  rpc ListConfigurationSchemas(ListConfigurationSchemasRequest) returns (ListConfigurationSchemasResponse) {
    option (google.api.http) = {get: "/v2/{parent=homes/*}/configurationSchemas"};
    option (google.api.method_signature) = "parent";
  }
  rpc PublishConfigurationDocument(PublishConfigurationDocumentRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {
      post: "/v2/{name=homes/*/configurationDocuments/*}:publish"
      body: "*"
    };
    option (google.api.method_signature) = "name";
    option (google.longrunning.operation_info) = {
      response_type: "ConfigurationActivationResult"
      metadata_type: "ConfigurationOperationMetadata"
    };
  }
  rpc RollbackConfigurationDocument(RollbackConfigurationDocumentRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {
      post: "/v2/{name=homes/*/configurationDocuments/*}:rollback"
      body: "*"
    };
    option (google.api.method_signature) = "name";
    option (google.longrunning.operation_info) = {
      response_type: "ConfigurationActivationResult"
      metadata_type: "ConfigurationOperationMetadata"
    };
  }
  // Streams metadata invalidations after a coherent cut. It never emits source
  // bytes; every frame rechecks the current credential and authority binding.
  rpc WatchConfiguration(WatchConfigurationRequest) returns (stream WatchConfigurationResponse) {
    option (google.api.http) = {
      post: "/v2/{parent=homes/*}:watchConfiguration"
      body: "*"
    };
    option (google.api.method_signature) = "parent";
  }
}

// A durable SQL attempt is distinct from a proven runtime publication.
enum ConfigurationOperationPhase {
  CONFIGURATION_OPERATION_PHASE_UNSPECIFIED = 0;
  // SQL committed. Runtime publication is not established by this read.
  CONFIGURATION_OPERATION_PHASE_COMMITTED = 1;
  // The native owner proved exact publication and terminal bytes are durable.
  CONFIGURATION_OPERATION_PHASE_PUBLISHED = 2;
  // The native owner durably reserved this intention before any stage. No
  // configuration commit or target generation is established yet.
  CONFIGURATION_OPERATION_PHASE_ACCEPTED = 3;
  // The native owner proved rejection before commit; Status is canonical.
  CONFIGURATION_OPERATION_PHASE_FAILED = 4;
}

// Allowed metadata type for google.longrunning configuration operations. No
// source, candidate, credential or parser/provider diagnostic may be included.
message ConfigurationOperationMetadata {
  // Immutable first durable creation time. A request_id reservation precedes
  // effects; an operation without request_id is created by its native commit.
  google.protobuf.Timestamp create_time = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  string generation = 2 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference).type = "homeward.damiengoehrig.ca/ConfigurationGeneration"
  ];
  // SQL activation generation, independent from every document revision.
  int64 generation_revision = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  bytes manifest_sha256 = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  ConfigurationOperationPhase phase = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Present only after the native configuration transaction is proven committed.
  google.protobuf.Timestamp commit_time = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
  string request_id = 7 [(google.api.field_behavior) = OUTPUT_ONLY, (google.api.field_info).format = UUID4];
}

// The sole successful response type of a configuration LRO. This exact target
// was published; a later current document belongs to a separate fresh Get.
message ConfigurationActivationResult {
  string generation = 1 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference).type = "homeward.damiengoehrig.ca/ConfigurationGeneration"
  ];
  int64 generation_revision = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  bytes manifest_sha256 = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
}
