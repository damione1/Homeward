syntax = "proto3";
package home.api.v2;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "home/api/v2/home.proto";

option go_package = "github.com/damione1/Homeward/gen/home/api/v2;apiv2";
option java_multiple_files = true;
option java_outer_classname = "EntityViewsProto";
option java_package = "com.home.api.v2";

// Caller-owned ephemeral captures over the native observation journal. A view
// expires after 60 seconds. Changes to rights, configuration or declarations
// invalidate it; reconnecting never executes a physical command.
service EntityViewService {
  option (google.api.default_host) = "homeward.damiengoehrig.ca";
  // Captures authorized entities and their simultaneous typed observations.
  rpc CreateEntityView(CreateEntityViewRequest) returns (EntityView) {
    option (google.api.http) = {
      post: "/v2/{parent=homes/*}/entityViews"
      body: "entity_view"
    };
    option (google.api.method_signature) = "parent,entity_view,entity_view_id";
  }
  // Reads metadata while rechecking current authority and capture lifetime.
  rpc GetEntityView(GetEntityViewRequest) returns (EntityView) {
    option (google.api.http) = {get: "/v2/{name=homes/*/entityViews/*}"};
    option (google.api.method_signature) = "name";
  }
  // Lists only live captures owned by this authenticated caller.
  rpc ListEntityViews(ListEntityViewsRequest) returns (ListEntityViewsResponse) {
    option (google.api.http) = {get: "/v2/{parent=homes/*}/entityViews"};
    option (google.api.method_signature) = "parent";
  }
  // Releases the capture and closes attached streams without physical effects.
  rpc DeleteEntityView(DeleteEntityViewRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v2/{name=homes/*/entityViews/*}"};
    option (google.api.method_signature) = "name";
  }
  // Reads one immutable page. Only the final page supplies a watch resume token.
  rpc QueryEntityView(QueryEntityViewRequest) returns (QueryEntityViewResponse) {
    option (google.api.http) = {get: "/v2/{name=homes/*/entityViews/*}:query"};
    option (google.api.method_signature) = "name";
  }
  // Watches from a completed snapshot or prior stream checkpoint. Invalidated
  // resumes close with a canonical resync error; clients discard the projection.
  rpc WatchEntityView(WatchEntityViewRequest) returns (stream WatchEntityViewResponse) {
    option (google.api.http) = {get: "/v2/{name=homes/*/entityViews/*}:watch"};
    option (google.api.method_signature) = "name,resume_token";
  }
}

// An ephemeral capture retaining only currently authorized entity declarations.
message EntityView {
  option (google.api.resource) = {
    type: "homeward.damiengoehrig.ca/EntityView"
    pattern: "homes/{home}/entityViews/{entity_view}"
    singular: "entityView"
    plural: "entityViews"
  };
  // Public identity; never an authorization credential.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  // Immutable bounded AIP-160 entity selection, evaluated after authorization.
  string filter = 2 [(google.api.field_behavior) = IMMUTABLE];
  // Capture creation time.
  google.protobuf.Timestamp create_time = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Absolute expiry; reading and watching never renew it.
  google.protobuf.Timestamp expire_time = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Creates a bounded ephemeral capture.
message CreateEntityViewRequest {
  // Installation containing the capture.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "homeward.damiengoehrig.ca/EntityView"
  ];
  // Immutable selection; omit filter to select all authorized entities.
  EntityView entity_view = 2 [(google.api.field_behavior) = REQUIRED];
  // Optional resource ID, following AIP-122 lowercase DNS-label syntax.
  // Omit to use a server-generated ID. Visible duplicate names are rejected.
  string entity_view_id = 3 [(google.api.field_behavior) = OPTIONAL];
}

// Reads capture metadata.
message GetEntityViewRequest {
  // Capture identity.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "homeward.damiengoehrig.ca/EntityView"
  ];
}

// Lists a bounded page of owned live captures in canonical name order.
message ListEntityViewsRequest {
  // Installation containing the captures.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "homeward.damiengoehrig.ca/EntityView"
  ];
  // Zero selects 100; values above 500 are capped; negative is invalid.
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];
  // Opaque continuation bound to caller, rights and installation.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];
}

// One page of live capture metadata without hidden counts.
message ListEntityViewsResponse {
  // Captures still valid and owned by this caller.
  repeated EntityView entity_views = 1;
  // Empty when no further capture remains.
  string next_page_token = 2;
}

// Releases a capture without cancelling any physical command.
message DeleteEntityViewRequest {
  // Capture identity.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "homeward.damiengoehrig.ca/EntityView"
  ];
}

// Reads observations from the same immutable capture.
message QueryEntityViewRequest {
  // Capture identity.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "homeward.damiengoehrig.ca/EntityView"
  ];
  // Zero selects 100; values above 500 are capped; negative is invalid.
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];
  // Opaque continuation; page size may change between reads.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];
}

// One authorized entity and its typed capabilities at one observation cut.
message EntityViewEntry {
  // Entity metadata from the capture's immutable declarations.
  Entity entity = 1;
  // Only the caller's authorized capability slots, with explicit quality.
  repeated Capability capabilities = 2;
}

// A bounded immutable page and eventual completed-snapshot checkpoint.
message QueryEntityViewResponse {
  // Authorized selected entities in canonical name order.
  repeated EntityViewEntry entries = 1;
  // Empty at the final snapshot page.
  string next_page_token = 2;
  // Present only at the final page; opaque, bounded and not authority.
  string resume_token = 3;
}

// Resumes an existing capture without recapturing or dispatching a command.
message WatchEntityViewRequest {
  // Capture identity.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "homeward.damiengoehrig.ca/EntityView"
  ];
  // Checkpoint from a completed snapshot or previously received stream frame.
  string resume_token = 2 [(google.api.field_behavior) = REQUIRED];
}

// An idempotent membership change projected from an exact native journal entry.
message WatchEntityViewResponse {
  // Opaque checkpoint for this frame, bound to the capture and current rights.
  string resume_token = 1;
  // Exactly one membership change; removal of an absent entity is harmless.
  oneof change {
    // Replaces or adds the entity when it matches the immutable selection.
    EntityViewEntry upsert = 2;
    // Removes an authorized entity that no longer matches the selection.
    string remove = 3 [(google.api.resource_reference).type = "homeward.damiengoehrig.ca/Entity"];
  }
}
