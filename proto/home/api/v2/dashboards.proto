syntax = "proto3";
package home.api.v2;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "home/api/v2/extended_traits.proto";
import "home/api/v2/traits.proto";

option go_package = "github.com/damione1/Homeward/gen/home/api/v2;apiv2";
option java_multiple_files = true;
option java_outer_classname = "DashboardsProto";
option java_package = "com.home.api.v2";

// Read-only projections of published dashboard configuration. Editing belongs
// to the native configuration publication workflow; no dashboard CRUD is implied.
service DashboardService {
  option (google.api.default_host) = "homeward.damiengoehrig.ca";
  // Reads one authorized configured dashboard without observation admission.
  rpc GetDashboard(GetDashboardRequest) returns (Dashboard) {
    option (google.api.http) = {get: "/v2/{name=homes/*/dashboards/*}"};
    option (google.api.method_signature) = "name";
  }
  // Lists authorized dashboards, bounded by both count and encoded bytes.
  rpc ListDashboards(ListDashboardsRequest) returns (ListDashboardsResponse) {
    option (google.api.http) = {get: "/v2/{parent=homes/*}/dashboards"};
    option (google.api.method_signature) = "parent";
  }
  // Waits for catalogue invalidation. No observations or replacement resources
  // are streamed; clients release their old projection and list again.
  rpc WatchDashboards(WatchDashboardsRequest) returns (stream WatchDashboardsResponse) {
    option (google.api.http) = {get: "/v2/{parent=homes/*}/dashboards:watch"};
    option (google.api.method_signature) = "parent,resume_token";
  }
  // Projects configuration against the exact authorized capture incarnation.
  // This is a read and cannot execute, acknowledge or confirm a physical effect.
  rpc QueryDashboard(QueryDashboardRequest) returns (QueryDashboardResponse) {
    option (google.api.http) = {get: "/v2/{name=homes/*/dashboards/*}:query"};
    option (google.api.method_signature) = "name,entity_view,resume_token";
  }
}

// A bounded inert layout from published configuration, with current authorized
// canonical references. Raw source files, hashes and observations are excluded.
message Dashboard {
  option (google.api.resource) = {
    type: "homeward.damiengoehrig.ca/Dashboard"
    pattern: "homes/{home}/dashboards/{dashboard}"
    singular: "dashboard"
    plural: "dashboards"
  };
  // Format: homes/{home}/dashboards/{dashboard}.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  // Human-readable configured title; never an identity or command selector.
  string display_name = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Opaque representation validator, including authorized bindings and profile.
  string etag = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Native source publication time; never synthesized from request time.
  google.protobuf.Timestamp update_time = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Finite authored layout; unknown vocabulary must remain inert.
  DashboardLayout layout = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Actor-specific display preference from the native profile owner.
  // Absence remains absence; clients must not substitute UTC or device defaults.
  DashboardDisplayProfile display_profile = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Explicit actor presentation preferences, independent of command authority.
message DashboardDisplayProfile {
  // Declared IANA time-zone identifier. An absent profile has no declared zone.
  string time_zone = 1;
}

// Reads one configured resource, not a joined observation projection.
message GetDashboardRequest {
  // Format: homes/{home}/dashboards/{dashboard}.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "homeward.damiengoehrig.ca/Dashboard"
  ];
}

// Lists published resources in ascending canonical-name order.
message ListDashboardsRequest {
  // Format: homes/{home}.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "homeward.damiengoehrig.ca/Dashboard"
  ];
  // Zero selects 20. Maximum 100; larger values are capped, negatives invalid.
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];
  // Opaque continuation bound to caller, rights and source/profile generation.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];
}

// One bounded page; no hidden resource counts are disclosed.
message ListDashboardsResponse {
  // Complete authorized resources. One resource is limited to 1 MiB.
  repeated Dashboard dashboards = 1;
  // Empty at the end; page boundaries may stop early for the byte budget.
  string next_page_token = 2;
  // Present only on the final page of a coherent catalogue enumeration.
  string resume_token = 3;
}

// Watches the exact admitted catalogue, with current credentials and policy.
message WatchDashboardsRequest {
  // Format: homes/{home}.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "homeward.damiengoehrig.ca/Dashboard"
  ];
  // Opaque completed-enumeration checkpoint, never an authority credential.
  string resume_token = 2 [(google.api.field_behavior) = REQUIRED];
}

// A configuration invalidation signal, never a replacement observation snapshot.
message WatchDashboardsResponse {
  // True means discard the previous catalogue and all its joined projections.
  bool invalidated = 1;
}

// Joins a dashboard to one currently authorized, completed entity capture.
message QueryDashboardRequest {
  // Format: homes/{home}/dashboards/{dashboard}.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "homeward.damiengoehrig.ca/Dashboard"
  ];
  // Format: homes/{home}/entityViews/{entity_view}; must belong to this caller.
  string entity_view = 2 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "homeward.damiengoehrig.ca/EntityView"
  ];
  // Completed snapshot or stream checkpoint, bound to the capture incarnation.
  string resume_token = 3 [(google.api.field_behavior) = REQUIRED];
}

// A denormalized read projection over existing owners, not a new resource or
// state catalogue. Retaining configuration here makes the admitted join atomic.
message QueryDashboardResponse {
  // Configuration projected only through the requested authorized capture.
  Dashboard dashboard = 1;
  // Exact capture name from the admitted request.
  string entity_view = 2 [(google.api.resource_reference).type = "homeward.damiengoehrig.ca/EntityView"];
  // Exact admitted checkpoint; clients compare it without decoding it.
  string resume_token = 3;
  // Opaque binding of caller, dashboard etag and capture incarnation. It never
  // grants authority and is never accepted by ExecuteCapability.
  string binding = 4;
  // No later than the entity capture expiry; reads never extend its lifetime.
  google.protobuf.Timestamp expire_time = 5;
}

// Closed typed comparison values. Text is only actual Helper text/selection;
// source-format strings are converted by the native projector using the exact
// bound capability. Unknown or ambiguous values make the containing node inert.
message DashboardLiteral {
  // Exactly one explicit typed value.
  oneof value {
    // Explicit binary observation, light power or boolean Helper value.
    bool boolean_value = 1;
    // Exact integer Helper counter value.
    int64 integer_value = 2;
    // Finite numeric value; NaN and infinities are invalid.
    double number_value = 3;
    // Actual text or selected-option value, never an encoded enum or number.
    string text_value = 4;
    // Exact source decimal with validated grammar; never parsed through double.
    string decimal_value = 5;
    // Explicit Power observation value.
    PowerValue power_value = 6;
    // Explicit cover state.
    CoverState cover_state = 7;
    // Explicit lock state.
    LockState lock_state = 8;
    // Explicit alarm state.
    AlarmState alarm_state = 9;
    // Explicit thermostat mode, not inferred activity.
    TemperatureMode temperature_mode = 10;
    // Explicit fan speed, never synthesized into power.
    FanSpeed fan_speed = 11;
    // Explicit weather condition.
    WeatherCondition weather_condition = 12;
    // Explicit residence value.
    Residence residence = 13;
  }
}

// A dimension has one explicit alternative; an unspecified dimension is absent.
message DashboardLayoutDimension {
  // Exactly one explicit dimension.
  oneof size {
    // Grid count in the inclusive range 1..12.
    int32 count = 1;
    // Full available span.
    google.protobuf.Empty full = 2;
    // Size determined by the finite native layout algorithm.
    google.protobuf.Empty auto = 3;
  }
}

// Bounded source location for diagnostics, excluding source contents.
message DashboardLayoutSource {
  // Source-relative document path, excluding raw contents.
  string file = 1;
  // Source line in 0..2147483647; zero means unavailable.
  int32 line = 2;
  // Source column in 0..2147483647; zero means unavailable.
  int32 column = 3;
  // Stable location inside the published source document.
  string path = 4;
  // Bounded source variant label for inert diagnostics.
  string variant = 5;
}

// One inert source node. Structure and presentation are closed alternatives;
// unrelated node families cannot carry each other's fields.
message DashboardLayoutNode {
  // Local identity, unique within this dashboard's bounded forest.
  string id = 1;
  // Diagnostic location in authorized source; no raw source contents.
  DashboardLayoutSource source = 2;
  // Configured human-readable text, never an identity or expression.
  string display_name = 3;
  // Optional finite local icon.
  DashboardIcon icon = 4;
  // Authored placement within a parent container; absent for root views.
  DashboardPlacement placement = 5;
  // Optional presentation-only logical screen-width bounds.
  DashboardScreenVisibility screen_visibility = 6;
  // Optional typed visibility. It changes presentation, never authority.
  DashboardPredicate visibility = 7;
  // Exactly one explicit structural alternative.
  oneof content {
    // A root view with a stable configured route.
    DashboardViewNode view = 10;
    // An authored section container.
    DashboardSectionNode section = 11;
    // A bounded grid container.
    DashboardGridNode grid = 12;
    // An ordered horizontal container.
    DashboardStackNode horizontal_stack = 13;
    // An ordered vertical container.
    DashboardStackNode vertical_stack = 14;
    // A noninteractive heading presentation.
    DashboardHeadingNode heading = 15;
    // A control or summary bound to one exact capability.
    DashboardTileNode tile = 16;
    // A finite authored recipe presentation.
    DashboardRecipeNode recipe = 17;
    // A configured popup container.
    DashboardPopupNode popup = 18;
    // A bounded chip container.
    DashboardChipGroupNode chip_group = 19;
    // A finite widget with exact data bindings.
    DashboardWidget widget = 20;
    // An inert diagnostic. It cannot carry executable interaction data.
    DashboardUnsupportedNode unsupported = 21;
  }
}

// Explicit authored placement, never inferred from array positions.
message DashboardPlacement {
  // Horizontal grid span.
  DashboardLayoutDimension column_span = 1;
  // Vertical grid span.
  DashboardLayoutDimension row_span = 2;
  // Bounded responsive spans.
  repeated DashboardResponsiveSpan responsive_spans = 3;
}

// Shared ordered children and explicit spacing for actual containers only.
message DashboardChildren {
  // Unique child-node IDs with no shared child or cycle.
  repeated string children = 1;
  // Logical spacing in 0..256; zero is a legitimate authored value.
  int32 gap = 2;
}

// A configured root view.
message DashboardViewNode {
  // Stable configured route, not an external URL or executable expression.
  string route = 1;
  // Ordered section/container children.
  DashboardChildren children = 2;
  // Maximum column count in 0..12; zero means unspecified.
  int32 maximum_columns = 3;
  // Minimum logical column width in 0..4096; zero means unspecified.
  int32 minimum_column_width = 4;
}

// An authored section with only container properties.
message DashboardSectionNode {
  // Ordered child cards.
  DashboardChildren children = 1;
  // Minimum logical column width in 0..4096; zero means unspecified.
  int32 minimum_column_width = 2;
}

// An authored grid, distinct from a stack or heading.
message DashboardGridNode {
  // Ordered child cards.
  DashboardChildren children = 1;
  // Column count in 1..12; zero means unspecified.
  int32 columns = 2;
  // Whether to use square cells; absence differs from false.
  optional bool square = 3;
  // Minimum logical column width in 0..4096; zero means unspecified.
  int32 minimum_column_width = 4;
  // Finite authored gestures; no gesture grants command authority.
  DashboardInteractions interactions = 5;
}

// Stack direction is represented by the containing oneof alternative.
message DashboardStackNode {
  // Ordered children and explicit spacing.
  DashboardChildren children = 1;
  // Finite authored gestures; no gesture grants command authority.
  DashboardInteractions interactions = 2;
}

// A heading cannot carry tile, grid or widget attributes.
message DashboardHeadingNode {
  // Explicit finite heading style.
  DashboardHeadingStyle style = 1;
  // Finite authored gestures; no gesture grants command authority.
  DashboardInteractions interactions = 2;
}

// One exact admitted capability; a sibling is never an implicit substitute.
message DashboardTileNode {
  // Canonical capability name, independently re-admitted before every gesture.
  string capability = 1 [(google.api.resource_reference).type = "homeward.damiengoehrig.ca/Capability"];
  // Closed source-authored controls supported by this capability.
  repeated DashboardFeatureKind features = 2;
  // Explicit control or summary presentation.
  DashboardControlPresentation presentation = 3;
  // Whether to use vertical presentation; absence differs from false.
  optional bool vertical = 4;
  // Whether to hide the value; this grants no observation authority.
  optional bool hide_observation = 5;
  // Finite authored gestures; no gesture grants command authority.
  DashboardInteractions interactions = 6;
}

// A bounded authored recipe, never a downloaded template implementation.
message DashboardRecipeNode {
  // Explicit closed recipe presentation kind.
  DashboardRecipeKind kind = 1;
  // Exact capability, when this recipe displays or controls an observation.
  string capability = 2 [(google.api.resource_reference).type = "homeward.damiengoehrig.ca/Capability"];
  // Configured plain secondary text; never evaluated as code.
  string secondary = 3;
  // Closed controls independently admitted against the bound capability.
  repeated DashboardFeatureKind features = 4;
  // Explicit control or summary presentation.
  DashboardControlPresentation presentation = 5;
  // Finite authored gestures; no gesture grants command authority.
  DashboardInteractions interactions = 6;
}

// A popup is a container with a stable local destination identity.
message DashboardPopupNode {
  // Ordered children and explicit spacing.
  DashboardChildren children = 1;
  // Finite authored gestures; no gesture grants command authority.
  DashboardInteractions interactions = 2;
}

// An ordered bounded group of authored chips.
message DashboardChipGroupNode {
  // Ordered children and explicit spacing.
  DashboardChildren children = 1;
  // Finite authored gestures; no gesture grants command authority.
  DashboardInteractions interactions = 2;
}

// Inert source diagnostics preserve explainability without fallback execution.
message DashboardUnsupportedNode {
  // Bounded diagnostic text without raw source or hidden target identities.
  string diagnostic = 1;
  // Retained inert descendants; each must itself be unsupported.
  repeated string children = 2;
}

// Inclusive logical-width bounds; zero means no bound, not authority.
message DashboardScreenVisibility {
  // Inclusive minimum logical width in 0..65535; zero is unbounded.
  int32 min_width = 1;
  // Inclusive maximum logical width in 0..65535; zero is unbounded.
  int32 max_width = 2;
}

// An authored responsive span for a specified column count.
message DashboardResponsiveSpan {
  // Explicit column count in 1..12.
  int32 columns = 1;
  // Authored span in 1..columns, with columns at most 12.
  int32 span = 2;
}

// One exact capability and closed observation selector; no sibling fallback.
message DashboardFieldBinding {
  // Exact canonical capability name; must match the declared role.
  string capability = 1 [(google.api.resource_reference).type = "homeward.damiengoehrig.ca/Capability"];
  // Closed observation selector on the exact capability.
  DashboardFieldKey field = 2;
}

// An explicit clock zone and optional exact weather capability.
message DashboardClockWeatherWidget {
  // Explicit IANA time-zone identifier; no UTC fallback.
  string time_zone = 1;
  // Optional exact Weather capability name.
  string weather_capability = 2 [(google.api.resource_reference).type = "homeward.damiengoehrig.ca/Capability"];
}

// Authored room presentation and independently bound observations.
message DashboardRoomWidget {
  // Local authored room identity, not a registry alias.
  string room_id = 1;
  // Optional exact numeric temperature field with declared unit.
  DashboardFieldBinding temperature = 2;
  // Independent exact field bindings with their own typed active values.
  repeated DashboardActivityBinding activity = 3;
}

// One exact activity field and its independently typed active values.
message DashboardActivityBinding {
  // Exact capability and observation selector.
  DashboardFieldBinding field = 1;
  // Closed values valid for this field; unknown values make the node inert.
  repeated DashboardLiteral active_values = 2;
}

// Independent exact control, current-value and target-value bindings.
message DashboardThermostatWidget {
  // Exact canonical entity name for information display.
  string entity = 1 [(google.api.resource_reference).type = "homeward.damiengoehrig.ca/Entity"];
  // Exact NumericMeasurement field with Celsius unit declared by the source.
  DashboardFieldBinding current_temperature = 2;
  // Exact TemperatureControl setpoint field.
  DashboardFieldBinding target_temperature = 3;
  // Closed explicit presentation selection.
  DashboardThermostatPresentation presentation = 4;
}

// An explicit calendar reference and bounded time window.
message DashboardAgendaWidget {
  // Exact canonical calendar name.
  string calendar = 1 [(google.api.resource_reference).type = "homeward.damiengoehrig.ca/Calendar"];
  // Explicit IANA time-zone identifier; no UTC fallback.
  string time_zone = 2;
  // Positive bounded agenda window.
  google.protobuf.Duration time_window = 3;
  // Number of displayed items in 1..1000.
  int32 limit = 4;
}

// An explicit task-list reference and bounded preview.
message DashboardTasksWidget {
  // Exact canonical task-list name.
  string task_list = 1 [(google.api.resource_reference).type = "homeward.damiengoehrig.ca/TaskList"];
  // Number of displayed items in 1..1000.
  int32 limit = 2;
  // Closed explicit presentation selection.
  DashboardTasksPresentation presentation = 3;
}

// Ordered exact lock, alarm or cover capabilities; no inferred family.
message DashboardSecurityWidget {
  // Ordered exact capability names.
  repeated string capabilities = 1 [(google.api.resource_reference).type = "homeward.damiengoehrig.ca/Capability"];
}

// An authored observation label with one exact field binding.
message DashboardObservationBinding {
  // Closed observation selector on the exact capability.
  DashboardFieldBinding field = 1;
  // Configured display label.
  string label = 2;
  // Closed typed values treated as active on the exact bound field.
  repeated DashboardLiteral active_values = 3;
  // Closed local icon selection.
  DashboardIcon icon = 4;
}

// An ordered bounded collection of exact observation bindings.
message DashboardObservationsWidget {
  // Ordered bounded observation configurations.
  repeated DashboardObservationBinding items = 1;
}

// Navigation within the authorized dashboard catalogue.
message DashboardNavigationWidget {
  // Exact authorized navigation destination.
  DashboardDestination destination = 1;
}

// Closed data-only widget alternatives, never downloaded executable code.
message DashboardWidget {
  // Exactly one explicit alternative.
  oneof content {
    // Clock and weather configuration.
    DashboardClockWeatherWidget clock_weather = 1;
    // Room observation configuration.
    DashboardRoomWidget room = 2;
    // Thermostat configuration.
    DashboardThermostatWidget thermostat = 3;
    // Calendar agenda configuration.
    DashboardAgendaWidget agenda = 4;
    // Task-list configuration.
    DashboardTasksWidget tasks = 5;
    // Security observation configuration.
    DashboardSecurityWidget security = 6;
    // Independent observation configuration.
    DashboardObservationsWidget observations = 7;
    // Navigation configuration.
    DashboardNavigationWidget navigation = 8;
  }
  // Optional navigation destination; never a command.
  DashboardDestination action = 10;
  // Configured navigation label.
  string action_label = 11;
  // Configured empty-state label.
  string empty_label = 12;
  // Finite authored gestures; no gesture grants command authority.
  DashboardInteractions interactions = 13;
}

// One exact authorized dashboard and local source-node identity.
message DashboardDestination {
  // Exact canonical dashboard name.
  string dashboard = 1 [(google.api.resource_reference).type = "homeward.damiengoehrig.ca/Dashboard"];
  // Stable local source-node ID within the dashboard.
  string node_id = 2;
  // Closed explicit presentation selection.
  DashboardPresentation presentation = 3;
}

// An entity reference for information display only.
message DashboardEntityTarget {
  // Exact canonical entity name for information display.
  string entity = 1 [(google.api.resource_reference).type = "homeward.damiengoehrig.ca/Entity"];
}

// An exact capability intention; execution still requires ExecuteCapability.
message DashboardCommand {
  // Exact canonical capability name; must match the declared role.
  string capability = 1 [(google.api.resource_reference).type = "homeward.damiengoehrig.ca/Capability"];
  // Closed kind; unspecified or unknown values must remain inert.
  DashboardCommandKind kind = 2;
}

// An explicit disabled interaction, distinct from an omitted gesture.
message DashboardNoAction {}

// A local confirmation prompt that grants no command authority.
message DashboardConfirmation {
  // Bounded plain text; an empty confirmation uses the native prompt.
  string text = 1;
}

// One explicit gesture intention with optional local confirmation.
message DashboardInteraction {
  // Explicit finite user gesture.
  DashboardGesture gesture = 1;
  // Exactly one explicit alternative.
  oneof intention {
    // Explicitly disables the interaction.
    DashboardNoAction none = 2;
    // Opens information for the exact entity.
    DashboardEntityTarget more_info = 3;
    // Navigates to the exact configured destination.
    DashboardDestination navigate = 4;
    // Requests a finite intention for the exact capability.
    DashboardCommand command = 5;
  }
  // Presence requests a local prompt, including when text is empty.
  DashboardConfirmation confirmation = 6;
  // Diagnostic location in the authorized published source.
  DashboardLayoutSource source = 7;
}

// A bounded literal comparison over one exact observed capability.
message DashboardStatePredicate {
  // Exact capability and observation field to compare.
  DashboardFieldBinding field = 1;
  // Closed expected value on the exact field; missing is never a match.
  DashboardLiteral expected = 2;
  // Closed equality or inequality comparison.
  DashboardComparison comparison = 3;
}

// A bounded recursive collection of visibility predicates.
message DashboardPredicateList {
  // Bounded child conditions; an empty list cannot authorize visibility.
  repeated DashboardPredicate conditions = 1;
}

// Data-only visibility conditions; absence cannot satisfy inequality.
message DashboardPredicate {
  // Exactly one explicit alternative.
  oneof condition {
    // Explicit constant visibility.
    bool constant = 1;
    // Exact literal value; missing, stale or unavailable is never a match.
    DashboardStatePredicate state = 2;
    // All conditions must be satisfied.
    DashboardPredicateList all = 3;
    // At least one condition must be satisfied.
    DashboardPredicateList any = 4;
  }
  // Diagnostic location in the authorized published source.
  DashboardLayoutSource source = 5;
}

// At most one interaction per gesture, on explicitly interactive node families.
message DashboardInteractions {
  // Unique gestures with explicit authored intentions.
  repeated DashboardInteraction interactions = 2;
}

// A bounded forest with at most 128 roots, 2432 nodes and depth 18.
message DashboardLayout {
  // Ordered root-node IDs.
  repeated string views = 2;
  // Unique bounded nodes forming a forest.
  repeated DashboardLayoutNode nodes = 3;
}

// Closed observation selectors; each is validated against its exact capability.
enum DashboardFieldKey {
  // No explicit dashboard field key. Does not select an action.
  DASHBOARD_FIELD_KEY_UNSPECIFIED = 0;
  // Selects state for dashboard field key.
  DASHBOARD_FIELD_KEY_STATE = 1;
  // Selects value for dashboard field key.
  DASHBOARD_FIELD_KEY_VALUE = 2;
  // Selects current temperature celsius for dashboard field key.
  DASHBOARD_FIELD_KEY_CURRENT_TEMPERATURE_CELSIUS = 3;
  // Selects setpoint celsius for dashboard field key.
  DASHBOARD_FIELD_KEY_SETPOINT_CELSIUS = 4;
  // Selects measurement for dashboard field key.
  DASHBOARD_FIELD_KEY_MEASUREMENT = 5;
}

// Finite heading presentation.
enum DashboardHeadingStyle {
  // Unspecified; never an admitted operational value.
  DASHBOARD_HEADING_STYLE_UNSPECIFIED = 0;
  // Default.
  DASHBOARD_HEADING_STYLE_DEFAULT = 1;
  // Title.
  DASHBOARD_HEADING_STYLE_TITLE = 2;
  // Subtitle.
  DASHBOARD_HEADING_STYLE_SUBTITLE = 3;
}

// Explicit control versus summary rendering.
enum DashboardControlPresentation {
  // Unspecified; never an admitted operational value.
  DASHBOARD_CONTROL_PRESENTATION_UNSPECIFIED = 0;
  // Controls.
  DASHBOARD_CONTROL_PRESENTATION_CONTROLS = 1;
  // Summary.
  DASHBOARD_CONTROL_PRESENTATION_SUMMARY = 2;
}

// Explicit thermostat presentation density.
enum DashboardThermostatPresentation {
  // Unspecified; never an admitted operational value.
  DASHBOARD_THERMOSTAT_PRESENTATION_UNSPECIFIED = 0;
  // Compact.
  DASHBOARD_THERMOSTAT_PRESENTATION_COMPACT = 1;
  // Detail.
  DASHBOARD_THERMOSTAT_PRESENTATION_DETAIL = 2;
  // Summary.
  DASHBOARD_THERMOSTAT_PRESENTATION_SUMMARY = 3;
}

// Explicit task-list presentation.
enum DashboardTasksPresentation {
  // Unspecified; never an admitted operational value.
  DASHBOARD_TASKS_PRESENTATION_UNSPECIFIED = 0;
  // Preview.
  DASHBOARD_TASKS_PRESENTATION_PREVIEW = 1;
  // Shopping.
  DASHBOARD_TASKS_PRESENTATION_SHOPPING = 2;
}

// Finite presentation recipes admitted by the native source compiler.
enum DashboardRecipeKind {
  // Unspecified; never an admitted operational value.
  DASHBOARD_RECIPE_KIND_UNSPECIFIED = 0;
  // Template.
  DASHBOARD_RECIPE_KIND_TEMPLATE = 1;
  // Select.
  DASHBOARD_RECIPE_KIND_SELECT = 2;
  // Alarm.
  DASHBOARD_RECIPE_KIND_ALARM = 3;
  // Bubble button.
  DASHBOARD_RECIPE_KIND_BUBBLE_BUTTON = 4;
  // Bubble popup.
  DASHBOARD_RECIPE_KIND_BUBBLE_POPUP = 5;
