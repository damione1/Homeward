syntax = "proto3";
package home.api.v2;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/field_info.proto";
import "google/api/resource.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "google/type/date.proto";

option go_package = "github.com/damione1/Homeward/gen/home/api/v2;apiv2";
option java_multiple_files = true;
option java_outer_classname = "TasksProto";
option java_package = "com.home.api.v2";

// Durable task collections and ordered tasks. Changes never command devices.
service TaskService {
  option (google.api.default_host) = "homeward.damiengoehrig.ca";
  // Lists authorized collections in stable identity order.
  rpc ListTaskLists(ListTaskListsRequest) returns (ListTaskListsResponse) {
    option (google.api.http) = {get: "/v2/{parent=homes/*}/taskLists"};
    option (google.api.method_signature) = "parent";
  }
  // Reads a collection and its collection-wide etag.
  rpc GetTaskList(GetTaskListRequest) returns (TaskList) {
    option (google.api.http) = {get: "/v2/{name=homes/*/taskLists/*}"};
    option (google.api.method_signature) = "name";
  }
  // Creates a native collection with a server-assigned identity.
  rpc CreateTaskList(CreateTaskListRequest) returns (TaskList) {
    option (google.api.http) = {
      post: "/v2/{parent=homes/*}/taskLists"
      body: "task_list"
    };
    option (google.api.method_signature) = "parent,task_list";
  }
  // Changes collection metadata with mandatory etag comparison.
  rpc UpdateTaskList(UpdateTaskListRequest) returns (TaskList) {
    option (google.api.http) = {
      patch: "/v2/{task_list.name=homes/*/taskLists/*}"
      body: "task_list"
    };
    option (google.api.method_signature) = "task_list,update_mask";
  }
  // Deletes the collection atomically;
  // an unknown commit must not be replayed.
  rpc DeleteTaskList(DeleteTaskListRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v2/{name=homes/*/taskLists/*}"};
    option (google.api.method_signature) = "name,etag";
  }
  // Lists tasks in their current atomic collection order.
  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse) {
    option (google.api.http) = {get: "/v2/{parent=homes/*/taskLists/*}/tasks"};
    option (google.api.method_signature) = "parent";
  }
  // Reads one task;
  // its etag also binds the collection ordering revision.
  rpc GetTask(GetTaskRequest) returns (Task) {
    option (google.api.http) = {get: "/v2/{name=homes/*/taskLists/*/tasks/*}"};
    option (google.api.method_signature) = "name";
  }
  // Appends a task using the current parent etag, without hidden retry.
  rpc AppendTask(AppendTaskRequest) returns (AppendTaskResponse) {
    option (google.api.http) = {
      post: "/v2/{name=homes/*/taskLists/*}:appendTask"
      body: "*"
    };
    option (google.api.method_signature) = "name,task,etag";
  }
  // Applies explicitly selected editable fields under the task's compound etag.
  rpc UpdateTask(UpdateTaskRequest) returns (Task) {
    option (google.api.http) = {
      patch: "/v2/{task.name=homes/*/taskLists/*/tasks/*}"
      body: "task"
    };
    option (google.api.method_signature) = "task,update_mask";
  }
  // Deletes a task and advances the collection etag in the same transaction.
  rpc DeleteTask(DeleteTaskRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v2/{name=homes/*/taskLists/*/tasks/*}"};
    option (google.api.method_signature) = "name,etag";
  }
  // Moves a task atomically. Position is never directly assigned by PATCH.
  rpc MoveTask(MoveTaskRequest) returns (Task) {
    option (google.api.http) = {
      post: "/v2/{name=homes/*/taskLists/*/tasks/*}:move"
      body: "*"
    };
    option (google.api.method_signature) = "name,etag";
  }
  // Bounded invalidations only: subscribe before reloading;
  // reconnect resyncs.
  rpc WatchTaskLists(WatchTaskListsRequest) returns (stream WatchTaskListsResponse) {
    option (google.api.http) = {
      post: "/v2/{parent=homes/*}/taskLists:watch"
      body: "*"
    };
    option (google.api.method_signature) = "parent";
  }
}

// A durable collection. Opaque names are unrelated to labels or aliases.
message TaskList {
  option (google.api.resource) = {
    type: "homeward.damiengoehrig.ca/TaskList"
    pattern: "homes/{home}/taskLists/{task_list}"
    singular: "taskList"
    plural: "taskLists"
  };
  // Canonical resource name.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  // Editable display label; labels never identify resources.
  string display_name = 2 [(google.api.field_behavior) = REQUIRED];
  // Source origin; unknown origins are not actionable.
  TaskListOrigin origin = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Time at which the owning source last changed this resource.
  google.protobuf.Timestamp update_time = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Required for updates and deletes. Bound to this exact collection.
  string etag = 5;
}

// An instant has an explicit IANA display zone;
// it is never a civil date.
// Task due instant.
message TaskDueInstant {
  // Explicit timestamp or civil clock components, according to the containing type.
  google.protobuf.Timestamp due_time = 1 [(google.api.field_behavior) = REQUIRED];
  // Explicit IANA time zone; never inferred from the server or device.
  string time_zone = 2 [(google.api.field_behavior) = REQUIRED];
}

// A task with a collection-bound CAS token. Output-only fields are ignored.
message Task {
  option (google.api.resource) = {
    type: "homeward.damiengoehrig.ca/Task"
    pattern: "homes/{home}/taskLists/{task_list}/tasks/{task}"
    singular: "task"
    plural: "tasks"
  };
  // Canonical resource name.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  // Bounded human-readable title.
  string summary = 2 [(google.api.field_behavior) = REQUIRED];
  // False is a valid explicit replacement value under update_mask.
  bool completed = 3 [(google.api.field_behavior) = OPTIONAL];
  // Bounded plain-text description; empty clears the selected field.
  optional string description = 4 [(google.api.field_behavior) = OPTIONAL];
  // Each selected mask path clears/replaces its own case; selecting both paths
  // (or sole *) replaces the complete due value atomically.
  oneof due {
    // Civil due date without an inferred time zone.
    google.type.Date due_date = 5;
    // Exact due instant with explicit display zone.
    TaskDueInstant due_instant = 6;
  }
  // Source completion instant, absent while incomplete or when historically unavailable.
  google.protobuf.Timestamp completion_time = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Zero-based position in the atomically ordered parent collection.
  int64 position = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Opaque token binds identity, item revision and collection ordering revision.
  string etag = 9;
}

// List task lists request.
message ListTaskListsRequest {
  // Canonical parent resource name.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "homeward.damiengoehrig.ca/TaskList"
  ];
  // Maximum results; zero selects 100, negative is invalid, and values above 256 clamp to 256.
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];
  // Opaque continuation bound to the same caller and captured collection.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];
}

// List task lists response.
message ListTaskListsResponse {
  // Authorized collections in stable resource-name order.
  repeated TaskList task_lists = 1;
  // Continuation token; empty when the captured collection is exhausted.
  string next_page_token = 2;
  // Exact size of the captured authorized collection.
  int32 total_size = 3;
}

// Get task list request.
message GetTaskListRequest {
  // Canonical resource name.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "homeward.damiengoehrig.ca/TaskList"
  ];
}

// Create task list request.
//     AIP133 permits data-plane IDs to be server-assigned.
//     Imported identities remain lossless; this request creates an opaque ID.
message CreateTaskListRequest {
  // Canonical parent resource name.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "homeward.damiengoehrig.ca/TaskList"
  ];
  // Collection resource carrying its current etag for an update.
  TaskList task_list = 2 [(google.api.field_behavior) = REQUIRED];
  // Optional UUID4 for exact original-result deduplication for 24 hours; different intention reuse fails.
  string request_id = 3 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.field_info).format = UUID4
  ];
}

// Update task list request.
message UpdateTaskListRequest {
  // Collection resource carrying its current etag for an update.
  TaskList task_list = 1 [(google.api.field_behavior) = REQUIRED];
  // Absent selects populated editable fields;
  // empty is a CAS-checked no-op.
  // A sole '*' replaces every editable field.
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = OPTIONAL];
  // Optional UUID4 for exact original-result deduplication for 24 hours; different intention reuse fails.
  string request_id = 3 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.field_info).format = UUID4
  ];
}

// Delete task list request.
message DeleteTaskListRequest {
  // Canonical resource name.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "homeward.damiengoehrig.ca/TaskList"
  ];
  // Opaque token bound to this exact resource and its current revision.
  string etag = 2 [(google.api.field_behavior) = REQUIRED];
  // Optional UUID4 for exact original-result deduplication for 24 hours; different intention reuse fails.
  string request_id = 3 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.field_info).format = UUID4
  ];
  // Explicitly delete live child tasks atomically; absent/false refuses children.
  bool force = 4 [(google.api.field_behavior) = OPTIONAL];
}

// List tasks request.
message ListTasksRequest {
  // Canonical parent resource name.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "homeward.damiengoehrig.ca/Task"
  ];
  // Maximum results; zero selects 100, negative is invalid, and values above 256 clamp to 256.
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];
  // Opaque continuation bound to the same caller and captured collection.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];
}

// List tasks response.
message ListTasksResponse {
  // Tasks in the captured atomic parent order.
  repeated Task tasks = 1;
  // Continuation token; empty when the captured collection is exhausted.
  string next_page_token = 2;
  // Exact size of the captured authorized collection.
  int32 total_size = 3;
}

// Get task request.
message GetTaskRequest {
  // Canonical resource name.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "homeward.damiengoehrig.ca/Task"
  ];
}

// Editable task values. No resource identity, etag or source-owned output is input.
message TaskContent {
  // Bounded human-readable task title.
  string summary = 1 [(google.api.field_behavior) = REQUIRED];
  // Initial completion state; false is a valid value.
  bool completed = 2 [(google.api.field_behavior) = OPTIONAL];
  // Optional bounded plain-text description.
  optional string description = 3 [(google.api.field_behavior) = OPTIONAL];
  // Exactly one due kind; absence means the task has no due value.
  oneof due {
    // Civil due date without an inferred time zone.
    google.type.Date due_date = 4;
    // Exact due instant with explicit display zone.
    TaskDueInstant due_instant = 5;
  }
}

// Append a new task under the current parent collection etag.
message AppendTaskRequest {
  // Canonical parent resource name.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "homeward.damiengoehrig.ca/TaskList"
  ];
  // Task resource carrying its current compound etag for an update.
  TaskContent task = 2 [(google.api.field_behavior) = REQUIRED];
  // Mandatory ordering precondition on the parent collection.
  string etag = 3 [(google.api.field_behavior) = REQUIRED];
  // Optional UUID4 for exact original-result deduplication for 24 hours; different intention reuse fails.
  string request_id = 4 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.field_info).format = UUID4
  ];
}

// The exact task appended under the parent CAS, returned from the same commit.
message AppendTaskResponse {
  // Fully populated committed task resource.
  Task task = 1;
}

// Update task request.
message UpdateTaskRequest {
  // Task resource carrying its current compound etag for an update.
  Task task = 1 [(google.api.field_behavior) = REQUIRED];
  // Editable fields to merge; absent selects populated fields, empty is a checked no-op, and sole * replaces editable fields.
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional UUID4 for exact original-result deduplication for 24 hours; different intention reuse fails.
  string request_id = 3 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.field_info).format = UUID4
  ];
}

// Delete task request.
message DeleteTaskRequest {
  // Canonical resource name.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "homeward.damiengoehrig.ca/Task"
  ];
  // Opaque token bound to this exact resource and its current revision.
  string etag = 2 [(google.api.field_behavior) = REQUIRED];
  // Optional UUID4 for exact original-result deduplication for 24 hours; different intention reuse fails.
  string request_id = 3 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.field_info).format = UUID4
  ];
}

// Move task request.
message MoveTaskRequest {
  // Canonical resource name.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "homeward.damiengoehrig.ca/Task"
  ];
  // Opaque token bound to this exact resource and its current revision.
  string etag = 2 [(google.api.field_behavior) = REQUIRED];
  // Exactly one admitted destination.
  oneof destination {
    // Move to the first position atomically.
    google.protobuf.Empty first = 3;
    // Canonical sibling resource after which to insert atomically.
    string predecessor = 4 [(google.api.resource_reference).type = "homeward.damiengoehrig.ca/Task"];
  }
  // Optional UUID4 for exact original-result deduplication for 24 hours; different intention reuse fails.
  string request_id = 5 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.field_info).format = UUID4
  ];
}

// Watch task lists request.
message WatchTaskListsRequest {
  // Canonical parent resource name.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "homeward.damiengoehrig.ca/TaskList"
  ];
  // Absent watches the authorized catalog;
  // present watches exactly this list.
  // Collection resource carrying its current etag for an update.
  optional string task_list = 2 [(google.api.resource_reference).type = "homeward.damiengoehrig.ca/TaskList"];
}

// Task list changed.
message TaskListChanged {
  // Canonical resource name.
  string task_list = 1 [(google.api.resource_reference).type = "homeward.damiengoehrig.ca/TaskList"];
  // Opaque token bound to this exact resource and its current revision.
  string etag = 2;
}

// Watch task lists response.
message WatchTaskListsResponse {
  // Positive stream sequence starting at one and increasing without gaps.
  int64 sequence = 1;
  // Exactly one admitted frame.
  oneof frame {
    // Initial admitted subscription acknowledgement.
    google.protobuf.Empty ready = 2;
    // Resource invalidation requiring an authorized reload.
    TaskListChanged changed = 3;
    // The bounded subscriber lost continuity; discard protected state and resynchronize.
    google.protobuf.Empty resync_required = 4;
  }
}

// Collection provenance, preserved for imported data.
enum TaskListOrigin {
  // No actionable value.
  TASK_LIST_ORIGIN_UNSPECIFIED = 0;
  // Local todo.
  TASK_LIST_ORIGIN_LOCAL_TODO = 1;
  // Shopping list.
  TASK_LIST_ORIGIN_SHOPPING_LIST = 2;
  // Native.
  TASK_LIST_ORIGIN_NATIVE = 3;
}
