syntax = "proto3";

package home.api.v2;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/field_info.proto";
import "google/api/resource.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option java_package = "com.home.api.v2";
option java_multiple_files = true;
option java_outer_classname = "HomeProto";

option go_package = "github.com/damione1/Homeward/gen/home/api/v2;apiv2";

// Public installation resources. Annotations describe REST bindings; they do
// not install a REST gateway. Native clients use Connect/gRPC. The private Host
// and operator protocols are not part of this service. Route activation follows
// the independently authorized domain adapters, never generated code alone.
service HomeService {
  option (google.api.default_host) = "homeward.damiengoehrig.ca";

  // Reads authorized entity metadata without refreshing or commanding hardware.
  // Authorization precedes detailed validation; unknown names return NOT_FOUND
  // only to an authorized caller. No automatic mutation or retry occurs.
  rpc GetEntity(GetEntityRequest) returns (Entity) {
    option (google.api.http) = {get: "/v2/{name=homes/*/entities/*}"};
    option (google.api.method_signature) = "name";
  }
  // Lists authorized metadata in ascending canonical name order. Tokens bind the
  // capture and caller; they confer no authority. Changed capture needs resync.
  rpc ListEntities(ListEntitiesRequest) returns (ListEntitiesResponse) {
    option (google.api.http) = {get: "/v2/{parent=homes/*}/entities"};
    option (google.api.method_signature) = "parent";
  }
  // Changes metadata only. A stale etag returns ABORTED; forbidden field changes
  // return INVALID_ARGUMENT. Output-only fields are ignored. No device I/O.
  rpc UpdateEntity(UpdateEntityRequest) returns (Entity) {
    option (google.api.http) = {
      patch: "/v2/{entity.name=homes/*/entities/*}"
      body: "entity"
    };
    option (google.api.method_signature) = "entity,update_mask";
  }
  // Reads a capability definition and its independently qualified observation.
  rpc GetCapability(GetCapabilityRequest) returns (Capability) {
    option (google.api.http) = {get: "/v2/{name=homes/*/entities/*/capabilities/*}"};
    option (google.api.method_signature) = "name";
  }
  // Lists slots owned by this entity, ordered by canonical name, without I/O.
  rpc ListCapabilities(ListCapabilitiesRequest) returns (ListCapabilitiesResponse) {
    option (google.api.http) = {get: "/v2/{parent=homes/*/entities/*}/capabilities"};
    option (google.api.method_signature) = "parent";
  }
}

// A persistent installation identity. This server serves exactly one home;
// the resource parent is not a multitenancy or cloud-account contract.
message Home {
  option (google.api.resource) = {
    type: "homeward.damiengoehrig.ca/Home"
    pattern: "homes/{home}"
    singular: "home"
    plural: "homes"
  };
  // Canonical immutable installation name, independent of host/IP and aliases.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
}

// Entity metadata; capabilities carry observations independently per trait.
// Entity identity is assigned by the registry, never derived from a label.
message Entity {
  option (google.api.resource) = {
    type: "homeward.damiengoehrig.ca/Entity"
    pattern: "homes/{home}/entities/{entity}"
    singular: "entity"
    plural: "entities"
  };
  // Canonical immutable identity; required when updating this entity.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  // User label, at most 63 Unicode characters; empty removes the override.
  string display_name = 2 [(google.api.field_behavior) = OPTIONAL];
  // Local identity creation, unrelated to hardware manufacture or discovery.
  google.protobuf.Timestamp create_time = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Last metadata change, not last observation.
  google.protobuf.Timestamp update_time = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Opaque metadata revision, required for UpdateEntity CAS; never an authority.
  string etag = 5;
}

// One stable slot composing a typed definition and observation. Future unknown
// traits remain decodable but cannot be commanded by an older implementation.
message Capability {
  option (google.api.resource) = {
    type: "homeward.damiengoehrig.ca/Capability"
    pattern: "homes/{home}/entities/{entity}/capabilities/{capability}"
    singular: "capability"
    plural: "capabilities"
  };
  // Immutable slot identity; observations do not change its name.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  // Exactly one trait is supplied. Absence is unsupported, never Power OFF.
  oneof trait {
    // Binary controllable power, reusable for a lamp, outlet or fan.
    PowerCapability power = 2;
    // Percentage semantics shared by intensity, speed or linear volume.
    LevelCapability level = 3;
  }
}


// Independent quality dimensions; missing observations never fabricate a value.
message ObservationQuality {
  // Whether the source is currently reachable; distinct from its power state.
  Availability availability = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Whether this observation is current under the source freshness contract.
  Freshness freshness = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // How the value was obtained; an acknowledgement is not an observation.
  Provenance provenance = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
}


// Binary power definition and observation. An absent observation is not OFF.
message PowerCapability {
  // Whether SetPower is supported; false means read-only.
  bool supports_set = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Last qualified value if one exists.
  PowerObservation observation = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
}
// Last power observation; absent value remains explicitly unknown.
message PowerObservation {
  // ON/OFF if known. Future values are non-actionable on an older client.
  optional PowerValue value = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Time the source observation was obtained, not response generation time.
  google.protobuf.Timestamp observed_time = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Independent availability, freshness and provenance.
  ObservationQuality quality = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Finite percentage constraints: 0 <= minimum <= maximum <= 100; positive step.
// Advertised instance bounds supplement, never replace, intrinsic domain types.
message PercentageBounds {
  // Inclusive lower bound in percent. Zero is a valid bound.
  double minimum = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Inclusive upper bound in percent.
  double maximum = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Optional positive increment relative to minimum; absent means continuous.
  optional double step = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
}
// Linear percentage definition and observation; unrelated dB gains need a
// different dimensional quantity rather than a coercion to this trait.
message LevelCapability {
  // Whether SetLevel is supported; false means read-only.
  bool supports_set = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Intrinsic [0,100] plus source-specific bounds/step, required when writable.
  PercentageBounds bounds = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Last qualified observation, absent if no value has ever been obtained.
  LevelObservation observation = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
}
// Percentage observation; missing and zero remain different states.
message LevelObservation {
  // Finite value in [0,100]; absent is unknown, not zero.
  optional double percentage = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Time of the source reading.
  google.protobuf.Timestamp observed_time = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Independent availability, freshness and provenance.
  ObservationQuality quality = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Explicit power intent. An empty message cannot silently mean OFF.
message SetPowerCommand {
  // ON or OFF only; UNSPECIFIED and unknown numeric values are invalid.
  PowerValue value = 1 [(google.api.field_behavior) = REQUIRED];
}
// Exactly one target is required; presence preserves a legitimate zero percent.
message SetLevelCommand {
  // The presence of this union is mandatory for an executable command.
  oneof target {
    // Finite percentage in [0,100], also subject to instance bounds and step.
    double percentage = 1;
  }
}

// Typed intent envelope. Admission requires authorization before detailed
// diagnostics, current source/capability/epoch checks and a durable reservation
// before I/O. Parsing this message proves representation, never authorization.
// No route is activated by the foundation schema alone.
message ExecuteCapabilityRequest {
  // Target slot; a mismatched known trait fails FAILED_PRECONDITION after authz.
  string name = 1 [(google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "homeward.damiengoehrig.ca/Capability"];
  // Exactly one explicit intention; unknown intent must never execute a fallback.
  oneof command {
    // Binary power intent.
    SetPowerCommand power = 2;
    // Linear percentage intent.
    SetLevelCommand level = 3;
  }
  // Optional UUIDv4 idempotency key. Homeward clients always provide it. Omission
  // disables client deduplication and never permits blind automatic retries.
  string request_id = 4 [(google.api.field_behavior) = OPTIONAL,
    (google.api.field_info).format = UUID4];
  // Required physical-intent deadline; enforced again at the point of effect.
  google.protobuf.Timestamp expire_time = 5 [(google.api.field_behavior) = REQUIRED];
}

// Reads entity metadata, for example homes/demo/entities/lamp-a.
message GetEntityRequest {
  // Canonical entity name; permission checked before detailed validation.
  string name = 1 [(google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "homeward.damiengoehrig.ca/Entity"];
}
// Lists entity metadata. An opaque token is not a permission grant.
message ListEntitiesRequest {
  // Installation whose entities are listed.
  string parent = 1 [(google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "homeward.damiengoehrig.ca/Entity"];
  // Zero selects 100; negative is invalid; values above 500 are clamped to 500.
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];
  // Opaque continuation bound to the caller and filter; page_size may change.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];
  // Bounded AIP-160 expression over documented fields; unsupported fields fail
  // INVALID_ARGUMENT. Empty means all authorized entities, never all house data.
  string filter = 4 [(google.api.field_behavior) = OPTIONAL];
}
// Authorized metadata page. An empty page may still contain a continuation.
message ListEntitiesResponse {
  // Resources in ascending canonical name order within the same capture.
  repeated Entity entities = 1;
  // Empty only at the end; never contains raw authorization or identity data.
  string next_page_token = 2;
}
// Updates entity metadata with independent CAS and deduplication preconditions.
message UpdateEntityRequest {
  // Entity with required name and etag; output-only input is ignored.
  Entity entity = 1 [(google.api.field_behavior) = REQUIRED];
  // Relative to Entity. Absent: populated fields; present empty: no-op;
  // '*': replace mutable fields. Unchanged immutable fields are accepted.
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = OPTIONAL];
  // Optional UUIDv4 deduplication key, systematically supplied by native clients.
  string request_id = 3 [(google.api.field_behavior) = OPTIONAL,
    (google.api.field_info).format = UUID4];
}
// Reads one authorized capability without probing the physical device.
message GetCapabilityRequest {
  // Canonical capability slot name.
  string name = 1 [(google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "homeward.damiengoehrig.ca/Capability"];
}
// Lists the independent traits of one authorized entity.
message ListCapabilitiesRequest {
  // Canonical entity name, not a provider or device alias.
  string parent = 1 [(google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "homeward.damiengoehrig.ca/Capability"];
  // Zero selects 100; negative fails; values above 500 are clamped to 500.
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];
  // Opaque continuation; caller reauthorization is required on every page.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];
}
// Slots in canonical name order. Observations have independent qualities.
message ListCapabilitiesResponse {
  // Authorized capability resources; no mutable source catalogue is embedded.
  repeated Capability capabilities = 1;
  // Empty when the capture is complete, never an authorization credential.
  string next_page_token = 2;
}

// Explicit binary intent or observation; UNSPECIFIED is not an OFF command.
enum PowerValue {
  // No known value. Invalid in executable intent; permitted as no observation.
  POWER_VALUE_UNSPECIFIED = 0;
  // Turn controllable power on.
  POWER_VALUE_ON = 1;
  // Turn controllable power off.
  POWER_VALUE_OFF = 2;
}

// Reachability of an observation's source.
enum Availability {
  // Source reachability is unknown.
  AVAILABILITY_UNSPECIFIED = 0;
  // Source is available.
  AVAILABILITY_AVAILABLE = 1;
  // Source is unavailable; a last known value may remain present.
  AVAILABILITY_UNAVAILABLE = 2;
}

// Age qualification, independent of source reachability.
enum Freshness {
  // Freshness is unknown.
  FRESHNESS_UNSPECIFIED = 0;
  // Within the source's freshness limit.
  FRESHNESS_CURRENT = 1;
  // Last known value exceeds its freshness limit.
  FRESHNESS_STALE = 2;
}

// Evidence origin of a value; never inferred from a transport ACK.
enum Provenance {
  // No established origin.
  PROVENANCE_UNSPECIFIED = 0;
  // Measured or read back from the source.
  PROVENANCE_OBSERVED = 1;
  // Computed from explicitly identified observations.
  PROVENANCE_DERIVED = 2;
}

// Closed classification for representation admission. Field paths accompany
// these reasons; human text is never a programmatic discrimination mechanism.
// This is not a permission, physical outcome or retry policy vocabulary.
enum ValidationReason {
  // No classified violation; never emitted for a rejected request.
  VALIDATION_REASON_UNSPECIFIED = 0;
  // A relative resource name does not match its documented grammar.
  VALIDATION_REASON_INVALID_NAME = 1;
  // A required explicit command intention or value was absent.
  VALIDATION_REASON_MISSING_INTENT = 2;
  // An executable enum value is not known by this implementation.
  VALIDATION_REASON_UNKNOWN_VALUE = 3;
  // A numeric value is nonfinite or outside its intrinsic bounds.
  VALIDATION_REASON_OUT_OF_RANGE = 4;
  // A supplied request identifier is not a canonical UUIDv4 representation.
  VALIDATION_REASON_INVALID_REQUEST_ID = 5;
  // The required command deadline is absent or outside the timestamp grammar.
  VALIDATION_REASON_INVALID_DEADLINE = 6;
  // Executable input contains an unrecognized field, including nested input.
  VALIDATION_REASON_UNKNOWN_FIELD = 7;
  // A mandatory value was not supplied with the required presence.
  VALIDATION_REASON_REQUIRED_VALUE = 8;
  // A supplied value does not match the documented syntax or representation.
  VALIDATION_REASON_INVALID_FORMAT = 9;
  // Individually valid fields do not form a valid combined intention.
  VALIDATION_REASON_INCONSISTENT_FIELDS = 10;
  // An update mask names an unsupported or malformed field selection.
  VALIDATION_REASON_INVALID_MASK = 11;
}
