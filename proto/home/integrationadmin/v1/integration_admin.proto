syntax = "proto3";
package home.integrationadmin.v1;

import "home/observability/v1/observability.proto";

option go_package = "github.com/damione1/Homeward/gen/home/integrationadmin/v1;integrationadminv1";

// Native integration configuration projections. Public transport lives in home.api.v2.
enum DesiredState {
  DESIRED_STATE_UNSPECIFIED = 0;
  DESIRED_STATE_ENABLED = 1;
  DESIRED_STATE_DISABLED = 2;
}
message SecretReference {
  // The descriptor's credential field, not an arbitrary YAML path.
  string field = 1;
  string integration_instance_id = 2;
  string name = 3;
}
message PublicConfiguration {
  string schema_version = 1;
  // Strict, bounded configuration fragment. Credential fields are absent;
  // their references are carried only in secrets. Never a global document.
  bytes yaml_source = 2;
  repeated SecretReference secrets = 3;
}
message IntegrationType {
  string type_id = 1;
  string manifest_version = 2;
  string schema_version = 3;
  bytes json_schema = 4;
  bytes schema_sha256 = 5;
  // Supported capability schema IDs; instance declarations remain authoritative.
  repeated string capability_schema_ids = 6;
}
message OpaqueConfiguration {
  // No executable, args, inferred driver manifest or resolved credentials.
  repeated SecretReference secrets = 1;
}
message IntegrationInstance {
  string type_id = 1;
  string integration_instance_id = 2;
  DesiredState desired_state = 3;
  oneof configuration {
    PublicConfiguration editable = 4;
    OpaqueConfiguration opaque = 5;
  }
  home.observability.v1.IntegrationReportPresence report = 6;
  home.observability.v1.IntegrationSupervision supervision = 7;
}
