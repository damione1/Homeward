syntax = "proto3";
package home.auth.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/damione1/Homeward/gen/home/auth/v1;authv1";

// Current private vocabulary: Unix operator recovery, native authorization and
// persisted MFA ceremonies. Public account/authentication RPC live in home.api.v2.
// The home.operator.v1 service uses these messages on the protected Unix socket.
// Opaque native IDs are preserved exactly; public resource names are distinct.

message AccountId { string value = 1; }

message SessionId { string value = 1; }

message ChallengeId { string value = 1; }

message InstanceId { string value = 1; }

enum AccountRole {
  ACCOUNT_ROLE_UNSPECIFIED = 0;
  ACCOUNT_ROLE_ADMIN = 1;
  ACCOUNT_ROLE_USER = 2;
}

enum AccountStatus {
  ACCOUNT_STATUS_UNSPECIFIED = 0;
  ACCOUNT_STATUS_ACTIVE = 1;
  ACCOUNT_STATUS_DISABLED = 2;
  ACCOUNT_STATUS_PENDING_INVITATION = 3;
}

enum ScopeFamily {
  SCOPE_FAMILY_UNSPECIFIED = 0;
  SCOPE_FAMILY_STATE_REGISTRY = 1;
  SCOPE_FAMILY_HISTORY = 2;
  SCOPE_FAMILY_MEDIA = 3;
  SCOPE_FAMILY_LOCATION = 4;
  SCOPE_FAMILY_ACTIONS = 5;
  SCOPE_FAMILY_DASHBOARDS = 6;
  SCOPE_FAMILY_CALENDARS = 7;
  SCOPE_FAMILY_LISTS = 8;
  SCOPE_FAMILY_LOGIC = 9;
  SCOPE_FAMILY_INTEGRATIONS = 10;
  SCOPE_FAMILY_GLOBAL_CONFIGURATION = 11;
  SCOPE_FAMILY_ACCOUNTS = 12;
  SCOPE_FAMILY_BACKUPS = 13;
}

enum ScopeOperation {
  SCOPE_OPERATION_UNSPECIFIED = 0;
  SCOPE_OPERATION_READ = 1;
  SCOPE_OPERATION_WRITE = 2;
  SCOPE_OPERATION_ADMINISTER = 3;
}

message Scope {
  ScopeFamily family = 1;
  ScopeOperation operation = 2;
}

message Account {
  AccountId id = 1;
  string login_name = 2;
  string display_name = 3;
  AccountRole role = 4;
  AccountStatus status = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  // Active, verified enrollment only. Admin policy and a restricted login
  // outcome are separate dimensions, never inferred from this boolean.
  bool second_factor_enabled = 8;
}



message BootstrapAdminRequest {
  string login_name = 1;
  string display_name = 2;
  string password = 3;
}

message BootstrapAdminResponse { Account account = 1; }

message RecoverAccountRequest {
  AccountId account_id = 1;
  string replacement_password = 2;
}

message RecoverAccountResponse { Account account = 1; }

message ResetSecondFactorRequest { AccountId account_id = 1; }

message ResetSecondFactorResponse { Account account = 1; }

message Fido2AssertionChallenge {
  bytes challenge = 1;
  string rp_id = 2;
  repeated bytes allowed_credential_ids = 3;
  InstanceId instance_id = 4;
  string origin = 5;
}

message Fido2EnrollmentChallenge {
  bytes challenge = 1;
  string rp_id = 2;
  bytes user_id = 3;
  string user_name = 4;
  InstanceId instance_id = 5;
  string origin = 6;
}

message RecoveryCodeChallenge {}

message FactorOption {
  oneof method {
    Fido2AssertionChallenge fido2 = 1;
    RecoveryCodeChallenge recovery_code = 2;
  }
}

message FactorChallenge {
  ChallengeId id = 1;
  google.protobuf.Timestamp expires_at = 2;
  // At least one distinct option is required. CompleteLogin accepts only a
  // proof matching an option offered by this exact challenge; a recovery code
  // is an explicit alternative, never a silent FIDO2 downgrade.
  repeated FactorOption options = 3;
}

message Fido2Assertion {
  bytes credential_id = 1;
  bytes authenticator_data = 2;
  bytes client_data_json = 3;
  bytes signature = 4;
  optional bytes user_handle = 5;
  // CLI derives this from client_data_json and binds it to the verified TLS
  // instance, challenge, RP ID and origin before asking CTAP for an assertion.
  // Server recomputes it from client_data_json; the client value is untrusted.
  bytes client_data_hash = 6;
}

message Fido2Attestation {
  bytes credential_id = 1;
  bytes client_data_json = 2;
  bytes attestation_object = 3;
  bytes client_data_hash = 4;
}

message FactorProof {
  oneof proof {
    Fido2Assertion fido2 = 1;
    string recovery_code = 2;
  }
}

enum AuthenticationSatisfaction {
  AUTHENTICATION_SATISFACTION_UNSPECIFIED = 0;
  AUTHENTICATION_SATISFACTION_PASSWORD_ONLY = 1;
  AUTHENTICATION_SATISFACTION_PASSWORD_FIDO2 = 2;
  AUTHENTICATION_SATISFACTION_PASSWORD_RECOVERY_CODE = 3;
}

enum AuthorizationTerminationReason {
  AUTHORIZATION_TERMINATION_REASON_UNSPECIFIED = 0;
  AUTHORIZATION_TERMINATION_REASON_CREDENTIAL_REVOKED = 1;
  // The admitted bearer expired. Native interactive clients discard its view
  // and seek RefreshSession: only AuthError expired=SESSION ends that session.
  AUTHORIZATION_TERMINATION_REASON_CREDENTIAL_EXPIRED = 2;
  AUTHORIZATION_TERMINATION_REASON_ACCOUNT_DISABLED = 3;
  AUTHORIZATION_TERMINATION_REASON_RIGHTS_CHANGED = 4;
  AUTHORIZATION_TERMINATION_REASON_AUTHORITY_UNAVAILABLE = 5;
}

message AuthorizationTermination { AuthorizationTerminationReason reason = 1; }
