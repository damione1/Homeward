syntax = "proto3";

package home.dashboard.v1;

import "google/protobuf/timestamp.proto";
import "home/auth/v1/auth.proto";
import "home/configuration/v1/configuration.proto";

option go_package = "github.com/damione1/Homeward/gen/home/dashboard/v1;dashboardv1";

message DashboardId { string value = 1; }
message SourceFile { string path = 1; bytes exact_source = 2; }
message Definition {
  DashboardId id = 1;
  home.auth.v1.AccountId owner = 2;
  string url_path = 3;
  string entry = 4;
  repeated SourceFile files = 5;
}
message Metadata {
  DashboardId id = 1;
  home.auth.v1.AccountId owner = 2;
  string profile = 3;
  home.configuration.v1.DocumentVersion version = 4;
  google.protobuf.Timestamp updated_at = 5;
  // Display label only; identity and selection always use DashboardId.
  string title = 6;
}
enum DiagnosticCode {
  DIAGNOSTIC_CODE_UNSPECIFIED = 0;
  DIAGNOSTIC_CODE_SYNTAX = 1;
  DIAGNOSTIC_CODE_INVALID_VALUE = 2;
  DIAGNOSTIC_CODE_MISSING_FIELD = 3;
  DIAGNOSTIC_CODE_UNKNOWN_FIELD = 4;
  DIAGNOSTIC_CODE_UNSUPPORTED_VARIANT = 5;
  DIAGNOSTIC_CODE_UNSUPPORTED_PROPERTY = 6;
  DIAGNOSTIC_CODE_UNBOUND_HA_USER = 7;
  DIAGNOSTIC_CODE_BLOCKED_BY_ANCESTOR = 8;
}
message Diagnostic {
  DiagnosticCode code = 1;
  string file = 2;
  uint32 line = 3;
  uint32 column = 4;
  string path = 5;
  string reason = 6;
}
message Dashboard {
  Metadata metadata = 1;
  Definition definition = 2;
  repeated Diagnostic diagnostics = 3;
  // Inert, versioned server projection of the configured Lovelace source.
  // Clients never reconstruct an installation catalogue from compiled aliases.
  NativeOverview native_overview = 4;
  NativeLayout native_layout = 5;
}

// Inert vocabulary negotiated independently from the preserved Lovelace source.
// No server-provided widget code or action expression is executable by a client.
enum LayoutKind {
  LAYOUT_KIND_UNSPECIFIED = 0;
  LAYOUT_KIND_VIEW = 1;
  LAYOUT_KIND_SECTION = 2;
  LAYOUT_KIND_GRID = 3;
  LAYOUT_KIND_HORIZONTAL_STACK = 4;
  LAYOUT_KIND_HEADING = 5;
  LAYOUT_KIND_TILE = 6;
  LAYOUT_KIND_UNSUPPORTED = 7;
  LAYOUT_KIND_RECIPE = 8;
  LAYOUT_KIND_VERTICAL_STACK = 9;
  LAYOUT_KIND_POPUP = 10;
  LAYOUT_KIND_CHIP_GROUP = 11;
  LAYOUT_KIND_WIDGET = 12;
}
enum LayoutDimensionKind {
  LAYOUT_DIMENSION_KIND_UNSPECIFIED = 0;
  LAYOUT_DIMENSION_KIND_COUNT = 1;
  LAYOUT_DIMENSION_KIND_FULL = 2;
  LAYOUT_DIMENSION_KIND_AUTO = 3;
}
message LayoutDimension { LayoutDimensionKind kind = 1; uint32 count = 2; }
enum NativeHeadingStyle {
  NATIVE_HEADING_STYLE_UNSPECIFIED = 0;
  NATIVE_HEADING_STYLE_DEFAULT = 1;
  NATIVE_HEADING_STYLE_TITLE = 2;
  NATIVE_HEADING_STYLE_SUBTITLE = 3;
}
message LayoutSource {
  string file = 1;
  uint32 line = 2;
  uint32 column = 3;
  string path = 4;
  // The original type/strategy label, including unknown custom card names.
  string variant = 5;
}
message LayoutNode {
  string id = 1;
  LayoutKind kind = 2;
  LayoutSource source = 3;
  string title = 4;
  string entity_id = 5;
  repeated string children = 6;
  string diagnostic = 7;
  uint32 columns = 8;
  LayoutDimension column_span = 9;
  LayoutDimension row_span = 10;
  optional bool square = 11;
  optional bool vertical = 12;
  optional bool hide_state = 13;
  NativeHeadingStyle heading_style = 14;
  // Stable configured view path; independent of its source array position.
  string route = 15;
  // Requires native layout version 2 and explicit client negotiation. Version 1
  // clients must receive an inert diagnostic for nodes requiring these recipes.
  NativeRecipes recipes = 16;
  NativeRecipeKind recipe_kind = 17;
  string secondary = 18;
  repeated NativeFeatureKind features = 19;
  // Version 3: a finite native widget with exact server-owned bindings.
  NativeWidget widget = 20;
  // Logical pixels. V3 servers supply container defaults explicitly; gap zero
  // means no gap. Legacy nodes retain native defaults when fields are absent.
  uint32 minimum_column_width = 21;
  uint32 gap = 22;
  repeated NativeResponsiveSpan responsive_spans = 23;
  // Finite icon vocabulary chosen by the admitted source, never downloaded SVG.
  NativeIcon icon = 24;
  // Source-selected density; this changes presentation, never command authority.
  NativeControlPresentation control_presentation = 25;
  // Presentation only, evaluated against the full logical window width. This
  // never grants an action or substitutes for NativeRecipes visibility.
  NativeScreenVisibility screen_visibility = 26;
}

// Closed viewport-width subset. Zero denotes an absent bound; comparisons are
// inclusive. Unknown fields or invalid ranges make the node inert.
message NativeScreenVisibility { uint32 min_width = 1; uint32 max_width = 2; }

enum NativeControlPresentation {
  NATIVE_CONTROL_PRESENTATION_CONTROLS = 0;
  NATIVE_CONTROL_PRESENTATION_SUMMARY = 1;
}

// Exact canonical field keys are interpreted against the current authorized
// entity view. Missing bindings never select another entity or field.
message NativeResponsiveSpan { uint32 columns = 1; uint32 span = 2; }
message NativeFieldBinding { string entity_id = 1; string field_key = 2; }
message NativeClockWeatherWidget { string timezone = 1; string weather_entity_id = 2; }
message NativeRoomWidget {
  string room_id = 1;
  NativeFieldBinding temperature = 2;
  repeated string activity_entity_ids = 3;
  repeated string active_states = 4;
}
enum NativeThermostatPresentation {
  NATIVE_THERMOSTAT_PRESENTATION_COMPACT = 0;
  NATIVE_THERMOSTAT_PRESENTATION_DETAIL = 1;
  NATIVE_THERMOSTAT_PRESENTATION_SUMMARY = 2;
}
message NativeThermostatWidget {
  string entity_id = 1;
  NativeFieldBinding current_temperature = 2;
  NativeFieldBinding target_temperature = 3;
  NativeThermostatPresentation presentation = 4;
}
message NativeAgendaWidget { string calendar_id = 1; string timezone = 2; uint32 window_seconds = 3; uint32 limit = 4; }
enum NativeTasksPresentation {
  NATIVE_TASKS_PRESENTATION_PREVIEW = 0;
  NATIVE_TASKS_PRESENTATION_SHOPPING = 1;
}
message NativeTasksWidget { string list_id = 1; uint32 limit = 2; NativeTasksPresentation presentation = 3; }
message NativeSecurityWidget { repeated string entity_ids = 1; }
message NativeObservationBinding {
  NativeFieldBinding field = 1;
  string label = 2;
  repeated string active_states = 3;
  NativeIcon icon = 4;
}
message NativeObservationsWidget { repeated NativeObservationBinding items = 1; }
message NativeNavigationWidget { NativeDestination destination = 1; }
message NativeWidget {
  oneof content {
    NativeClockWeatherWidget clock_weather = 1;
    NativeRoomWidget room = 2;
    NativeThermostatWidget thermostat = 3;
    NativeAgendaWidget agenda = 4;
    NativeTasksWidget tasks = 5;
    NativeSecurityWidget security = 6;
    NativeObservationsWidget observations = 7;
    NativeNavigationWidget navigation = 8;
  }
  NativeDestination action = 10;
  string action_label = 11;
  string empty_label = 12;
}

enum NativeRecipeKind {
  NATIVE_RECIPE_KIND_UNSPECIFIED = 0;
  NATIVE_RECIPE_KIND_TEMPLATE = 1;
  NATIVE_RECIPE_KIND_SELECT = 2;
  NATIVE_RECIPE_KIND_ALARM = 3;
  NATIVE_RECIPE_KIND_BUBBLE_BUTTON = 4;
  NATIVE_RECIPE_KIND_BUBBLE_POPUP = 5;
  NATIVE_RECIPE_KIND_CHIPS = 6;
  NATIVE_RECIPE_KIND_TEMPLATE_CHIP = 7;
  NATIVE_RECIPE_KIND_BUTTON = 8;
  NATIVE_RECIPE_KIND_ENTITY = 9;
  // Plain bounded text; no HTML, Markdown code, JS, or Jinja interpretation.
  NATIVE_RECIPE_KIND_TEXT = 10;
}
enum NativeFeatureKind {
  NATIVE_FEATURE_KIND_UNSPECIFIED = 0;
  NATIVE_FEATURE_KIND_TOGGLE = 1;
  NATIVE_FEATURE_KIND_BRIGHTNESS = 2;
  NATIVE_FEATURE_KIND_COLOR_TEMPERATURE = 3;
  NATIVE_FEATURE_KIND_TARGET_TEMPERATURE = 4;
  NATIVE_FEATURE_KIND_CLIMATE_MODES = 5;
  NATIVE_FEATURE_KIND_FAN_SPEED = 6;
  NATIVE_FEATURE_KIND_NUMERIC_INPUT = 7;
  NATIVE_FEATURE_KIND_COVER_OPEN_CLOSE = 8;
  NATIVE_FEATURE_KIND_COVER_POSITION = 9;
  NATIVE_FEATURE_KIND_ALARM_MODES = 10;
}

// These are data-only, server-resolved intentions. The client still checks its
// current session/view/capabilities and submits through ActionService. Neither
// a configured recipe nor a confirmation grants permission to an entity.
enum NativeGesture {
  NATIVE_GESTURE_UNSPECIFIED = 0;
  NATIVE_GESTURE_TAP = 1;
  NATIVE_GESTURE_HOLD = 2;
  NATIVE_GESTURE_DOUBLE_TAP = 3;
}
enum NativePresentation {
  NATIVE_PRESENTATION_UNSPECIFIED = 0;
  NATIVE_PRESENTATION_PAGE = 1;
  NATIVE_PRESENTATION_POPUP = 2;
}
message NativeDestination {
  DashboardId dashboard_id = 1;
  // Stable source identity, not an array index, HA URL, or downloaded expression.
  string node_id = 2;
  NativePresentation presentation = 3;
}
enum NativeCommandKind {
  NATIVE_COMMAND_KIND_UNSPECIFIED = 0;
  NATIVE_COMMAND_KIND_TOGGLE = 1;
  NATIVE_COMMAND_KIND_TURN_ON = 2;
  NATIVE_COMMAND_KIND_TURN_OFF = 3;
  NATIVE_COMMAND_KIND_ACTIVATE = 4;
  NATIVE_COMMAND_KIND_COVER_OPEN = 5;
  NATIVE_COMMAND_KIND_COVER_CLOSE = 6;
  NATIVE_COMMAND_KIND_COVER_STOP = 7;
  NATIVE_COMMAND_KIND_LOCK = 8;
  NATIVE_COMMAND_KIND_UNLOCK = 9;
  NATIVE_COMMAND_KIND_ALARM_ARM_HOME = 10;
  NATIVE_COMMAND_KIND_ALARM_ARM_AWAY = 11;
  NATIVE_COMMAND_KIND_ALARM_DISARM = 12;
}
message NativeEntityTarget { string entity_id = 1; }
message NativeCommand {
  string entity_id = 1;
  NativeCommandKind kind = 2;
}
message NativeNoAction {}
message NativeConfirmation { string text = 1; }
message NativeInteraction {
  NativeGesture gesture = 1;
  oneof intention {
    NativeNoAction none = 2;
    NativeEntityTarget more_info = 3;
    NativeDestination navigate = 4;
    NativeCommand command = 5;
  }
  // Presence matters even if the configured text is empty (use native prompt).
  NativeConfirmation confirmation = 6;
  LayoutSource source = 7;
}
enum NativeComparison {
  NATIVE_COMPARISON_UNSPECIFIED = 0;
  NATIVE_COMPARISON_EQUAL = 1;
  NATIVE_COMPARISON_NOT_EQUAL = 2;
}
message NativeStatePredicate {
  string entity_id = 1;
  // An exact HA state literal, not code. Unavailable/missing is never a value
  // and cannot satisfy even a not-equal test. Authorization is independent.
  string state = 2;
  NativeComparison comparison = 3;
}
message NativePredicateList { repeated NativePredicate conditions = 1; }
message NativePredicate {
  oneof condition {
    bool constant = 1;
    NativeStatePredicate state = 2;
    NativePredicateList all = 3;
    NativePredicateList any = 4;
  }
  LayoutSource source = 5;
}
message NativeRecipes {
  uint32 version = 1;
  // At most one recipe per gesture; no implicit tap when explicitly disabled.
  repeated NativeInteraction interactions = 2;
  // Absent means no predicate. Unknown/invalid predicates make the node inert.
  NativePredicate visibility = 3;
}
message NativeLayout {
  uint32 version = 1;
  repeated string views = 2;
  // A bounded forest with unique source identities, no shared child or cycle.
  repeated LayoutNode nodes = 3;
}
message ClientLayoutSupport {
  string profile = 1;
  uint32 version = 2;
  repeated LayoutKind kinds = 3;
  // Required before screen-conditioned nodes can be projected as controls.
  bool screen_visibility = 4;
}

enum NativeIcon {
  NATIVE_ICON_UNSPECIFIED = 0;
  NATIVE_ICON_HOME = 1;
  NATIVE_ICON_INFORMATION = 2;
  NATIVE_ICON_CLOCK = 3;
  NATIVE_ICON_GRID = 4;
  NATIVE_ICON_SOFA = 5;
  NATIVE_ICON_KITCHEN = 6;
  NATIVE_ICON_BED = 7;
  NATIVE_ICON_LIGHT = 8;
  NATIVE_ICON_FAN = 9;
  NATIVE_ICON_THERMOSTAT = 10;
  NATIVE_ICON_MUSIC = 11;
  NATIVE_ICON_GARAGE = 12;
  NATIVE_ICON_LOCK = 13;
  NATIVE_ICON_SHIELD = 14;
  NATIVE_ICON_WATER = 15;
  NATIVE_ICON_SUN = 16;
  NATIVE_ICON_TREE = 17;
  NATIVE_ICON_OFFICE = 18;
  NATIVE_ICON_BATH = 19;
  NATIVE_ICON_CHILD = 20;
  NATIVE_ICON_SHOPPING = 21;
  NATIVE_ICON_SCENE = 22;
  NATIVE_ICON_BATTERY = 23;
  NATIVE_ICON_POWER = 24;
}
enum ServingMode {
  SERVING_MODE_UNSPECIFIED = 0;
  SERVING_MODE_CONFIGURED = 1;
  SERVING_MODE_SYNTHETIC = 2;
}
message OverviewRoom {
  string id = 1;
  string title = 2;
  repeated string entity_ids = 3;
}
message OverviewObservation {
  string id = 1;
  string title = 2;
  string entity_id = 3;
  NativeIcon icon = 4;
}
message NativeOverview {
  uint32 version = 1;
  uint64 config_revision = 2;
  bytes config_sha256 = 3;
  string title = 4;
  repeated OverviewRoom rooms = 5;
  repeated OverviewObservation observations = 6;
  ServingMode mode = 7;
  // Must match StateService before the layout and entity view are published.
  uint64 authorization_revision = 8;
}
message ListDashboardsRequest { ClientLayoutSupport support = 1; }
message ListDashboardsResponse { repeated Metadata dashboards = 1; string resume_token = 2; }
message GetDashboardRequest { DashboardId id = 1; ClientLayoutSupport support = 2; }
message GetDashboardResponse { Dashboard dashboard = 1; string resume_token = 2; }
message CreateDashboardRequest { Definition definition = 1; }
message ReplaceDashboardRequest {
  Definition definition = 1;
  home.configuration.v1.DocumentVersion expected = 2;
}
message DeleteDashboardRequest {
  DashboardId id = 1;
  home.configuration.v1.DocumentVersion expected = 2;
}
message CreateDashboardResponse { home.configuration.v1.ActivationResult activation = 1; }
message ReplaceDashboardResponse { home.configuration.v1.ActivationResult activation = 1; }
message DeleteDashboardResponse { home.configuration.v1.ActivationResult activation = 1; }
message WatchDashboardsRequest { string resume_token = 1; }
message WatchDashboardsResponse {
  oneof result {
    ListDashboardsResponse snapshot = 1;
    home.configuration.v1.ResyncRequired resync_required = 2;
  }
}
service DashboardService {
  rpc ListDashboards(ListDashboardsRequest) returns (ListDashboardsResponse);
  rpc GetDashboard(GetDashboardRequest) returns (GetDashboardResponse);
  rpc CreateDashboard(CreateDashboardRequest) returns (CreateDashboardResponse);
  rpc ReplaceDashboard(ReplaceDashboardRequest) returns (ReplaceDashboardResponse);
  rpc DeleteDashboard(DeleteDashboardRequest) returns (DeleteDashboardResponse);
  // A changed source, owner, generation or replay epoch requires a new List/Get.
  // The server never silently skips a gap or streams newly unauthorized bytes.
  rpc WatchDashboards(WatchDashboardsRequest) returns (stream WatchDashboardsResponse);
}
