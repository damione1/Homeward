syntax = "proto3";
package home.actions.v1;

import "google/protobuf/timestamp.proto";
import "home/registry/v1/registry.proto";
import "home/helpers/v1/helpers.proto";

option go_package = "github.com/damione1/Homeward/gen/home/actions/v1;actionsv1";
message SetSwitch {
  bool on = 1;
}
message SetLight {
  optional bool on = 1;
  optional double brightness_percent = 2;
  optional uint32 color_temp_mireds = 3;
  optional double transition_seconds = 4;
}
message SetFan {
  optional bool on = 1;
  optional string speed = 2;
}
message SetClimate {
  optional double setpoint_celsius = 1;
  optional home.registry.v1.ClimateMode mode = 2;
  optional double heat_threshold_celsius = 3;
  optional double cool_threshold_celsius = 4;
  optional home.registry.v1.ClimateFanTarget fan_target = 5;
}

// An extension is a typed/versioned envelope. Validation requires a registered codec
// matching schema_id, major and descriptor hash, then authorization; never execute a raw blob.
message ExtensionPayload {
  string schema_id = 1;
  uint32 major = 2;
  bytes descriptor_sha256 = 3;
  bytes protobuf_payload = 4;
}
message ActionArgs {
  oneof arguments {
    SetSwitch set_switch = 1;
    ExtensionPayload extension = 2;
    SetLight set_light = 3;
    SetFan set_fan = 4;
    SetClimate set_climate = 5;
    home.helpers.v1.HelperAction helper = 6;
  }
}
message CommandRequest {
  reserved 10;
  reserved "retry_automatically";
  string command_id = 1;
  string admission_epoch = 2;
  uint64 config_revision = 3;
  home.registry.v1.EntityRef target = 4;
  string capability_schema_id = 5;
  ActionArgs arguments = 6;
  optional uint64 expected_revision = 7;
  google.protobuf.Timestamp expires_at = 8;
  string endpoint = 9;
}
enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INVALID_ARGUMENT = 1;
  ERROR_CODE_UNSUPPORTED_CAPABILITY = 2;
  ERROR_CODE_STALE_EPOCH = 3;
  ERROR_CODE_STALE_CONFIGURATION = 4;
  ERROR_CODE_PERMISSION_DENIED = 5;
}
message ErrorDetail {
  string reason = 1;
  optional uint64 current_revision = 2;
}
message ContractError {
  ErrorCode code = 1;
  string field_path = 2;
  string message = 3;
  ErrorDetail detail = 4;
}
enum ActionStatus {
  ACTION_STATUS_UNSPECIFIED = 0;
  ACTION_STATUS_ACCEPTED = 1;
  ACTION_STATUS_DISPATCHED = 2;
  ACTION_STATUS_ACKNOWLEDGED = 3;
  ACTION_STATUS_CONFIRMED = 4;
  ACTION_STATUS_FAILED = 5;
  ACTION_STATUS_CANCELLED = 6;
  ACTION_STATUS_INDETERMINATE = 7;
}
message CommandResponse {
  string command_id = 1;
  ActionStatus status = 2;
  ContractError error = 3;
}
