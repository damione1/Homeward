[package]
name = "home-client-actions"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
home-wire-contract = { path = "../wire" }
home-client-model = { path = "../model" }
home-client-session = { path = "../session" }
home-client-transport = { path = "../transport" }
buffa = "=0.9.2"
buffa-types = "=0.9.2"
getrandom = "=0.3.4"
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }

[dev-dependencies]
buffa-types = "=0.9.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"
