[package]
name = "home-client-platform"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
home-client-model = { path = "../model" }
home-client-session = { path = "../session" }
zeroize = "1"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "=3.7.0"
core-foundation-sys = "=0.8.7"
objc2 = "=0.5.3"
block2 = "=0.5.1"
objc2-foundation = { version = "=0.2.2", default-features = false, features = ["std", "NSArray", "NSBundle", "NSError", "NSObject", "NSString"] }
objc2-user-notifications = { version = "=0.2.2", default-features = false, features = ["std", "block2", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationSettings", "UNNotificationTrigger", "UNUserNotificationCenter"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "=0.21.1"
android-activity = { version = "=0.6.1", features = ["native-activity"] }
base64 = "0.22"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
home-client-transport = { path = "../transport" }
home-wire-contract = { path = "../wire" }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
