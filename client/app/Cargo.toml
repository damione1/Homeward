[package]
name = "homeward-app"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "homeward-desktop"
path = "src/main.rs"

[dependencies]
home-client-model = { path = "../model" }
home-wire-contract = { path = "../wire" }
home-client-transport = { path = "../transport" }
home-client-session = { path = "../session" }
home-client-platform = { path = "../platform" }
home-client-cache = { path = "../cache" }
home-client-actions = { path = "../actions" }
buffa = "=0.9.2"
buffa-types = "=0.9.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
zeroize = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
rustls-pemfile = "2"
url = "2"
png = "=0.18.1"
slint-kit = "=0.2.0"
slint-kit-pro = { path = "../../.tools/frontend-kits/pro/crates/kit-pro" }

[target.'cfg(not(target_os = "android"))'.dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-18", "backend-winit", "renderer-software", "accessibility", "unstable-winit-030"] }

[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-18", "backend-android-activity-06", "renderer-software"] }

[build-dependencies]
slint-kit-pro-build = { path = "../../.tools/frontend-kits/pro/crates/kit-pro-build" }

[dev-dependencies]
connectrpc = { version = "=0.9.1", default-features = false }
i-slint-backend-testing = "=1.18.1"

[package.metadata.android]
package = "ca.homeward.frontend.dev"
apk_name = "homeward-dev"
build_targets = ["aarch64-linux-android"]
assets = "assets"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 35

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[package.metadata.android.application]
label = "Homeward Dev"
uses_cleartext_traffic = false
debuggable = true

[package.metadata.android.application.activity]
config_changes = "orientation|keyboardHidden|screenSize|smallestScreenSize|screenLayout|uiMode"
