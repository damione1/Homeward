[package]
name = "home-client-cache"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
home-client-model = { path = "../model" }
home-wire-contract = { path = "../wire" }
buffa = "=0.9.2"
buffa-types = "=0.9.2"
sha2 = "0.10"
home-client-transport = { path = "../transport" }
home-client-session = { path = "../session" }
tokio = { version = "1", features = ["macros", "sync", "time", "rt"] }
tokio-util = { version = "0.7", features = ["rt"] }
async-trait = "0.1"

[dev-dependencies]
connectrpc = { version = "=0.9.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"
